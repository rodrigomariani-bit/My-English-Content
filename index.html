<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My English Content</title>
<meta name="description" content="Materiais de Ensino de Inglês">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --tinta:#131B35; --tinta-2:#4A5575; --tinta-3:#6E7A99;
  --fundo:#F5F6FB; --papel:#FFFFFF; --linha:#E2E6F1;
  --darwin:#2B59E6; --darwin-esc:#1B3DB0; --darwin-claro:#E8EEFF;
  --curso:#D43C25; --curso-esc:#A92A17; --curso-claro:#FFEAE4;
  --alea:#087F6C; --alea-esc:#05604F; --alea-claro:#DDF5EF;
  --sol:#FFB81F;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;color:var(--tinta);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;line-height:1.45;
  background:
    radial-gradient(760px 380px at 4% -80px,#DFE8FF 0,transparent 70%),
    radial-gradient(680px 360px at 96% -60px,#FFE3DA 0,transparent 70%),
    var(--fundo);
  background-repeat:no-repeat;
}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
.oculto{display:none!important}
.pagina{max-width:1160px;margin:0 auto;padding:clamp(28px,5vw,56px) clamp(16px,3vw,28px) 40px}

/* cabeçalho */
.cabeca{display:flex;align-items:flex-end;justify-content:space-between;gap:24px 40px;flex-wrap:wrap;margin-bottom:22px}
.marca{display:flex;align-items:center;gap:16px;min-width:0}
.logo{width:60px;height:60px;flex:none}
.cabeca h1{font-family:Sora,"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:clamp(30px,4.6vw,46px);line-height:1.05;letter-spacing:-.025em;margin:0}
.cabeca p{margin:6px 0 0;color:var(--tinta-2);font-size:clamp(15px,1.6vw,17px);font-weight:600}
.busca{position:relative;flex:1 1 300px;max-width:400px}
.busca svg{position:absolute;left:16px;top:50%;width:20px;height:20px;transform:translateY(-50%);color:var(--tinta-3);pointer-events:none}
.busca input{width:100%;height:52px;border:1.5px solid var(--linha);border-radius:16px;background:var(--papel);padding:0 44px 0 46px;font-size:16px;font-weight:600;box-shadow:0 6px 18px rgba(30,45,90,.06);outline:none;transition:border-color .15s,box-shadow .15s}
.busca input::placeholder{color:var(--tinta-3);font-weight:500}
.busca input:focus{border-color:var(--darwin);box-shadow:0 0 0 4px rgba(43,89,230,.14)}
.busca input::-webkit-search-cancel-button{display:none}
.limpar{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:10px;background:transparent;color:var(--tinta-3);cursor:pointer;display:grid;place-items:center}
.limpar:hover{background:var(--fundo);color:var(--tinta)}
.limpar svg{position:static;transform:none;width:16px;height:16px}

/* novidades */
.novos{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin-bottom:26px}
.novos b{font-size:13px;font-weight:800;color:var(--tinta-2);margin-right:2px}
.novo{display:inline-flex;align-items:center;gap:8px;background:var(--papel);border:1.5px solid var(--linha);border-radius:999px;padding:6px 14px 6px 10px;font-size:14px;font-weight:700;transition:border-color .15s,transform .15s}
.novo i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.novo:hover{border-color:var(--c);transform:translateY(-1px)}

/* divisões */
.divisoes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:30px}
.divisao{position:relative;overflow:hidden;text-align:left;border:0;border-radius:24px;padding:24px 24px 22px;background:var(--t);color:var(--tinta);cursor:pointer;display:flex;flex-direction:column;gap:18px;min-height:176px;transition:transform .18s,box-shadow .18s,background .18s,color .18s}
.divisao:hover{transform:translateY(-3px)}
.divisao:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.divisao[aria-selected="true"]{background:var(--c);color:#fff;box-shadow:0 18px 36px -12px var(--c)}
.divisao::after{content:"";position:absolute;right:-46px;top:-46px;width:170px;height:170px;border-radius:50%;background:var(--c);opacity:.08}
.divisao[aria-selected="true"]::after{background:#fff;opacity:.12}
.divisao::before{content:"";position:absolute;right:46px;bottom:-62px;width:118px;height:118px;border-radius:50%;background:var(--c);opacity:.06}
.divisao[aria-selected="true"]::before{background:#fff;opacity:.08}
.topo-div{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.icone-div{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--papel);color:var(--c)}
.icone-div svg{width:25px;height:25px}
.num-div{font-family:Sora,sans-serif;font-weight:800;font-size:34px;line-height:1;letter-spacing:-.02em;color:var(--c)}
.divisao[aria-selected="true"] .num-div{color:#fff}
.texto-div{position:relative;z-index:1}
.divisao h2{font-family:Sora,sans-serif;font-weight:700;font-size:clamp(20px,2.3vw,25px);line-height:1.15;letter-spacing:-.015em;margin:0}
.divisao span.sub{display:block;margin-top:5px;font-size:14px;font-weight:600;color:var(--tinta-2)}
.divisao[aria-selected="true"] span.sub{color:rgba(255,255,255,.86)}

/* conteúdo */
.grupo{margin-bottom:30px}
.cab-grupo{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cab-grupo h3{font-family:Sora,sans-serif;font-weight:700;font-size:18px;letter-spacing:-.01em;margin:0}
.cont{font-size:12.5px;font-weight:800;border-radius:999px;padding:2px 9px;background:var(--t);color:var(--e)}
.cab-grupo::after{content:"";flex:1;height:1.5px;background:var(--linha)}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.item{display:flex;align-items:center;gap:14px;background:var(--papel);border:1.5px solid var(--linha);border-radius:18px;padding:14px 16px;transition:transform .15s,border-color .15s,box-shadow .15s;min-width:0}
.item:hover{transform:translateY(-2px);border-color:var(--c);box-shadow:0 12px 24px -14px rgba(30,45,90,.35)}
.item:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.icone-item{width:46px;height:46px;border-radius:14px;background:var(--t);color:var(--c);display:grid;place-items:center;flex:none}
.icone-item svg{width:23px;height:23px}
.corpo-item{min-width:0;flex:1}
.corpo-item strong{display:block;font-weight:800;font-size:16px;line-height:1.28}
.corpo-item small{display:block;margin-top:3px;color:var(--tinta-3);font-size:13px;font-weight:600}
.seta{width:20px;height:20px;color:var(--c);flex:none;opacity:0;transform:translateX(-5px);transition:.15s}
.item:hover .seta{opacity:1;transform:none}
.selo-novo{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:7px;background:var(--sol);color:#402A00;font-size:11px;font-weight:800;vertical-align:2px}
.embreve{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:12px;color:var(--tinta-3);font-size:13.5px;font-weight:700}
.embreve span{border:1.5px dashed #CBD2E3;border-radius:999px;padding:4px 12px;color:var(--tinta-2)}
.vazio{background:var(--papel);border:1.5px dashed #CBD2E3;border-radius:18px;padding:30px 20px;text-align:center;color:var(--tinta-2);font-weight:600}
.onde{font-size:12px;font-weight:800;color:var(--e);background:var(--t);border-radius:7px;padding:2px 8px;margin-right:6px}
.titulo-busca{font-family:Sora,sans-serif;font-weight:700;font-size:18px;margin:0 0 14px}

/* lição que abre em pasta: atividade + LCP */
.grade{align-items:start}
.item.pasta{display:block;padding:0}
.item.pasta.aberta{border-color:var(--c);box-shadow:0 12px 24px -14px rgba(30,45,90,.35)}
.item.pasta.aberta:hover{transform:none}
.abre{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;cursor:pointer;border-radius:18px}
.abre:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.chev{width:20px;height:20px;color:var(--c);flex:none;transition:transform .2s}
.aberta .chev{transform:rotate(90deg)}
.filhos{display:grid;gap:8px;padding:0 12px 12px}
.filhos[hidden]{display:none}
.filho{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--fundo);border:1.5px solid transparent;transition:border-color .15s,background .15s}
.filho:hover{border-color:var(--c);background:var(--papel)}
.filho:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.filho .icone-item{width:38px;height:38px;border-radius:12px}
.filho .icone-item svg{width:20px;height:20px}
.filho strong{display:block;font-weight:800;font-size:15px;line-height:1.25}
.filho small{display:block;margin-top:2px;color:var(--tinta-3);font-size:12.5px;font-weight:600}

footer{margin-top:18px;padding-top:18px;border-top:1.5px solid var(--linha);color:var(--tinta-3);font-size:13.5px;font-weight:600;text-align:center}

@media (max-width:760px){
  .cabeca{align-items:stretch}
  .busca{max-width:none;flex-basis:100%}
  .divisoes{grid-template-columns:1fr;gap:10px}
  .divisao{flex-direction:row;align-items:center;gap:14px;min-height:0;padding:14px 16px;border-radius:18px}
  .topo-div{display:contents}
  .icone-div{order:0;width:44px;height:44px;flex:none}
  .texto-div{order:1;flex:1;min-width:0}
  .num-div{order:2;font-size:26px;position:relative;z-index:1}
  .divisao::before{display:none}
  .logo{width:50px;height:50px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


/* Meu curso: pastas por nível e página do curso (nov/2026) */
.pastas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:26px 20px;margin:8px 0 34px}
.pastinha{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:214px;padding:54px 22px 20px;border:0;border-radius:6px 24px 24px 24px;
  background:linear-gradient(150deg,var(--k-claro) 0%,#fff 92%);box-shadow:0 1px 0 rgba(19,27,53,.04),0 16px 30px -18px var(--k);color:var(--tinta);text-align:left;cursor:pointer;
  transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s;isolation:isolate;margin-top:16px}
.pastinha::before{content:"";position:absolute;left:0;top:-16px;width:46%;height:24px;border-radius:14px 18px 0 0;background:var(--k-claro);z-index:-1}
.pastinha .folhas{position:absolute;left:18px;right:18px;top:-6px;height:70px;z-index:-1;pointer-events:none}
.pastinha .folhas i{position:absolute;inset:0;border-radius:10px;background:#fff;border:1.5px solid var(--linha);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.pastinha .folhas i:nth-child(1){transform:rotate(-3deg) translateY(6px)}
.pastinha .folhas i:nth-child(2){transform:rotate(2.5deg) translateY(4px)}
.pastinha .frente{position:absolute;inset:34px 0 0;border-radius:18px 24px 24px 24px;background:linear-gradient(155deg,var(--k) 0%,var(--k-esc) 100%);z-index:-1;transition:transform .22s}
.pastinha:hover{transform:translateY(-4px);box-shadow:0 1px 0 rgba(19,27,53,.04),0 26px 40px -20px var(--k)}
.pastinha:hover .folhas i:nth-child(1){transform:rotate(-6deg) translate(-6px,-14px)}
.pastinha:hover .folhas i:nth-child(2){transform:rotate(5deg) translate(8px,-20px)}
.pastinha:focus-visible{outline:3px solid var(--k);outline-offset:4px}
.pastinha .nivel{position:absolute;right:18px;top:44px;font-family:Sora,sans-serif;font-weight:800;font-size:56px;line-height:1;letter-spacing:-.04em;color:rgba(255,255,255,.28)}
.pastinha .rot{color:rgba(255,255,255,.85);font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.pastinha h3{margin:4px 0 12px;font-family:Sora,sans-serif;font-weight:800;font-size:27px;line-height:1.05;letter-spacing:-.02em;color:#fff}
.pastinha .chips{display:flex;flex-wrap:wrap;gap:6px;padding-right:46px}
.pastinha .chips span{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:800;backdrop-filter:blur(2px)}
.pastinha .chips svg{width:14px;height:14px}
.pastinha .abrir{position:absolute;right:16px;bottom:18px;width:38px;height:38px;border-radius:12px;background:#fff;color:var(--k-esc);display:grid;place-items:center;transition:transform .2s}
.pastinha .abrir svg{width:20px;height:20px}
.pastinha:hover .abrir{transform:translateX(3px)}
.pastinha.breve{cursor:default;box-shadow:none;background:transparent}
.pastinha.breve::before{background:#E9ECF4}
.pastinha.breve .frente{background:repeating-linear-gradient(135deg,#EEF1F7 0 12px,#E7EAF2 12px 24px);border:1.5px dashed #C9D0E0}
.pastinha.breve h3,.pastinha.breve .rot{color:var(--tinta-3)}
.pastinha.breve .nivel{color:rgba(19,27,53,.08)}
.pastinha.breve:hover{transform:none}
.pastinha.breve .chips span{background:#fff;color:var(--tinta-3)}
.dica-curso{color:var(--tinta-2);font-weight:600;font-size:15px;margin:-6px 0 10px}

/* página do curso */
.curso-vista{animation:entra .35s cubic-bezier(.2,.8,.2,1)}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.voltar{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:12px;background:var(--papel);border:1.5px solid var(--linha);font-weight:800;font-size:14px;color:var(--tinta-2);cursor:pointer;margin-bottom:16px;transition:border-color .15s,color .15s}
.voltar svg{width:18px;height:18px;transform:rotate(180deg)}
.voltar:hover{border-color:var(--k);color:var(--k-esc)}
.voltar:focus-visible{outline:3px solid var(--k);outline-offset:2px}
.heroi{position:relative;overflow:hidden;border-radius:28px;padding:28px clamp(20px,4vw,34px) 24px;background:linear-gradient(135deg,var(--k) 0%,var(--k-esc) 100%);color:#fff;margin-bottom:22px;box-shadow:0 24px 44px -26px var(--k)}
.heroi::after{content:attr(data-nivel);position:absolute;right:clamp(12px,3vw,30px);bottom:-30px;font-family:Sora,sans-serif;font-weight:800;font-size:clamp(120px,18vw,190px);line-height:1;letter-spacing:-.06em;color:rgba(255,255,255,.12);pointer-events:none}
.heroi .rot{font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.heroi h2{margin:6px 0 14px;font-family:Sora,sans-serif;font-weight:800;font-size:clamp(30px,5vw,44px);line-height:1.02;letter-spacing:-.025em}
.heroi .chips{display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1}
.heroi .chips span{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.17);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:800}
.heroi .chips svg{width:16px;height:16px}
.filtros{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--papel);border:1.5px solid var(--linha);border-radius:14px;margin-bottom:18px}
.filtros button{border:0;background:transparent;border-radius:10px;padding:7px 14px;font-weight:800;font-size:14px;color:var(--tinta-2);cursor:pointer;transition:background .15s,color .15s}
.filtros button[aria-pressed="true"]{background:var(--k);color:#fff}
.filtros button:focus-visible{outline:3px solid var(--k);outline-offset:2px}
.cab-curso{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.cab-curso h3{font-family:Sora,sans-serif;font-weight:700;font-size:18px;margin:0}
.cab-curso .cont{background:var(--k-claro);color:var(--k-esc)}
.cab-curso::after{content:"";flex:1;height:1.5px;background:var(--linha)}
.licoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,232px),1fr));gap:14px;margin-bottom:28px}
.licao{position:relative;display:flex;flex-direction:column;gap:12px;background:var(--papel);border:1.5px solid var(--linha);border-radius:20px;padding:16px;transition:transform .15s,border-color .15s,box-shadow .15s}
.licao:hover{transform:translateY(-2px);border-color:var(--k);box-shadow:0 14px 26px -18px rgba(30,45,90,.45)}
.licao .topo{display:flex;align-items:center;gap:12px}
.licao .num{width:48px;height:48px;border-radius:15px;background:var(--k-claro);color:var(--k-esc);display:grid;place-items:center;font-family:Sora,sans-serif;font-weight:800;font-size:21px;flex:none}
.licao .tit{min-width:0}
.licao .tit strong{display:block;font-family:Sora,sans-serif;font-weight:700;font-size:16.5px;line-height:1.15}
.licao .tit small{display:block;margin-top:2px;color:var(--tinta-3);font-size:12.5px;font-weight:700}
.licao .acoes{display:grid;gap:7px}
.acao{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:13px;background:var(--fundo);border:1.5px solid transparent;font-weight:800;font-size:14px;transition:background .15s,border-color .15s,color .15s}
.acao svg{width:19px;height:19px;color:var(--k-esc);flex:none}
.acao .seta{opacity:.5;transform:none;margin-left:auto;width:17px;height:17px}
.acao:hover{background:var(--papel);border-color:var(--k);color:var(--k-esc)}
.acao:hover .seta{opacity:1}
.acao:focus-visible{outline:3px solid var(--k);outline-offset:2px}
.acao.falta{background:transparent;border:1.5px dashed var(--linha);color:var(--tinta-3);font-weight:700;cursor:default}
.acao.falta svg{color:var(--tinta-3)}
.licao .selo-novo{position:absolute;top:12px;right:12px;margin:0}
.provas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px;margin-bottom:28px}
.prova{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:linear-gradient(150deg,var(--k-claro),#fff 85%);border:1.5px solid var(--linha);transition:transform .15s,border-color .15s}
.prova:hover{transform:translateY(-2px);border-color:var(--k)}
.prova .icone-item{background:var(--k);color:#fff}
.prova strong{display:block;font-family:Sora,sans-serif;font-weight:700;font-size:16px}
.prova small{display:block;color:var(--tinta-3);font-size:12.5px;font-weight:700;margin-top:2px}
@media (max-width:760px){
  .pastas{grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:24px 14px}
  .pastinha{min-height:180px}
  .pastinha h3{font-size:23px}
  .licoes{grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:10px}
  .licao{padding:12px;border-radius:16px}
  .licao .num{width:40px;height:40px;font-size:18px;border-radius:12px}
  .acao{padding:8px 10px;font-size:13px}
}
@media (max-width:520px){
  .licoes{grid-template-columns:minmax(0,1fr)}
  .licao .acoes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .licao .acoes .acao:only-child{grid-column:1/-1}
}
/* Início com duas portas: aluno (só o curso) e professor (painel, Darwin, aleatórios) · nov/2026 */
[hidden]{display:none!important}
body[data-tela="inicio"] .busca{display:none}
.marca{border-radius:18px}
.marca:focus-visible{outline:3px solid var(--darwin);outline-offset:4px}
.boas-vindas{margin:4px 0 18px;color:var(--tinta-2);font-size:clamp(16px,1.8vw,19px);font-weight:600}
.inicio{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:0 0 34px}
.porta{position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;gap:16px;min-height:360px;padding:28px clamp(22px,3vw,34px) 24px;border-radius:30px;color:#fff;box-shadow:0 26px 50px -30px var(--sombra);transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s}
.porta:hover{transform:translateY(-4px);box-shadow:0 34px 60px -28px var(--sombra)}
.porta:focus-visible{outline:3px solid var(--sombra);outline-offset:4px}
.porta.aluno{--sombra:#D43C25;background:radial-gradient(420px 260px at 100% 0,rgba(255,184,31,.35),transparent 70%),linear-gradient(140deg,#EE5A3F 0%,#C42E19 100%)}
.porta.prof{--sombra:#131B35;background:radial-gradient(420px 260px at 100% 0,rgba(43,89,230,.55),transparent 70%),linear-gradient(140deg,#26345A 0%,#131B35 100%)}
.porta .agua{position:absolute;right:-34px;bottom:-46px;width:250px;height:250px;color:#fff;opacity:.09;z-index:-1;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.porta:hover .agua{transform:rotate(-6deg) scale(1.05)}
.topo-porta{display:flex;align-items:center;gap:12px}
.icone-porta{width:54px;height:54px;border-radius:17px;background:rgba(255,255,255,.17);display:grid;place-items:center;flex:none}
.icone-porta svg{width:29px;height:29px}
.porta .rot{font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.86}
.porta h2{margin:0;font-family:Sora,sans-serif;font-weight:800;font-size:clamp(30px,3.6vw,40px);line-height:1.02;letter-spacing:-.025em}
.porta p{margin:8px 0 0;font-size:15.5px;font-weight:600;opacity:.9;max-width:36ch}
.porta .lista{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.porta .lista span{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:13.5px;font-weight:800}
.porta .lista svg{width:16px;height:16px}
.porta .lista i{width:9px;height:9px;border-radius:50%;background:#fff;flex:none}
.rodape-porta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:14px;border-top:1.5px solid rgba(255,255,255,.18)}
.rodape-porta .numeros{font-size:14px;font-weight:700;opacity:.88}
.entrar{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:14px;background:#fff;color:var(--sombra);font-weight:800;font-size:15px}
.entrar svg{width:18px;height:18px;transition:transform .2s}
.porta:hover .entrar svg{transform:translateX(3px)}

/* barra de cada área */
.barra-area{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.inicio-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:12px;background:var(--papel);border:1.5px solid var(--linha);font-weight:800;font-size:14px;color:var(--tinta-2);transition:border-color .15s,color .15s}
.inicio-btn svg{width:18px;height:18px;transform:rotate(180deg)}
.inicio-btn:hover{border-color:var(--c);color:var(--e)}
.inicio-btn:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.selo-area{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-weight:800;font-size:14px;background:var(--t);color:var(--e)}
.selo-area svg{width:18px;height:18px}
.link-area{margin-left:auto;font-weight:800;font-size:14px;color:var(--tinta-2);padding:8px 4px;border-bottom:1.5px dashed transparent}
.link-area:hover{color:var(--curso-esc);border-bottom-color:currentColor}

/* painel da turma, no topo da área do professor */
.painel{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:22px;color:#fff;margin-bottom:22px;background:radial-gradient(360px 200px at 100% 0,rgba(43,89,230,.5),transparent 70%),linear-gradient(135deg,#26345A,#131B35);box-shadow:0 20px 36px -24px #131B35;transition:transform .18s,box-shadow .18s}
.painel:hover{transform:translateY(-2px);box-shadow:0 26px 44px -24px #131B35}
.painel:focus-visible{outline:3px solid var(--darwin);outline-offset:3px}
.icone-painel{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.icone-painel svg{width:27px;height:27px}
.painel .txt{min-width:0;flex:1}
.painel strong{display:block;font-family:Sora,sans-serif;font-weight:700;font-size:19px;line-height:1.2}
.painel small{display:block;margin-top:3px;opacity:.84;font-size:14px;font-weight:600}
.seta-p{width:42px;height:42px;border-radius:13px;background:#fff;color:#131B35;display:grid;place-items:center;flex:none;transition:transform .2s}
.seta-p svg{width:20px;height:20px}
.painel:hover .seta-p{transform:translateX(3px)}
.divisoes.duas{grid-template-columns:repeat(2,minmax(0,1fr))}

/* código do aluno: pedido na entrada da área do aluno */
body[data-portaria] .busca{display:none}
.portaria{max-width:540px;margin:10px auto 36px;padding:30px clamp(20px,4vw,34px) 26px;background:var(--papel);border:1.5px solid var(--linha);border-radius:28px;text-align:center;box-shadow:0 26px 48px -32px rgba(30,45,90,.5);animation:entra .35s cubic-bezier(.2,.8,.2,1)}
.portaria .ic{width:66px;height:66px;margin:0 auto 14px;border-radius:21px;display:grid;place-items:center;background:var(--curso-claro);color:var(--curso-esc)}
.portaria .ic svg{width:32px;height:32px}
.portaria h2{margin:0;font-family:Sora,sans-serif;font-weight:800;font-size:clamp(24px,3vw,30px);letter-spacing:-.02em}
.portaria p{margin:8px auto 20px;max-width:42ch;color:var(--tinta-2);font-weight:600}
.portaria form{display:flex;gap:10px;flex-wrap:wrap}
.portaria input{flex:1 1 220px;min-width:0;height:56px;border:1.5px solid var(--linha);border-radius:16px;padding:0 16px;background:var(--fundo);font-family:Sora,sans-serif;font-size:21px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:center;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
.portaria input::placeholder{color:#B5BCCF;letter-spacing:.06em}
.portaria input:focus{border-color:var(--curso);background:var(--papel);box-shadow:0 0 0 4px rgba(212,60,37,.14)}
.portaria form button{flex:1 1 130px;height:56px;border:0;border-radius:16px;background:var(--curso);color:#fff;font-weight:800;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.portaria form button:hover{background:var(--curso-esc)}
.portaria form button:disabled{opacity:.6;cursor:progress}
.portaria form button svg{width:19px;height:19px}
.portaria form button:focus-visible{outline:3px solid var(--curso);outline-offset:2px}
.portaria .erro{min-height:22px;margin:12px 0 0;color:#C92A2A;font-size:14px;font-weight:700}
.portaria .sem{border:0;background:none;padding:2px 0;margin-top:10px;color:var(--tinta-2);font-weight:800;font-size:14px;cursor:pointer;border-bottom:1.5px dashed currentColor}
.portaria .sem:hover{color:var(--curso-esc)}
.portaria .obs{display:block;margin:12px auto 0;max-width:40ch;color:var(--tinta-3);font-size:12.5px;font-weight:600}
.quem{display:inline-flex;align-items:center;gap:8px;margin-left:auto;padding:7px 14px 7px 10px;border-radius:999px;background:var(--papel);border:1.5px solid var(--linha);font-size:14px;font-weight:700;color:var(--tinta-2)}
.quem svg{width:17px;height:17px;color:var(--curso)}
.quem b{color:var(--tinta);font-weight:800}
.quem span{font-family:Sora,sans-serif;font-size:12.5px;letter-spacing:.04em;color:var(--tinta-3)}
.quem + .link-area{margin-left:0}
button.link-area{border:0;background:none;cursor:pointer;font:inherit;font-weight:800;font-size:14px}

@media (max-width:760px){
  .inicio{grid-template-columns:1fr;gap:14px}
  .porta{min-height:0;padding:22px 20px 20px;border-radius:24px;gap:14px}
  .porta .agua{width:190px;height:190px}
  .icone-porta{width:46px;height:46px;border-radius:14px}
  .divisoes.duas{grid-template-columns:1fr}
  .link-area{margin-left:0}
  .painel{padding:14px 16px;gap:12px}
  .icone-painel{width:44px;height:44px}
  .painel small{font-size:13px}
}
/* fim das portas */
</style>

      <div><h2>Acesso do aluno</h2><p>As lições do curso, nível por nível, com as atividades, os LCPs e os practice tests.</p></div>
      <div class="lista">${cursos.map(c => `<span><i style="background:${c.t}"></i>${esc(c.nome)}</span>`).join('')}${embreve.map(n => `<span style="opacity:.7">${esc(n)} · em breve</span>`).join('')}</div>
      <div class="rodape-porta"><span class="numeros">${plural(soma(c => c.licoes.length), 'lição', 'lições')} · ${plural(soma(c => c.nAtiv), 'atividade', 'atividades')} · ${plural(soma(c => c.nLcp), 'LCP', 'LCPs')}</span><span class="entrar">Entrar${ic('seta')}</span></div>
    </a>
    <a class="porta prof" href="#professor">
      <svg class="agua" aria-hidden="true"><use href="#i-quadro"/></svg>
      <div class="topo-porta"><span class="icone-porta">${ic('quadro')}</span><span class="rot">Professor Rodrigo</span></div>
      <div><h2>Acesso do professor</h2><p>O painel da turma, com as respostas dos alunos, e os materiais do Darwin e os aleatórios.</p></div>
      <div class="lista"><span>${ic('painel')}Painel da turma</span>${PROF.map(s => `<span>${ic(s.icone)}${esc(s.nome)} · ${contar(s)}</span>`).join('')}</div>
      <div class="rodape-porta"><span class="numeros">${plural(doProf.length, 'material', 'materiais')} + o painel</span><span class="entrar">Entrar${ic('seta')}</span></div>
    </a>`;
  }

  function cartao(i, comLocal){
    const local = comLocal ? `<span class="onde">${esc(tela === 'aluno' ? i.grupo : i.secao.nome)}</span>` : '';
    const selo = maisNovo.has(i.h) ? '<span class="selo-novo">Novo</span>' : '';
    return `<a class="item" style="${estilo(i.secao.id)}" href="${esc(i.h)}">
      <span class="icone-item"><svg><use href="#i-${i.i}"/></svg></span>
      <span class="corpo-item"><strong>${esc(i.t)}${selo}</strong><small>${local}${esc(i.e.join(' · '))}</small></span>
      <svg class="seta"><use href="#i-seta"/></svg></a>`;
  }
  function pasta(i, s){
    const id = 'p-' + norm(i.t).replace(/[^a-z0-9]+/g, '-');
    const selo = i.filhos.some(f => maisNovo.has(f.h)) ? '<span class="selo-novo">Novo</span>' : '';
    return `<div class="item pasta" style="${estilo(s.id)}">
      <button class="abre" type="button" aria-expanded="false" aria-controls="${id}">
        <span class="icone-item"><svg><use href="#i-${i.i}"/></svg></span>
        <span class="corpo-item"><strong>${esc(i.t)}${selo}</strong><small>${esc(i.filhos.map(f => f.e[0]).join(' · '))}</small></span>
        <svg class="chev"><use href="#i-chev"/></svg></button>
      <div class="filhos" id="${id}" hidden>${i.filhos.map(f => `<a class="filho" href="${esc(f.h)}">
        <span class="icone-item"><svg><use href="#i-${f.i}"/></svg></span>
        <span><strong>${esc(f.t)}</strong><small>${esc(f.e.join(' · '))}</small></span></a>`).join('')}</div></div>`;
  }

  /* área do aluno: uma pasta por nível */
  function chipsCurso(c){
    const out = [];
    if (c.licoes.length) out.push(`<span>${ic('curso')}${plural(c.licoes.length, 'lição', 'lições')}</span>`);
    if (c.nAtiv) out.push(`<span>${ic('lapis')}${plural(c.nAtiv, 'atividade', 'atividades')}</span>`);
    if (c.nLcp) out.push(`<span>${ic('fone')}${plural(c.nLcp, 'LCP', 'LCPs')}</span>`);
    if (c.provas.length) out.push(`<span>${ic('prova')}${plural(c.provas.length, 'prova', 'provas')}</span>`);
    return out.join('');
  }
  function mostrarPastas(){
    $('#conteudo').innerHTML = `<p class="dica-curso">Escolha o nível para ver as lições, as atividades e os LCPs.</p>
      <div class="pastas">${cursos.map(c => `<button class="pastinha" type="button" data-curso="${c.slug}" style="${corNivel(c.nome)}" aria-label="Abrir ${esc(c.nome)}">
        <span class="folhas" aria-hidden="true"><i></i><i></i></span><span class="frente" aria-hidden="true"></span>
        <span class="nivel" aria-hidden="true">${esc(c.nivel)}</span>
        <span class="rot">Online</span><h3>${esc(c.nome)}</h3>
        <span class="chips">${chipsCurso(c)}</span>
        <span class="abrir" aria-hidden="true">${ic('seta')}</span></button>`).join('')}
      ${embreve.map(n => `<div class="pastinha breve" style="${corNivel(n)}">
        <span class="frente" aria-hidden="true"></span><span class="nivel" aria-hidden="true">${esc((NIVEIS[n] || {}).nivel || '')}</span>
        <span class="rot">Online</span><h3>${esc(n)}</h3><span class="chips"><span>Em breve</span></span></div>`).join('')}</div>`;
  }
  /* página de um nível: lições com atividade e LCP, e as provas */
  function mostrarCurso(c){
    const temAtiv = c.nAtiv > 0, temLcp = c.nLcp > 0, temProvas = c.provas.length > 0;
    const opcoes = [['tudo', 'Tudo']].concat(temAtiv ? [['atividades', 'Atividades']] : [], temLcp ? [['lcp', 'LCP · Listening']] : [], temProvas ? [['provas', 'Provas']] : []);
    if (!opcoes.some(o => o[0] === filtro)) filtro = 'tudo';
    const acao = (f, rot, icone) => `<a class="acao" href="${esc(f.h)}">${ic(icone)}<span>${rot}</span><svg class="seta"><use href="#i-seta"/></svg></a>`;
    const verAtiv = filtro === 'tudo' || filtro === 'atividades', verLcp = filtro === 'tudo' || filtro === 'lcp';
    const licoes = filtro === 'provas' ? [] : c.licoes.filter(l => (verAtiv && l.atividade) || (verLcp && l.lcp) || (filtro === 'tudo' && l.outros.length));
    const cartaoLicao = l => {
      const partes = [l.atividade && 'Atividade', l.lcp && 'LCP'].filter(Boolean).join(' + ');
      return `<article class="licao">${l.novo ? '<span class="selo-novo">Novo</span>' : ''}
        <div class="topo"><span class="num">${l.n || '•'}</span><span class="tit"><strong>Lesson ${l.n}</strong><small>${esc(partes)}</small></span></div>
        <div class="acoes">${verAtiv && l.atividade ? acao(l.atividade, 'Lesson Activity', 'lapis') : ''}${verLcp && l.lcp ? acao(l.lcp, 'LCP · Listening', 'fone') : ''}${filtro === 'tudo' ? l.outros.map(o => acao(o, esc(o.t), o.i)).join('') : ''}</div></article>`;
    };
    const provas = (filtro === 'tudo' || filtro === 'provas') ? c.provas : [];
    $('#conteudo').innerHTML = `<div class="curso-vista" style="${corNivel(c.nome)}">
      <button class="voltar" type="button" data-voltar>${ic('seta')}Todos os níveis</button>
      <header class="heroi" data-nivel="${esc(c.nivel)}"><span class="rot">Online English · nível ${esc(c.nivel)}</span><h2>${esc(c.nome)}</h2><div class="chips">${chipsCurso(c)}</div></header>
      ${opcoes.length > 2 ? `<div class="filtros" role="group" aria-label="Mostrar">${opcoes.map(([v, r]) => `<button type="button" data-filtro="${v}" aria-pressed="${v === filtro}">${r}</button>`).join('')}</div>` : ''}
      ${licoes.length ? `<div class="cab-curso"><h3>Lições</h3><span class="cont">${licoes.length}</span></div><div class="licoes">${licoes.map(cartaoLicao).join('')}</div>` : ''}
      ${provas.length ? `<div class="cab-curso"><h3>Practice Tests</h3><span class="cont">${provas.length}</span></div><div class="provas">${provas.map(p => `<a class="prova" href="${esc(p.h)}">
        <span class="icone-item">${ic(p.i)}</span><span><strong>${esc(p.t.replace(/^Online /, ''))}${maisNovo.has(p.h) ? '<span class="selo-novo">Novo</span>' : ''}</strong><small>${esc(p.e.join(' · '))}</small></span></a>`).join('')}</div>` : ''}
    </div>`;
  }
  /* área do professor: Darwin e Materiais aleatórios, grupo por grupo */
  function mostrarSecao(){
    const s = PROF.find(x => x.id === atual);
    $('#conteudo').innerHTML = s.grupos.map(g => `<section class="grupo" style="${estilo(s.id)}">
      <div class="cab-grupo"><h3>${esc(g.titulo)}</h3>${g.itens.length ? `<span class="cont">${nItens(g)}</span>` : ''}</div>
      ${g.itens.length ? `<div class="grade">${g.itens.map(i => i.filhos ? pasta(i, s) : cartao({...i, secao: s})).join('')}</div>` : ''}
      ${g.embreve ? `<div class="embreve">Em breve: ${g.embreve.map(x => `<span>${esc(x)}</span>`).join('')}</div>` : ''}
    </section>`).join('');
  }
  function mostrarConteudo(){
    if (precisaCodigo()) return mostrarPortaria();
    if ($('#busca').value.trim()) return buscar();
    if (tela === 'aluno') { const c = cursos.find(x => x.slug === sub); return c ? mostrarCurso(c) : mostrarPastas(); }
    mostrarSecao();
  }
  function mostrarArea(){
    const aluno = tela === 'aluno';
    const cor = aluno ? estilo('curso') : '--c:#131B35;--e:#131B35;--t:#E4E8F2';
    $('#barra').setAttribute('style', cor);
    $('#barra').innerHTML = `<a class="inicio-btn" href="#">${ic('seta')}Início</a>
      <span class="selo-area">${ic(aluno ? 'aluno' : 'quadro')}${aluno ? 'Área do aluno' : 'Área do professor'}</span>
      ${!aluno ? '<a class="link-area" href="#aluno" data-ver-aluno>Ver a área do aluno</a>'
        : precisaCodigo() ? ''
        : me ? `<span class="quem">${ic('chave')}<b>${esc((me.nome || 'Aluno').split(' ')[0])}</b><span>${esc(me.code)}</span></span><button type="button" class="link-area" data-trocar>Trocar código</button>`
        : '<button type="button" class="link-area" data-trocar>Colocar meu código</button>'}`;
    const gate = precisaCodigo();
    document.body.toggleAttribute('data-portaria', gate);
    if (aluno) conferirCodigo();
    $('#painel-slot').innerHTML = aluno ? '' : `<a class="painel" href="professor.html">
      <span class="icone-painel">${ic('painel')}</span>
      <span class="txt"><strong>Painel da turma</strong><small>Respostas dos alunos em tempo real, entregas e correções.</small></span>
      <span class="seta-p">${ic('seta')}</span></a>`;
    const nv = gate ? [] : aluno ? novosAluno : novosProf;
    $('#novos').innerHTML = nv.length ? '<b>Novos</b>' + nv.map(i => `<a class="novo" style="${estilo(i.secao.id)}" href="${esc(i.h)}"><i></i>${esc(i.t)}</a>`).join('') : '';
    $('#divisoes').hidden = aluno;
    if (!aluno) $('#divisoes').innerHTML = PROF.map(s => `<button class="divisao" role="tab" data-id="${s.id}" style="${estilo(s.id)}" aria-selected="${s.id === atual}" aria-controls="conteudo">
      <span class="topo-div"><span class="icone-div"><svg><use href="#i-${s.icone}"/></svg></span><span class="num-div">${contar(s)}</span></span>
      <span class="texto-div"><h2>${esc(s.nome)}</h2><span class="sub">${esc(s.sub)}</span></span></button>`).join('');
    $('#busca').placeholder = aluno ? 'Procurar lição ou atividade' : 'Procurar em todos os materiais';
    $('#busca').setAttribute('aria-label', $('#busca').placeholder);
    $('#subtitulo').textContent = aluno ? `Online English · ${plural(doCurso.length, 'material', 'materiais')}` : `Área do professor · ${plural(todos.length, 'material', 'materiais')}`;
    mostrarConteudo();
  }
  function render(){
    document.body.dataset.tela = tela;
    $('#tela-inicio').hidden = tela !== 'inicio';
    $('#area').hidden = tela === 'inicio';
    if (tela === 'inicio') { $('#subtitulo').textContent = 'Materiais de Ensino de Inglês'; return mostrarInicio(); }
    mostrarArea();
  }
  /* endereços: #aluno, #aluno/english-3, #professor/darwin, #professor/aleatorios; os antigos (#curso, #darwin...) continuam valendo */
  function ir(hash, gravar){
    let [a, b] = decodeURIComponent(String(hash || '')).split('/');
    if (a === 'curso') a = 'aluno';
    if (a === 'darwin' || a === 'aleatorios') { b = a; a = 'professor'; }
    const antes = tela;
    if (a === 'aluno') { tela = 'aluno'; sub = cursos.some(c => c.slug === b) ? b : ''; }
    else if (a === 'professor') { tela = 'professor'; if (PROF.some(s => s.id === b)) atual = b; }
    else tela = 'inicio';
    if (tela !== 'aluno') trocando = false;
    if ($('#busca').value) { $('#busca').value = ''; $('#limpar').classList.add('oculto'); }
    render();
    const alvo = tela === 'inicio' ? '' : '#' + tela + (tela === 'aluno' ? (sub ? '/' + sub : '') : '/' + atual);
    if (location.hash !== alvo) history[gravar ? 'pushState' : 'replaceState'](null, '', alvo || location.pathname + location.search);
    if (antes !== tela) window.scrollTo(0, 0);
  }
  function buscar(){
    const bruto = $('#busca').value.trim();
    $('#limpar').classList.toggle('oculto', !bruto);
    if (!bruto) return mostrarConteudo();
    const partes = norm(bruto).split(/\s+/);
    const base = tela === 'aluno' ? doCurso : todos;
    const achados = base.filter(i => { const alvo = norm([i.t, i.secao.nome, i.grupo, ...i.e].join(' ')); return partes.every(p => alvo.includes(p)); });
    $('#conteudo').innerHTML = achados.length
      ? `<h3 class="titulo-busca">${achados.length} ${achados.length === 1 ? 'resultado' : 'resultados'}</h3><div class="grade">${achados.map(i => cartao(i, true)).join('')}</div>`
      : '<div class="vazio">Nenhum material encontrado.</div>';
  }
  $('#divisoes').addEventListener('click', e => { const b = e.target.closest('.divisao'); if (b) ir('professor/' + b.dataset.id, true); });
  $('#barra').addEventListener('click', e => {
    if (e.target.closest('[data-trocar]')) { trocando = !!me; if (!me) gravar('mc-later', null, sessionStorage); erroCodigo = ''; render(); return; }
    /* o professor vendo a área do aluno não precisa de código */
    if (e.target.closest('[data-ver-aluno]')) gravar('mc-later', '1', sessionStorage);
  });
  $('#conteudo').addEventListener('submit', e => { const f = e.target.closest('[data-codigo]'); if (f) { e.preventDefault(); entrarComCodigo(f); } });
  $('#conteudo').addEventListener('click', e => {
    const p = e.target.closest('.pastinha[data-curso]');
    if (p) { filtro = 'tudo'; ir('aluno/' + p.dataset.curso, true); window.scrollTo({top: Math.max(0, $('#area').offsetTop - 12), behavior: 'smooth'}); return; }
    if (e.target.closest('[data-voltar]')) { ir('aluno', true); return; }
    if (e.target.closest('[data-sem]')) { if (trocando) trocando = false; else gravar('mc-later', '1', sessionStorage); erroCodigo = ''; render(); return; }
    const f = e.target.closest('[data-filtro]');
    if (f) { filtro = f.dataset.filtro; mostrarConteudo(); return; }
    const b = e.target.closest('.abre');
    if (!b) return;
    const aberta = b.getAttribute('aria-expanded') !== 'true';
    b.setAttribute('aria-expanded', String(aberta));
    b.parentElement.classList.toggle('aberta', aberta);
    document.getElementById(b.getAttribute('aria-controls')).hidden = !aberta;
  });
  $('#busca').addEventListener('input', buscar);
  $('#limpar').addEventListener('click', () => { $('#busca').value = ''; buscar(); $('#busca').focus(); });
  addEventListener('popstate', () => ir(location.hash.slice(1)));
  addEventListener('hashchange', () => ir(location.hash.slice(1)));
  ir(location.hash.slice(1));
})();
</script>
</body>
</html>
