<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Online English · Prof. Rodrigo</title>
<meta name="description" content="As lições do curso Online English, nível por nível: atividades, LCPs e practice tests.">
<meta name="theme-color" content="#F7F5FF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%236741D9'/%3E%3Cpath d='M17 22h30a5 5 0 0 1 5 5v12a5 5 0 0 1-5 5H33l-9 7v-7h-7a5 5 0 0 1-5-5V27a5 5 0 0 1 5-5z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap">
<style>
:root{
  --fundo:#F7F5FF;--papel:#FFFFFF;--tinta:#1A1B3D;--tinta-2:#45476B;--tinta-3:#7B7E9E;--linha:#E9E5F7;--linha-2:#DAD5EE;
  --roxo:#6741D9;--roxo-esc:#4C2DB8;--roxo-claro:#F0EBFF;--coral:#F76707;--coral-claro:#FFF0E6;
  --azul:#1C7ED6;--azul-claro:#E7F5FF;--verde:#0CA678;--verde-claro:#E6FCF5;--ambar:#E67700;--ambar-claro:#FFF4DB;
  --sombra:0 18px 40px -26px rgba(42,30,110,.45);--sombra-2:0 26px 60px -30px rgba(42,30,110,.55);
  --raio:24px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--fundo);color:var(--tinta);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15.5px;line-height:1.5;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(42rem 30rem at 105% -8%,rgba(255,169,77,.22),transparent 62%),
  radial-gradient(38rem 32rem at -12% 18%,rgba(103,65,217,.16),transparent 60%),
  radial-gradient(30rem 26rem at 70% 112%,rgba(12,166,120,.12),transparent 60%)}
h1,h2,h3{font-family:Sora,system-ui,sans-serif;margin:0;line-height:1.15;letter-spacing:-.01em}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--roxo);outline-offset:3px;border-radius:10px}
.ic{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* topo */
.topo{position:sticky;top:0;z-index:30;background:rgba(247,245,255,.82);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid rgba(218,213,238,.7)}
.topo .wrap{display:flex;align-items:center;gap:14px;min-height:72px}
.marca{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
.logo{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(145deg,#845EF7,#5F3DC4);box-shadow:0 10px 22px -12px rgba(95,61,196,.9)}
.logo svg{width:26px;height:26px}
.marca strong{display:block;font-family:Sora,sans-serif;font-size:17.5px;line-height:1.1}
.marca small{display:block;color:var(--tinta-3);font-weight:600;font-size:12.5px}
.topo .dir{margin-left:auto;display:flex;align-items:center;gap:10px}
.eu{display:flex;align-items:center;gap:10px;padding:5px 6px 5px 5px;border-radius:999px;background:var(--papel);border:1px solid var(--linha);box-shadow:0 6px 16px -14px rgba(42,30,110,.6)}
.ava{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:Sora,sans-serif;font-weight:800;font-size:13px;flex:none}
.eu .nome{line-height:1.1}
.eu .nome b{display:block;font-size:14px}
.eu .nome span{display:block;font-size:11.5px;color:var(--tinta-3);font-weight:700;letter-spacing:.04em}
.btn-sutil{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;padding:8px 10px;border-radius:12px;font-weight:700;font-size:13.5px;color:var(--tinta-2)}
.btn-sutil:hover{background:var(--roxo-claro);color:var(--roxo-esc)}
.btn-sutil .ic{width:17px;height:17px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:16px;padding:13px 20px;font-weight:800;font-size:15px;text-decoration:none;background:var(--roxo);color:#fff;box-shadow:0 5px 0 var(--roxo-esc),0 16px 26px -18px rgba(76,45,184,.9);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--roxo-esc)}
.btn .ic{width:18px;height:18px}
.btn.claro{background:var(--papel);color:var(--tinta);box-shadow:0 4px 0 var(--linha-2);border:1px solid var(--linha-2)}

main{flex:1;padding:26px 0 70px}

/* boas-vindas (código) */
.boas{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:34px;align-items:center;padding:34px 0 10px}
.boas .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;background:var(--papel);border:1px solid var(--linha);font-weight:800;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--roxo)}
.boas h1{font-size:clamp(32px,5vw,50px);margin:18px 0 14px}
.boas h1 em{font-style:normal;background:linear-gradient(100deg,#7048E8,#F76707);-webkit-background-clip:text;background-clip:text;color:transparent}
.boas p.lead{font-size:17px;color:var(--tinta-2);margin:0 0 26px;max-width:520px}
.form-cod{display:flex;gap:10px;flex-wrap:wrap;max-width:520px;padding:10px;border-radius:24px;background:var(--papel);border:1px solid var(--linha);box-shadow:var(--sombra)}
.form-cod input{flex:1 1 200px;min-width:0;border:0;border-radius:16px;padding:14px 16px;font:inherit;font-size:19px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#F6F4FC;color:var(--tinta)}
.form-cod input::placeholder{color:#B3B0CC;letter-spacing:.12em}
.form-cod input:focus{outline:none;box-shadow:0 0 0 3px #D0BFFF;background:#fff}
.form-cod .btn{flex:0 0 auto}
.msg{min-height:22px;margin:12px 4px 0;font-weight:700;font-size:14px;color:#C92A2A}
.msg.ok{color:var(--tinta-3)}
.sem-cod{margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;color:var(--tinta-3);font-size:13.5px}
.sem-cod button{border:0;background:none;padding:6px 0;font-weight:800;color:var(--roxo);text-decoration:underline;text-underline-offset:3px}
.passos{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.passo{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 10px;border-radius:16px;background:rgba(255,255,255,.7);border:1px solid var(--linha);font-weight:700;font-size:13.5px;color:var(--tinta-2)}
.passo i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-family:Sora,sans-serif;font-weight:800;color:#fff;background:var(--roxo);flex:none}
.passo:nth-child(2) i{background:var(--coral)}
.passo:nth-child(3) i{background:var(--verde)}
.ilustra{position:relative}
.ilustra svg{width:100%;height:auto;display:block;filter:drop-shadow(0 30px 40px rgba(42,30,110,.16))}

/* início */
.ola{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding:30px 32px;border-radius:32px;color:#fff;background:linear-gradient(125deg,#5F3DC4 0%,#7048E8 48%,#9775FA 100%);box-shadow:var(--sombra-2)}
.ola::before,.ola::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.ola::before{width:340px;height:340px;right:-90px;top:-150px;background:radial-gradient(circle,rgba(255,212,59,.45),transparent 65%)}
.ola::after{width:260px;height:260px;left:38%;bottom:-170px;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%)}
.ola > *{position:relative;z-index:1}
.ola small.eyebrow{display:block;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:12px;opacity:.85}
.ola h1{font-size:clamp(28px,4.4vw,40px);margin:8px 0 8px}
.ola p{margin:0;max-width:560px;opacity:.92;font-size:16px}
.numeros{display:flex;gap:10px}
.num{min-width:108px;padding:14px 16px;border-radius:20px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(4px)}
.num b{display:block;font-family:Sora,sans-serif;font-size:28px;line-height:1}
.num span{display:block;margin-top:6px;font-size:12.5px;font-weight:700;opacity:.9}
.num.alerta{background:rgba(255,255,255,.95);color:var(--coral)}
.num.alerta span{color:var(--tinta-2);opacity:1}
.aviso-sem{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 16px;border-radius:18px;background:var(--ambar-claro);color:#8F4E00;font-weight:700;font-size:14px;border:1px solid #FFE3A3}
.aviso-sem button{margin-left:auto;border:0;border-radius:12px;padding:8px 12px;background:#fff;font-weight:800;color:#8F4E00;white-space:nowrap}

.busca{position:relative;margin:22px 0 0}
.busca .ic{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--tinta-3)}
.busca input{width:100%;border:1px solid var(--linha);background:var(--papel);border-radius:20px;padding:16px 48px 16px 50px;font:inherit;font-size:16px;font-weight:600;color:var(--tinta);box-shadow:0 10px 26px -22px rgba(42,30,110,.7)}
.busca input:focus{outline:none;border-color:#B197FC;box-shadow:0 0 0 4px var(--roxo-claro)}
.busca .limpar{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:#F1EEFB;border-radius:12px;width:34px;height:34px;display:grid;place-items:center;color:var(--tinta-2)}
.busca .limpar[hidden]{display:none}
.busca .limpar .ic{position:static;transform:none;width:16px;height:16px}

.cab{display:flex;align-items:baseline;gap:12px;margin:34px 0 14px}
.cab h2{font-size:21px}
.cab .sub{color:var(--tinta-3);font-weight:600;font-size:14px}
.cab .mais{margin-left:auto;font-weight:800;font-size:14px;color:var(--roxo);text-decoration:none}

.destaques{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-top:22px}
.continuar{position:relative;display:grid;gap:14px;padding:22px 24px;border-radius:var(--raio);background:var(--papel);border:1px solid var(--linha);box-shadow:var(--sombra);text-decoration:none;overflow:hidden}
.continuar::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--k,#6741D9)}
.continuar .rot{display:flex;align-items:center;gap:8px;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--k-esc,#4C2DB8)}
.continuar .rot .ic{width:16px;height:16px}
.continuar h3{font-size:20px}
.continuar .meta{color:var(--tinta-3);font-weight:600;font-size:13.5px;margin-top:4px}
.continuar .pe{display:flex;align-items:center;gap:16px}
.continuar .pe .barra{flex:1}
.continuar .ir{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:14px;background:var(--k,#6741D9);color:#fff;font-weight:800;font-size:14px;box-shadow:0 4px 0 var(--k-esc,#4C2DB8);white-space:nowrap}
.continuar:hover{box-shadow:var(--sombra-2)}
.correcoes{padding:20px 22px;border-radius:var(--raio);background:linear-gradient(160deg,#FFF4EC,#FFFFFF 70%);border:1px solid #FFD8BF;box-shadow:var(--sombra)}
.correcoes h3{display:flex;align-items:center;gap:10px;font-size:17px;margin-bottom:12px}
.correcoes h3 .bola{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--coral);color:#fff}
.correcoes h3 .bola .ic{width:18px;height:18px}
.correcoes a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;text-decoration:none;font-weight:700;font-size:14px;background:#fff;border:1px solid #FFE3D0;margin-top:8px}
.correcoes a:hover{border-color:var(--coral)}
.correcoes a small{margin-left:auto;color:var(--coral);font-weight:800;white-space:nowrap}
.correcoes p{margin:0;color:var(--tinta-3);font-size:14px}

/* capas dos níveis */
.capas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px}
.capa{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;min-height:230px;padding:22px;border-radius:28px;color:#fff;text-decoration:none;background:linear-gradient(150deg,var(--k) 0%,var(--k-esc) 100%);box-shadow:0 22px 44px -28px var(--k-esc);transition:transform .18s,box-shadow .18s;isolation:isolate}
.capa:hover{transform:translateY(-4px);box-shadow:0 30px 54px -28px var(--k-esc)}
.capa::before{content:"";position:absolute;z-index:-1;width:220px;height:220px;right:-70px;top:-80px;border-radius:50%;background:rgba(255,255,255,.12)}
.capa::after{content:"";position:absolute;z-index:-1;width:150px;height:150px;left:-50px;bottom:-60px;border-radius:50%;border:24px solid rgba(255,255,255,.08)}
.capa .numero{position:absolute;z-index:-1;right:14px;bottom:-26px;font-family:Sora,sans-serif;font-weight:800;font-size:128px;line-height:1;letter-spacing:-.06em;color:rgba(255,255,255,.16)}
.capa .topo-c{display:flex;align-items:center;gap:8px;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.capa .topo-c .seta-c{margin-left:auto;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.18)}
.capa .topo-c .seta-c .ic{width:18px;height:18px}
.capa h3{font-size:26px}
.capa .itens-c{display:flex;flex-wrap:wrap;gap:6px}
.capa .itens-c span{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.16);font-weight:700;font-size:12px}
.capa .itens-c .ic{width:14px;height:14px}
.capa .prog-c{margin-top:auto}
.capa .prog-c small{display:block;font-weight:700;font-size:12.5px;opacity:.92;margin-top:7px}
.capa .barra{background:rgba(255,255,255,.22)}
.capa .barra i{background:#fff}
.capa.breve{background:repeating-linear-gradient(135deg,#F1EFF8 0 14px,#ECE9F5 14px 28px);color:var(--tinta-3);box-shadow:none;border:2px dashed var(--linha-2)}
.capa.breve::before,.capa.breve::after{display:none}
.capa.breve .numero{color:rgba(123,126,158,.13)}
.capa.breve .topo-c .seta-c{display:none}

.barra{height:9px;border-radius:999px;background:#EEEAF8;overflow:hidden}
.barra i{display:block;height:100%;border-radius:999px;background:var(--k,#6741D9);transition:width .5s}

.novidades{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}

/* materiais */
.mat{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--papel);border:1px solid var(--linha);text-decoration:none;transition:border-color .15s,box-shadow .15s,transform .15s}
.mat:hover{border-color:var(--k,#6741D9);box-shadow:0 14px 26px -20px rgba(42,30,110,.6);transform:translateY(-1px)}
.mat .bolinha{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--k-claro,#F0EBFF);color:var(--k-esc,#4C2DB8)}
.mat .bolinha .ic{width:21px;height:21px}
.mat .txt strong{display:block;font-size:15px;line-height:1.25}
.mat .txt small{display:block;color:var(--tinta-3);font-weight:600;font-size:12.5px;margin-top:2px}
.mat .txt .mini{display:block;height:5px;margin-top:7px;max-width:180px;border-radius:999px;background:#F0EDF8;overflow:hidden}
.mat .txt .mini i{display:block;height:100%;background:var(--ambar)}
.st{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-weight:800;font-size:12px;white-space:nowrap;background:#F1EEFB;color:var(--tinta-2)}
.st .ic{width:14px;height:14px}
.st.and{background:var(--ambar-claro);color:#A65A00}
.st.ent{background:var(--azul-claro);color:#1864AB}
.st.cor{background:var(--roxo-claro);color:var(--roxo-esc)}
.st.nova{background:var(--coral);color:#fff}
.st.comecar{background:#F4F2FB;color:var(--tinta-3)}
.st.novo{background:#E6FCF5;color:#087F5B}

/* nível */
.faixa{position:relative;overflow:hidden;padding:26px 30px 28px;border-radius:32px;color:#fff;background:linear-gradient(135deg,var(--k) 0%,var(--k-esc) 100%);box-shadow:0 26px 50px -30px var(--k-esc);isolation:isolate}
.faixa::before{content:"";position:absolute;z-index:-1;width:380px;height:380px;right:-120px;top:-170px;border-radius:50%;background:rgba(255,255,255,.12)}
.faixa .numero{position:absolute;z-index:-1;right:26px;bottom:-40px;font-family:Sora,sans-serif;font-weight:800;font-size:190px;line-height:1;letter-spacing:-.06em;color:rgba(255,255,255,.14)}
.voltar{display:inline-flex;align-items:center;gap:7px;padding:8px 13px 8px 10px;border-radius:12px;border:0;background:rgba(255,255,255,.18);color:#fff;font-weight:800;font-size:13.5px;text-decoration:none}
.voltar .ic{width:16px;height:16px;transform:rotate(180deg)}
.voltar:hover{background:rgba(255,255,255,.28)}
.faixa small.eyebrow{display:block;margin-top:18px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:12px;opacity:.88}
.faixa h1{font-size:clamp(30px,5vw,44px);margin:6px 0 14px}
.faixa .itens-c{display:flex;flex-wrap:wrap;gap:8px}
.faixa .itens-c span{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-weight:700;font-size:13px}
.faixa .itens-c .ic{width:15px;height:15px}
.faixa .prog-f{display:flex;align-items:center;gap:14px;margin-top:18px;max-width:520px}
.faixa .prog-f .barra{flex:1;background:rgba(255,255,255,.22)}
.faixa .prog-f .barra i{background:#fff}
.faixa .prog-f b{font-size:13.5px;white-space:nowrap}
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 4px}
.filtros button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--linha);background:var(--papel);padding:9px 15px;border-radius:999px;font-weight:800;font-size:13.5px;color:var(--tinta-2)}
.filtros button .ic{width:16px;height:16px}
.filtros button[aria-pressed="true"]{background:var(--k);border-color:var(--k);color:#fff;box-shadow:0 8px 18px -12px var(--k-esc)}
.licoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.licao{position:relative;display:grid;gap:10px;align-content:start;padding:16px;border-radius:var(--raio);background:rgba(255,255,255,.72);border:1px solid var(--linha);box-shadow:0 14px 30px -28px rgba(42,30,110,.6)}
.licao .cabl{display:flex;align-items:center;gap:12px;padding:2px 2px 4px}
.licao .n{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-family:Sora,sans-serif;font-weight:800;font-size:18px;color:#fff;background:linear-gradient(145deg,var(--k),var(--k-esc));flex:none}
.licao .cabl strong{display:block;font-family:Sora,sans-serif;font-size:17px}
.licao .cabl small{display:block;color:var(--tinta-3);font-weight:600;font-size:12.5px}
.licao .feito{margin-left:auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--verde);color:#fff}
.licao .feito .ic{width:16px;height:16px}
.licao .mat{background:#fff}
.selo-novo{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;background:#E6FCF5;color:#087F5B;font-size:11px;font-weight:800;letter-spacing:.04em;vertical-align:2px}
.vazio{padding:28px;border:2px dashed var(--linha-2);border-radius:var(--raio);text-align:center;color:var(--tinta-3);font-weight:700;background:rgba(255,255,255,.5)}
.resultados{display:grid;gap:10px}
.lista-mats{display:grid;gap:10px}

/* faixa do professor visitando */
.visita{background:#1A1B3D;color:#fff;font-weight:700;font-size:13.5px}
.visita .wrap{display:flex;align-items:center;gap:12px;min-height:44px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.visita a{margin-left:auto;color:#FFD43B;font-weight:800}

/* rodapé */
.rodape{border-top:1px solid var(--linha);background:rgba(255,255,255,.55)}
.rodape .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;min-height:64px;color:var(--tinta-3);font-size:13px;font-weight:600}
.rodape a{margin-left:auto;color:var(--tinta-3);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.rodape a:hover{color:var(--roxo)}
.rodape a .ic{width:16px;height:16px}

.carregando{display:inline-flex;align-items:center;gap:8px;color:var(--tinta-3);font-weight:700;font-size:13px}
.carregando i{width:8px;height:8px;border-radius:50%;background:var(--roxo);animation:pisca 1s infinite alternate}
@keyframes pisca{from{opacity:.25}to{opacity:1}}
.entra{animation:entra .35s ease both}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (max-width:900px){
  .boas{grid-template-columns:1fr;gap:10px;padding-top:12px}
  .ilustra{order:-1;max-width:360px;margin:0 auto}
  .ola{grid-template-columns:1fr}
  .destaques{grid-template-columns:1fr}
}
@media (max-width:560px){
  .wrap{padding:0 16px}
  .topo .wrap{min-height:62px}
  .marca small,.eu .nome span{display:none}
  .logo{width:40px;height:40px}
  .eu{padding:4px}
  .eu .nome{display:none}
  main{padding-top:18px}
  .ola{padding:24px 22px;border-radius:26px}
  .numeros{flex-wrap:wrap}
  .num{min-width:0;flex:1 1 90px;padding:12px}
  .num b{font-size:24px}
  .faixa{padding:20px 20px 24px;border-radius:26px}
  .faixa .numero{font-size:140px;bottom:-30px}
  .mat{grid-template-columns:auto minmax(0,1fr);row-gap:8px}
  .mat .st{grid-column:2;justify-self:start}
  .form-cod .btn{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  const $ = (s, r = document) => r.querySelector(s);

  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const ic = n => `<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;

  const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;

  /* o mesmo identificador de lição que as páginas das lições usam para salvar na nuvem */
  const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  function lessonId(h) {
    const p = decodeURIComponent(h);
    const m = p.match(/online-english-(\d)\/(lesson-\d+)/i);
    if (m) return `english-${m[1]}-${m[2].toLowerCase()}`;
    return slug(p.split('/').filter(Boolean).pop().replace(/\.html?$/i, '') || 'index');
  }

  /* o curso, montado a partir do catálogo */
  const NUM = t => +((String(t).match(/(?:Lesson|Test)\s+(\d+)/i) || [])[1] || 0);
  function material(f, nivel, licao) {
    const tipo = f.i === 'lapis' ? 'ativ' : f.i === 'fone' ? 'lcp' : f.i === 'prova' ? 'prova' : 'outro';
    const n = licao ? NUM(licao.t) : NUM(f.t);
    const rotulo = tipo === 'ativ' ? 'Lesson Activity' : tipo === 'lcp' ? 'LCP · Listening' : String(f.t).replace(/^Online\s+/, '').replace(/^English\s+[\d-]+\s*·\s*/, '');
    const nome = licao ? `Lesson ${n} · ${rotulo}` : rotulo;
    return {h: f.h, i: f.i, tipo, rotulo, nome, n, e: f.e || [], data: f.data || '', nivel, id: lessonId(f.h)};
  }
  const niveis = [];
  let embreve = [];
  CURSO.grupos.forEach(g => {
    (g.embreve || []).forEach(n => embreve.push(n));
    const cfg = CURSO.niveis[g.titulo];
    if (!cfg || !g.itens.length) return;
    const nv = {nome: g.titulo, ...cfg};
    nv.licoes = g.itens.filter(i => i.filhos).map(i => ({n: NUM(i.t), t: i.t, mats: i.filhos.map(f => material(f, nv, i))})).sort((a, b) => a.n - b.n);
    nv.provas = g.itens.filter(i => !i.filhos).map(i => material(i, nv, null)).sort((a, b) => a.n - b.n);
    nv.mats = nv.licoes.flatMap(l => l.mats).concat(nv.provas);
    niveis.push(nv);
  });
  embreve = embreve.filter(n => !niveis.some(v => v.nome === n));
  const todos = niveis.flatMap(v => v.mats);
  const novos = todos.filter(m => m.data).sort((a, b) => b.data.localeCompare(a.data)).slice(0, 4);
  const NOVO = new Set(novos.slice(0, 2).map(m => m.h));
  const cor = v => `--k:${v.k};--k-esc:${v.e};--k-claro:${v.t}`;
  const contaTipo = (v, t) => v.mats.filter(m => m.tipo === t).length;
  function chipsNivel(v) {
    const out = [`<span>${ic('livro')}${plural(v.licoes.length, 'lição', 'lições')}</span>`];
    const a = contaTipo(v, 'ativ'), l = contaTipo(v, 'lcp');
    if (a) out.push(`<span>${ic('lapis')}${plural(a, 'atividade', 'atividades')}</span>`);
    if (l) out.push(`<span>${ic('fone')}${plural(l, 'LCP', 'LCPs')}</span>`);
    if (v.provas.length) out.push(`<span>${ic('prova')}${plural(v.provas.length, 'practice test', 'practice tests')}</span>`);
    return out.join('');
  }

  /* aluno: código guardado em 'mc-aluno', a mesma memória que as lições leem */
  const FS = `https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents`;
  const DOCS = `projects/${FB.projectId}/databases/(default)/documents`;
  let me = null; try { me = JSON.parse(ler('mc-aluno') || 'null'); } catch (e) {}
  if (me && !me.code) me = null;
  const visitaProf = new URLSearchParams(location.search).has('professor');
  if (visitaProf) { gravar('mc-later', '1', sessionStorage); gravar('mc-visita-prof', '1', sessionStorage); }
  const pulou = () => !!ler('mc-later', sessionStorage);
  let trocando = false, msgCodigo = '', conferido = false;
  const precisaCodigo = () => trocando || (!me && !pulou());

    const r = await fetch(`${FS}/alunos/${encodeURIComponent(code)}?key=${FB.apiKey}`);

    }).catch(() => {});
  }

  const dec = f => {
    const o = {};
    Object.entries(f || {}).forEach(([k, v]) => {
      o[k] = 'stringValue' in v ? v.stringValue : 'integerValue' in v ? +v.integerValue : 'doubleValue' in v ? v.doubleValue

    });
    return o;
  };

    if (!me || carregando) return;

      if (!r.ok) throw new Error(r.status);

      lista.forEach(x => {
        if (!x.found) return;
        const nome = x.found.name, id = nome.split('__').pop(), d = dec(x.found.fields);
        if (nome.includes('/progresso/')) p[id] = d; else c[id] = d;
      });
      if (!me || me.code !== code) return;
      PROG = p; CORR = c; carregou = true;
      gravar('mc-progresso', JSON.stringify({code, p, c}), sessionStorage);
      render();

    finally { carregando = false; }
  }
  const vistoCorr = id => ler('mc-corr-visto:' + id) || '';
  function estado(m) {
    let p = PROG[m.id] || null;
    const c = CORR[m.id] || null;
    if (p && c && c.reset && p.reset !== c.reset) p = null;
    if (p && !p.entregue && !(p.feito > 0) && !p.secao) p = null;
    const nCorr = c && c.itens && !(c.reset && (!p || p.reset !== c.reset)) ? Object.keys(c.itens).length : 0;
    const pct = p && p.total ? Math.min(100, Math.round(100 * (p.feito || 0) / p.total)) : 0;
    const nova = nCorr > 0 && String(c.atualizado || '') > vistoCorr(m.id);
    return {p, pct, entregue: !!(p && p.entregue), nCorr, nova, quando: p ? (p.atualizado || '') : '', c};
  }
  function selo(m, st) {
    if (st.nova) return `<span class="st nova">${ic('sino')}Correção nova</span>`;

    if (st.p) return `<span class="st and">${ic('relogio')}Em andamento</span>`;
    if (NOVO.has(m.h)) return '<span class="st novo">Novo</span>';
    return `<span class="st comecar">${ic('play')}Começar</span>`;
  }
  function linhaMat(m, comNivel) {
    const st = estado(m);
    const icone = m.tipo === 'ativ' ? 'lapis' : m.tipo === 'lcp' ? 'fone' : m.i || 'prova';

    return `<a class="mat" href="${esc(m.h)}" data-mat="${esc(m.id)}" style="${cor(m.nivel)}">
      <span class="bolinha">${ic(icone)}</span>
      <span class="txt"><strong>${comNivel ? esc(m.nivel.nome) + ' · ' : ''}${esc(comNivel ? m.nome : m.rotulo)}</strong><small>${sub}</small>${st.p && !st.entregue && st.pct ? `<span class="mini"><i style="width:${st.pct}%"></i></span>` : ''}</span>
      ${selo(m, st)}</a>`;
  }
  function relativo(iso) {
    const t = Date.parse(iso); if (!t) return '';
    const d = Date.now() - t;
    if (d < 60000) return 'agora há pouco';
    if (d < 3600000) return `há ${Math.round(d / 60000)} min`;
    if (d < 86400000) return `há ${Math.round(d / 3600000)} h`;
    if (d < 7 * 86400000) { const n = Math.round(d / 86400000); return `há ${n} ${n === 1 ? 'dia' : 'dias'}`; }
    return 'em ' + new Date(t).toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit'});
  }
  const resumoNivel = v => { const sts = v.mats.map(estado); return {comecados: sts.filter(s => s.p).length, total: v.mats.length}; };

  /* telas */
  let tela = 'inicio', nivelSel = null, filtro = 'tudo';
  const ilustra = `<svg viewBox="0 0 440 380" role="img" aria-label="Livro aberto, fones de ouvido, lápis e um balão dizendo Hi">
    <defs><linearGradient id="gA" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#9775FA"/><stop offset="1" stop-color="#6741D9"/></linearGradient>

    <path d="M58 92l5 12 12 5-12 5-5 12-5-12-12-5 12-5z" fill="#FFD43B"/><path d="M384 300l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#9775FA"/>
    <g transform="translate(96 168)">
      <path d="M124 34C92 12 46 6 6 10v148c40-4 86 2 118 24z" fill="#fff" stroke="#4C2DB8" stroke-width="6" stroke-linejoin="round"/>

      <path d="M124 34v148" stroke="#4C2DB8" stroke-width="6"/>
    </g>
    <g transform="translate(70 70)">
      <path d="M18 70V54C18 26 40 6 66 6s48 20 48 48v16" fill="none" stroke="#0C8599" stroke-width="12" stroke-linecap="round"/>
      <rect x="2" y="60" width="34" height="50" rx="14" fill="#15AABF"/><rect x="96" y="60" width="34" height="50" rx="14" fill="#15AABF"/>

    </g>

      <text x="59" y="72" text-anchor="middle" font-family="Sora,Arial,sans-serif" font-weight="800" font-size="44" fill="#fff">Hi!</text>
    </g>
    <g transform="translate(330 150) rotate(36)">
      <rect x="0" y="0" width="26" height="128" rx="6" fill="url(#gA)"/><rect x="0" y="0" width="26" height="20" rx="6" fill="#FF8787"/>
      <rect x="0" y="18" width="26" height="8" fill="#DEE2E6"/><path d="M0 126h26l-13 30z" fill="#FFE8CC"/><path d="M8 144h10l-5 12z" fill="#343A40"/>
    </g>
  </svg>`;

  function topoDireita() {
    const el = $('#dir');
    if (precisaCodigo()) { el.innerHTML = ''; return; }
    if (me) {
      const nome = (me.nome || 'Aluno').split(' ')[0];
      el.innerHTML = `<span class="eu"><span class="ava" style="background:${avaCor(me.code)}">${esc(iniciais(me.nome || me.code))}</span><span class="nome"><b>${esc(nome)}</b><span>${esc(me.code)}</span></span></span>
        <button type="button" class="btn-sutil" data-trocar title="Trocar o código deste aparelho">${ic('chave')}<span class="sr-m">Trocar</span></button>`;
    } else el.innerHTML = `<button type="button" class="btn-sutil" data-trocar>${ic('chave')}Colocar meu código</button>`;
  }
  const AVA = ['#6741D9', '#F76707', '#0C8599', '#1C7ED6', '#D6336C', '#2F9E44', '#E67700', '#7048E8'];
  const avaCor = s => AVA[[...String(s)].reduce((n, c) => n + c.charCodeAt(0), 0) % AVA.length];
  const iniciais = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();

  function telaCodigo() {
    const trocar = trocando && me;
    $('#app').innerHTML = `<section class="boas entra">
      <div>
        <span class="eyebrow">${ic('livro')}Online English</span>
        <h1>${trocar ? 'Trocar o <em>código</em>' : 'Bem-vindo ao seu <em>curso de inglês</em>'}</h1>
        <p class="lead">${trocar ? `Este aparelho está com o código <b>${esc(me.code)}</b>. Digite o outro código abaixo.` : 'Digite o código que o professor mandou. É só uma vez: ele fica salvo neste aparelho e vale para todas as lições.'}</p>
        <form class="form-cod" data-codigo novalidate>
          <label class="sr" for="codigo">Código do aluno</label>
          <input id="codigo" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="NOME-ABCD" enterkeyhint="go">
          <button class="btn" type="submit">Entrar${ic('seta')}</button>
        </form>
        <p class="msg" role="alert" id="msg">${esc(msgCodigo)}</p>
        <div class="sem-cod">${trocar ? '<button type="button" data-cancelar>Cancelar</button>' : '<button type="button" data-sem>Entrar sem código</button><span>As lições abrem, mas as respostas ficam só neste aparelho e o professor não vê.</span>'}</div>
        ${trocar ? '' : `<div class="passos"><span class="passo"><i>1</i>Digite seu código</span><span class="passo"><i>2</i>Escolha a lição</span><span class="passo"><i>3</i>Suas respostas vão para o professor</span></div>`}
      </div>
      <div class="ilustra" aria-hidden="${trocar}">${ilustra}</div>
    </section>`;
    setTimeout(() => { const i = $('#codigo'); if (i && matchMedia('(hover:hover)').matches) i.focus(); }, 60);
  }
  async function entrar(form) {
    const inp = $('#codigo'), msg = $('#msg'), btn = form.querySelector('button');
    const code = limparCodigo(inp.value);
    if (!code) { msg.className = 'msg'; msg.textContent = 'Digite o seu código.'; inp.focus(); return; }
    btn.disabled = true; msg.className = 'msg ok'; msg.textContent = 'Conferindo…';
    try {
      let a = await buscarAluno(code);
      if (!a && !code.includes('-') && code.length > 4) a = await buscarAluno(code.slice(0, -4) + '-' + code.slice(-4));
      if (!a) { msg.className = 'msg'; msg.textContent = 'Não achei esse código. Confira as letras e tente de novo.'; btn.disabled = false; inp.focus(); return; }
      me = a; conferido = true; trocando = false; msgCodigo = ''; PROG = {}; CORR = {}; carregou = false;
      gravar('mc-aluno', JSON.stringify(me)); gravar('mc-later', null, sessionStorage); gravar('mc-progresso', null, sessionStorage);
      render(); carregarProgresso();
    } catch (e) { msg.className = 'msg'; msg.textContent = 'Sem internet agora. Tente de novo em um instante.'; btn.disabled = false; }
  }

  function telaInicio() {
    const nome = me ? (me.nome || '').split(' ')[0] : '';
    const sts = todos.map(m => [m, estado(m)]);
    const comecados = sts.filter(([, s]) => s.p), entregues = sts.filter(([, s]) => s.entregue), corrigidos = sts.filter(([, s]) => s.nCorr), novasCorr = sts.filter(([, s]) => s.nova);
    const recentes = comecados.slice().sort((a, b) => String(b[1].quando).localeCompare(String(a[1].quando)));
    let cont = recentes.find(([, s]) => !s.entregue), rotCont = 'Continue de onde parou';
    if (!cont && recentes.length) {
      const ult = recentes[0][0], lista = ult.nivel.mats, i = lista.indexOf(ult);
      const prox = lista.slice(i + 1).concat(lista.slice(0, i)).find(m => !estado(m).p);
      if (prox) { cont = [prox, estado(prox)]; rotCont = 'Sua próxima atividade'; }
    }
    const blocoCont = cont ? (([m, s]) => `<a class="continuar" href="${esc(m.h)}" data-mat="${esc(m.id)}" style="${cor(m.nivel)}">
        <span class="rot">${ic(rotCont.startsWith('Continue') ? 'relogio' : 'estrela')}${rotCont}</span>
        <div><h3>${esc(m.nivel.nome)} · ${esc(m.nome)}</h3><div class="meta">${s.p ? (s.p.secao ? esc(s.p.secao) + ' · ' : '') + 'última vez ' + esc(relativo(s.quando)) : 'Ainda não começou'}</div></div>
        <div class="pe"><div class="barra"><i style="width:${s.pct}%"></i></div><span class="ir">${s.p ? 'Continuar' : 'Começar'}${ic('seta')}</span></div></a>`)(cont) : '';
    const blocoCorr = corrigidos.length ? `<div class="correcoes"><h3><span class="bola">${ic('sino')}</span>Correções do professor</h3>
        ${corrigidos.sort((a, b) => Number(b[1].nova) - Number(a[1].nova)).slice(0, 4).map(([m, s]) => `<a href="${esc(m.h)}" data-mat="${esc(m.id)}">${esc(m.nivel.nome)} · ${esc(m.nome)}<small>${s.nova ? 'Nova' : plural(s.nCorr, 'nota', 'notas')}</small></a>`).join('')}</div>` : '';
    const sub = me ? (comecados.length ? 'Que bom te ver de novo. Continue de onde parou ou escolha uma lição.' : 'Escolha o seu nível e comece pela primeira lição.') : 'Escolha o seu nível para ver as lições.';
    $('#app').innerHTML = `<section class="ola entra">
        <div><small class="eyebrow">Online English</small><h1>${nome ? `Olá, ${esc(nome)}!` : 'Olá!'}</h1><p>${sub}</p></div>
        ${me ? `<div class="numeros">
          <div class="num"><b>${carregou ? comecados.length : '·'}</b><span>começadas</span></div>
          <div class="num"><b>${carregou ? entregues.length : '·'}</b><span>entregues</span></div>
          <div class="num${novasCorr.length ? ' alerta' : ''}"><b>${carregou ? (novasCorr.length || corrigidos.length) : '·'}</b><span>${novasCorr.length ? (novasCorr.length === 1 ? 'correção nova' : 'correções novas') : 'corrigidas'}</span></div></div>` : ''}
      </section>
      ${!me ? `<div class="aviso-sem">${ic('chave')}<span>Sem código, as respostas ficam só neste aparelho e o professor não vê.</span><button type="button" data-trocar>Colocar meu código</button></div>` : ''}
      ${blocoCont || blocoCorr ? `<div class="destaques">${blocoCont || ''}${blocoCorr || ''}</div>` : ''}
      <div class="busca"><svg class="ic" aria-hidden="true"><use href="#i-busca"/></svg><label class="sr" for="q">Procurar</label><input id="q" type="search" placeholder="Procurar lição ou LCP" autocomplete="off"><button type="button" class="limpar" data-limpar hidden aria-label="Limpar a busca">${ic('x')}</button></div>
      <div id="res"></div>
      <div id="corpo-inicio">
        <div class="cab"><h2>Seus níveis</h2><span class="sub">${plural(niveis.length, 'nível', 'níveis')} · ${plural(todos.length, 'material', 'materiais')}</span></div>
        <div class="capas">${niveis.map(v => { const r = resumoNivel(v), pc = r.total ? Math.round(100 * r.comecados / r.total) : 0;
          return `<a class="capa" href="#nivel/${esc(v.slug)}" style="${cor(v)}"><span class="numero" aria-hidden="true">${esc(v.nivel)}</span>
            <span class="topo-c">Online English<span class="seta-c">${ic('seta')}</span></span><h3>${esc(v.nome)}</h3>
            <span class="itens-c">${chipsNivel(v)}</span>
            ${me ? `<span class="prog-c"><span class="barra" style="display:block"><i style="width:${pc}%"></i></span><small>${r.comecados} de ${r.total} começados</small></span>` : ''}</a>`; }).join('')}
          ${embreve.map(n => `<div class="capa breve"><span class="numero" aria-hidden="true">${esc((CURSO.niveis[n] || {}).nivel || '')}</span><span class="topo-c">Online English</span><h3>${esc(n)}</h3><span class="itens-c"><span>Em breve</span></span></div>`).join('')}</div>
        ${novos.length ? `<div class="cab"><h2>Novidades</h2><span class="sub">o que entrou por último</span></div><div class="novidades">${novos.map(m => linhaMat(m, true)).join('')}</div>` : ''}
      </div>`;
  }

  function telaNivel(v) {
    const r = resumoNivel(v), pc = r.total ? Math.round(100 * r.comecados / r.total) : 0;
    const tem = t => v.mats.some(m => m.tipo === t);
    const ops = [['tudo', 'Tudo', 'livro']].concat(tem('ativ') ? [['ativ', 'Atividades', 'lapis']] : [], tem('lcp') ? [['lcp', 'LCP · Listening', 'fone']] : [], v.provas.length ? [['prova', 'Practice tests', 'prova']] : [], me ? [['fazer', 'Para fazer', 'estrela']] : []);
    if (!ops.some(o => o[0] === filtro)) filtro = 'tudo';
    const passa = m => filtro === 'tudo' || (filtro === 'fazer' ? !estado(m).entregue : m.tipo === filtro);
    const licoes = filtro === 'prova' ? [] : v.licoes.map(l => ({...l, vis: l.mats.filter(passa)})).filter(l => l.vis.length);
    const provas = v.provas.filter(passa);
    $('#app').innerHTML = `<section class="faixa entra" style="${cor(v)}"><span class="numero" aria-hidden="true">${esc(v.nivel)}</span>
        <a class="voltar" href="#">${ic('seta')}Todos os níveis</a>
        <small class="eyebrow">Online English · nível ${esc(v.nivel)}</small><h1>${esc(v.nome)}</h1>
        <div class="itens-c">${chipsNivel(v)}</div>
        ${me ? `<div class="prog-f"><div class="barra"><i style="width:${pc}%"></i></div><b>${r.comecados} de ${r.total} começados</b></div>` : ''}
      </section>
      ${ops.length > 2 ? `<div class="filtros" role="group" aria-label="Mostrar" style="${cor(v)}">${ops.map(([k, t, i]) => `<button type="button" data-filtro="${k}" aria-pressed="${k === filtro}">${ic(i)}${t}</button>`).join('')}</div>` : ''}
      ${licoes.length ? `<div class="cab"><h2>Lições</h2><span class="sub">${plural(licoes.length, 'lição', 'lições')}</span></div>
        <div class="licoes">${licoes.map(l => { const feitas = l.mats.every(m => estado(m).entregue);
          return `<article class="licao" style="${cor(v)}"><div class="cabl"><span class="n">${l.n}</span><span><strong>Lesson ${l.n}</strong><small>${esc(l.mats.map(m => m.tipo === 'ativ' ? 'Atividade' : m.tipo === 'lcp' ? 'LCP' : m.rotulo).join(' + '))}</small></span>${feitas ? `<span class="feito" title="Tudo entregue">${ic('check')}</span>` : ''}</div>
            ${l.vis.map(m => linhaMat(m, false)).join('')}</article>`; }).join('')}</div>` : ''}
      ${provas.length ? `<div class="cab"><h2>Practice tests</h2><span class="sub">revisão de várias lições</span></div><div class="lista-mats">${provas.map(m => linhaMat(m, false)).join('')}</div>` : ''}
      ${!licoes.length && !provas.length ? '<div class="vazio" style="margin-top:20px">Tudo entregue por aqui. Muito bem!</div>' : ''}`;
  }

  function buscar() {
    const q = $('#q'); if (!q) return;
    const bruto = q.value.trim();
    $('[data-limpar]').hidden = !bruto;
    $('#corpo-inicio').hidden = !!bruto;
    if (!bruto) { $('#res').innerHTML = ''; return; }
    const partes = norm(bruto).split(/\s+/);
    const achados = todos.filter(m => { const alvo = norm([m.nivel.nome, m.nome, 'lesson ' + m.n, ...m.e].join(' ')); return partes.every(p => alvo.includes(p)); });
    $('#res').innerHTML = achados.length
      ? `<div class="cab"><h2>${plural(achados.length, 'resultado', 'resultados')}</h2></div><div class="resultados">${achados.map(m => linhaMat(m, true)).join('')}</div>`
      : '<div class="vazio" style="margin-top:18px">Nada encontrado. Tente "lesson 3" ou "LCP".</div>';
  }

  function render() {
    topoDireita();
    $('#visita').innerHTML = ler('mc-visita-prof', sessionStorage) ? `<div class="visita"><div class="wrap">${ic('olho')}<span>Você está vendo o site como um aluno, sem código.</span><a href="professor.html">Voltar para a área do professor</a></div></div>` : '';
    if (precisaCodigo()) { document.title = 'Online English · Prof. Rodrigo'; return telaCodigo(); }
    if (me) conferirCodigo();
    const v = tela === 'nivel' && niveis.find(x => x.slug === nivelSel);
    if (v) { document.title = `${v.nome} · Online English`; return telaNivel(v); }
    const q = $('#q') ? $('#q').value : '';
    document.title = 'Online English · Prof. Rodrigo';
    telaInicio();
    if (q) { $('#q').value = q; buscar(); }
  }

  /* endereços: #nivel/english-3; os antigos (#aluno, #aluno/english-3, #curso) continuam valendo,
     e os da área do professor (#professor/..., #darwin, #aleatorios) vão para professor.html */
  function rota() {
    let [a, b] = decodeURIComponent(location.hash.slice(1)).split('/');
    if (['professor', 'darwin', 'aleatorios'].includes(a)) {
      const alvo = a === 'professor' ? (b || '') : a;
      location.replace('professor.html' + (alvo ? '#' + (alvo === 'aleatorios' ? 'diversos' : alvo) : ''));
      return;
    }
    if (a === 'aluno' || a === 'curso') a = b ? 'nivel' : '';
    const antes = tela + nivelSel;
    tela = a === 'nivel' && niveis.some(v => v.slug === b) ? 'nivel' : 'inicio';
    nivelSel = tela === 'nivel' ? b : null;
    const certo = tela === 'nivel' ? '#nivel/' + nivelSel : '';
    if (location.hash !== certo) history.replaceState(null, '', certo || location.pathname + location.search);
    if (antes !== tela + nivelSel) { filtro = 'tudo'; window.scrollTo(0, 0); }
    render();
  }

  document.addEventListener('submit', e => { const f = e.target.closest('[data-codigo]'); if (f) { e.preventDefault(); entrar(f); } });
  document.addEventListener('input', e => { if (e.target.id === 'q') buscar(); });
  document.addEventListener('click', e => {
    const t = e.target;
    if (t.closest('[data-trocar]')) { trocando = !!me; if (!me) gravar('mc-later', null, sessionStorage); msgCodigo = ''; render(); window.scrollTo(0, 0); return; }
    if (t.closest('[data-cancelar]')) { trocando = false; render(); return; }
    if (t.closest('[data-sem]')) { gravar('mc-later', '1', sessionStorage); msgCodigo = ''; render(); return; }
    if (t.closest('[data-limpar]')) { $('#q').value = ''; buscar(); $('#q').focus(); return; }
    const f = t.closest('[data-filtro]');
    if (f) { filtro = f.dataset.filtro; render(); return; }
    const m = t.closest('[data-mat]');
    if (m) { const c = CORR[m.dataset.mat]; if (c && c.atualizado) gravar('mc-corr-visto:' + m.dataset.mat, String(c.atualizado)); }
  });
  addEventListener('hashchange', rota);
  addEventListener('pageshow', e => { if (e.persisted) { try { me = JSON.parse(ler('mc-aluno') || 'null'); } catch (x) {} render(); carregarProgresso(); } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) carregarProgresso(); });
  rota();
  carregarProgresso();
})();
</script>
</body>
</html>
