<style>
:root{
  color-scheme:light;
  --tinta:#131B35; --tinta-2:#4A5575; --tinta-3:#6E7A99;
  --fundo:#F5F6FB; --papel:#FFFFFF; --linha:#E2E6F1;
  --darwin:#2B59E6; --darwin-esc:#1B3DB0; --darwin-claro:#E8EEFF;
  --curso:#D43C25; --curso-esc:#A92A17; --curso-claro:#FFEAE4;
  --alea:#087F6C; --alea-esc:#05604F; --alea-claro:#DDF5EF;
  --sol:#FFB81F;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;color:var(--tinta);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;line-height:1.45;
  background:
    radial-gradient(760px 380px at 4% -80px,#DFE8FF 0,transparent 70%),
    radial-gradient(680px 360px at 96% -60px,#FFE3DA 0,transparent 70%),
    var(--fundo);
  background-repeat:no-repeat;
}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
.oculto{display:none!important}
.pagina{max-width:1160px;margin:0 auto;padding:clamp(28px,5vw,56px) clamp(16px,3vw,28px) 40px}

/* cabeçalho */
.cabeca{display:flex;align-items:flex-end;justify-content:space-between;gap:24px 40px;flex-wrap:wrap;margin-bottom:22px}
.marca{display:flex;align-items:center;gap:16px;min-width:0}
.logo{width:60px;height:60px;flex:none}
.cabeca h1{font-family:Sora,"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:clamp(30px,4.6vw,46px);line-height:1.05;letter-spacing:-.025em;margin:0}
.cabeca p{margin:6px 0 0;color:var(--tinta-2);font-size:clamp(15px,1.6vw,17px);font-weight:600}
.busca{position:relative;flex:1 1 300px;max-width:400px}
.busca svg{position:absolute;left:16px;top:50%;width:20px;height:20px;transform:translateY(-50%);color:var(--tinta-3);pointer-events:none}
.busca input{width:100%;height:52px;border:1.5px solid var(--linha);border-radius:16px;background:var(--papel);padding:0 44px 0 46px;font-size:16px;font-weight:600;box-shadow:0 6px 18px rgba(30,45,90,.06);outline:none;transition:border-color .15s,box-shadow .15s}
.busca input::placeholder{color:var(--tinta-3);font-weight:500}
.busca input:focus{border-color:var(--darwin);box-shadow:0 0 0 4px rgba(43,89,230,.14)}
.busca input::-webkit-search-cancel-button{display:none}
.limpar{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:10px;background:transparent;color:var(--tinta-3);cursor:pointer;display:grid;place-items:center}
.limpar:hover{background:var(--fundo);color:var(--tinta)}
.limpar svg{position:static;transform:none;width:16px;height:16px}

/* novidades */
.novos{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin-bottom:26px}
.novos b{font-size:13px;font-weight:800;color:var(--tinta-2);margin-right:2px}
.novo{display:inline-flex;align-items:center;gap:8px;background:var(--papel);border:1.5px solid var(--linha);border-radius:999px;padding:6px 14px 6px 10px;font-size:14px;font-weight:700;transition:border-color .15s,transform .15s}
.novo i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.novo:hover{border-color:var(--c);transform:translateY(-1px)}

/* divisões */
.divisoes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:30px}
.divisao{position:relative;overflow:hidden;text-align:left;border:0;border-radius:24px;padding:24px 24px 22px;background:var(--t);color:var(--tinta);cursor:pointer;display:flex;flex-direction:column;gap:18px;min-height:176px;transition:transform .18s,box-shadow .18s,background .18s,color .18s}
.divisao:hover{transform:translateY(-3px)}
.divisao:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.divisao[aria-selected="true"]{background:var(--c);color:#fff;box-shadow:0 18px 36px -12px var(--c)}
.divisao::after{content:"";position:absolute;right:-46px;top:-46px;width:170px;height:170px;border-radius:50%;background:var(--c);opacity:.08}
.divisao[aria-selected="true"]::after{background:#fff;opacity:.12}
.divisao::before{content:"";position:absolute;right:46px;bottom:-62px;width:118px;height:118px;border-radius:50%;background:var(--c);opacity:.06}
.divisao[aria-selected="true"]::before{background:#fff;opacity:.08}
.topo-div{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.icone-div{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--papel);color:var(--c)}
.icone-div svg{width:25px;height:25px}
.num-div{font-family:Sora,sans-serif;font-weight:800;font-size:34px;line-height:1;letter-spacing:-.02em;color:var(--c)}
.divisao[aria-selected="true"] .num-div{color:#fff}
.texto-div{position:relative;z-index:1}
.divisao h2{font-family:Sora,sans-serif;font-weight:700;font-size:clamp(20px,2.3vw,25px);line-height:1.15;letter-spacing:-.015em;margin:0}
.divisao span.sub{display:block;margin-top:5px;font-size:14px;font-weight:600;color:var(--tinta-2)}
.divisao[aria-selected="true"] span.sub{color:rgba(255,255,255,.86)}

/* conteúdo */
.grupo{margin-bottom:30px}
.cab-grupo{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cab-grupo h3{font-family:Sora,sans-serif;font-weight:700;font-size:18px;letter-spacing:-.01em;margin:0}
.cont{font-size:12.5px;font-weight:800;border-radius:999px;padding:2px 9px;background:var(--t);color:var(--e)}
.cab-grupo::after{content:"";flex:1;height:1.5px;background:var(--linha)}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.item{display:flex;align-items:center;gap:14px;background:var(--papel);border:1.5px solid var(--linha);border-radius:18px;padding:14px 16px;transition:transform .15s,border-color .15s,box-shadow .15s;min-width:0}
.item:hover{transform:translateY(-2px);border-color:var(--c);box-shadow:0 12px 24px -14px rgba(30,45,90,.35)}
.item:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.icone-item{width:46px;height:46px;border-radius:14px;background:var(--t);color:var(--c);display:grid;place-items:center;flex:none}
.icone-item svg{width:23px;height:23px}
.corpo-item{min-width:0;flex:1}
.corpo-item strong{display:block;font-weight:800;font-size:16px;line-height:1.28}
.corpo-item small{display:block;margin-top:3px;color:var(--tinta-3);font-size:13px;font-weight:600}
.seta{width:20px;height:20px;color:var(--c);flex:none;opacity:0;transform:translateX(-5px);transition:.15s}
.item:hover .seta{opacity:1;transform:none}
.selo-novo{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:7px;background:var(--sol);color:#402A00;font-size:11px;font-weight:800;vertical-align:2px}
.embreve{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:12px;color:var(--tinta-3);font-size:13.5px;font-weight:700}
.embreve span{border:1.5px dashed #CBD2E3;border-radius:999px;padding:4px 12px;color:var(--tinta-2)}
.vazio{background:var(--papel);border:1.5px dashed #CBD2E3;border-radius:18px;padding:30px 20px;text-align:center;color:var(--tinta-2);font-weight:600}
.onde{font-size:12px;font-weight:800;color:var(--e);background:var(--t);border-radius:7px;padding:2px 8px;margin-right:6px}
.titulo-busca{font-family:Sora,sans-serif;font-weight:700;font-size:18px;margin:0 0 14px}

footer{margin-top:18px;padding-top:18px;border-top:1.5px solid var(--linha);color:var(--tinta-3);font-size:13.5px;font-weight:600;text-align:center}

@media (max-width:760px){
  .cabeca{align-items:stretch}
  .busca{max-width:none;flex-basis:100%}
  .divisoes{grid-template-columns:1fr;gap:10px}
  .divisao{flex-direction:row;align-items:center;gap:14px;min-height:0;padding:14px 16px;border-radius:18px}
  .topo-div{display:contents}
  .icone-div{order:0;width:44px;height:44px;flex:none}
  .texto-div{order:1;flex:1;min-width:0}
  .num-div{order:2;font-size:26px;position:relative;z-index:1}
  .divisao::before{display:none}
  .logo{width:50px;height:50px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

];

(function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const CORES = {
    darwin: { c: 'var(--darwin)', e: 'var(--darwin-esc)', t: 'var(--darwin-claro)' },
    curso: { c: 'var(--curso)', e: 'var(--curso-esc)', t: 'var(--curso-claro)' },
    aleatorios: { c: 'var(--alea)', e: 'var(--alea-esc)', t: 'var(--alea-claro)' },
  };
  const estilo = id => `--c:${CORES[id].c};--e:${CORES[id].e};--t:${CORES[id].t}`;
  const todos = SECOES.flatMap(s => s.grupos.flatMap(g => g.itens.map(i => ({...i, secao: s, grupo: g.titulo}))));
  const contar = s => s.grupos.reduce((n, g) => n + g.itens.length, 0);
  const recentes = todos.filter(i => i.data).sort((a, b) => b.data.localeCompare(a.data)).slice(0, 3);
  const maisNovo = new Set(recentes.slice(0, 2).map(i => i.h));
  let atual = SECOES[0].id;

  $('#total').textContent = todos.length;
  $('#novos').innerHTML = '<b>Novos</b>' + recentes.map(i => `<a class="novo" style="${estilo(i.secao.id)}" href="${esc(i.h)}"><i></i>${esc(i.t)}</a>`).join('');

  const caixa = $('#divisoes');
  caixa.innerHTML = SECOES.map(s => `<button class="divisao" role="tab" data-id="${s.id}" style="${estilo(s.id)}" aria-selected="false" aria-controls="conteudo">
    <span class="topo-div"><span class="icone-div"><svg><use href="#i-${s.icone}"/></svg></span><span class="num-div">${contar(s)}</span></span>
    <span class="texto-div"><h2>${esc(s.nome)}</h2><span class="sub">${esc(s.sub)}</span></span></button>`).join('');
  caixa.addEventListener('click', e => { const b = e.target.closest('.divisao'); if (b) abrir(b.dataset.id, true); });

  function cartao(i, comLocal){
    const local = comLocal ? `<span class="onde">${esc(i.secao.nome)}</span>` : '';
    const selo = maisNovo.has(i.h) ? '<span class="selo-novo">Novo</span>' : '';
    return `<a class="item" style="${estilo(i.secao.id)}" href="${esc(i.h)}">
      <span class="icone-item"><svg><use href="#i-${i.i}"/></svg></span>
      <span class="corpo-item"><strong>${esc(i.t)}${selo}</strong><small>${local}${esc(i.e.join(' · '))}</small></span>
      <svg class="seta"><use href="#i-seta"/></svg></a>`;
  }
  function mostrarSecao(){
    const s = SECOES.find(x => x.id === atual);
    $('#conteudo').innerHTML = s.grupos.map(g => `<section class="grupo" style="${estilo(s.id)}">
      <div class="cab-grupo"><h3>${esc(g.titulo)}</h3>${g.itens.length ? `<span class="cont">${g.itens.length}</span>` : ''}</div>
      ${g.itens.length ? `<div class="grade">${g.itens.map(i => cartao({...i, secao: s})).join('')}</div>` : ''}
      ${g.embreve ? `<div class="embreve">Em breve: ${g.embreve.map(x => `<span>${esc(x)}</span>`).join('')}</div>` : ''}
    </section>`).join('');
  }
  function abrir(id, gravar){
    atual = SECOES.some(s => s.id === id) ? id : SECOES[0].id;
    document.querySelectorAll('.divisao').forEach(b => b.setAttribute('aria-selected', b.dataset.id === atual));
    if ($('#busca').value){ $('#busca').value = ''; $('#limpar').classList.add('oculto'); }
    mostrarSecao();
    if (gravar) history.replaceState(null, '', '#' + atual);
  }
  function buscar(){
    const bruto = $('#busca').value.trim();
    $('#limpar').classList.toggle('oculto', !bruto);
    if (!bruto) return mostrarSecao();
    const partes = norm(bruto).split(/\s+/);
    const achados = todos.filter(i => { const alvo = norm([i.t, i.secao.nome, i.grupo, ...i.e].join(' ')); return partes.every(p => alvo.includes(p)); });
    $('#conteudo').innerHTML = achados.length
      ? `<h3 class="titulo-busca">${achados.length} ${achados.length === 1 ? 'resultado' : 'resultados'}</h3><div class="grade">${achados.map(i => cartao(i, true)).join('')}</div>`
      : '<div class="vazio">Nenhum material encontrado.</div>';
  }
  $('#busca').addEventListener('input', buscar);
  $('#limpar').addEventListener('click', () => { $('#busca').value = ''; buscar(); $('#busca').focus(); });
  addEventListener('hashchange', () => abrir(location.hash.slice(1)));
  abrir(location.hash.slice(1));
})();
</script>
</body>
</html>
