<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Faísca Mobilidade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: barra de papéis no topo; passageiro e motorista dentro de um aparelho com roteiro de teste ao lado; administração em painel web com menu lateral */
:root{
  --bg:#ECF0ED; --surface:#FFFFFF; --surface-2:#F3F6F4; --ink:#161A19; --ink-2:#525C58; --ink-3:#848E8A; --line:#DAE1DC;
  --accent:#12C46B; --accent-strong:#0A7F45; --accent-soft:#DCF5E7; --on-accent:#02140A;
  --warn:#9A6408; --warn-soft:#FBEFD3; --bad:#C2382E; --bad-soft:#FBE2DF; --info:#2860C8; --info-soft:#E1EAFB;
  --frame:#1B201F; --land:#E2E8E4; --road:#FFFFFF; --casing:#C9D2CC; --river:#B5D3E2; --label:#36403C; --halo:#E2E8E4;
  --shadow:0 1px 2px rgba(18,30,24,.06),0 10px 30px rgba(18,30,24,.10);
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D100F; --surface:#151918; --surface-2:#1C2120; --ink:#E8EEEA; --ink-2:#A2ACA7; --ink-3:#6D7773; --line:#2A302E;
  --accent:#2BDF88; --accent-strong:#4DE89C; --accent-soft:#12321F; --on-accent:#02140A;
  --warn:#E8AC3E; --warn-soft:#382A0E; --bad:#F06F64; --bad-soft:#3A1815; --info:#7FA6F0; --info-soft:#18233A;
  --frame:#000000; --land:#161B1A; --road:#2A3230; --casing:#0E1211; --river:#163242; --label:#B8C2BD; --halo:#161B1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D100F; --surface:#151918; --surface-2:#1C2120; --ink:#E8EEEA; --ink-2:#A2ACA7; --ink-3:#6D7773; --line:#2A302E;
  --accent:#2BDF88; --accent-strong:#4DE89C; --accent-soft:#12321F; --on-accent:#02140A;
  --warn:#E8AC3E; --warn-soft:#382A0E; --bad:#F06F64; --bad-soft:#3A1815; --info:#7FA6F0; --info-soft:#18233A;
  --frame:#000000; --land:#161B1A; --road:#2A3230; --casing:#0E1211; --river:#163242; --label:#B8C2BD; --halo:#161B1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.ic{flex:none;display:block}

/* topo */
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.brand .word{font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:-.02em}
.brand .tag{font-size:12px;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase}
.spark{color:var(--accent)}
.roles{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.roles button{border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--ink-2);font-size:14px}
.roles button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.head-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--ink-2);font-weight:600;font-size:14px;padding:8px 6px;text-decoration:underline;text-underline-offset:3px}
.demo{max-width:1240px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:13px}
.demo b{color:var(--warn)}

/* palco */
.stage{display:grid;grid-template-columns:1fr;gap:24px;justify-items:center;padding-bottom:32px;max-width:1240px;margin:0 auto}
@media(min-width:960px){.stage{grid-template-columns:400px 320px;justify-content:center;align-items:start}}
.phone{width:100%;max-width:400px;height:min(820px,calc(100vh - 150px));min-height:600px;background:var(--surface);border-radius:38px;border:9px solid var(--frame);overflow:hidden;position:relative;box-shadow:var(--shadow)}
@media(max-width:520px){.phone{border:1px solid var(--line);border-radius:18px;height:calc(100vh - 170px);min-height:560px;max-width:none}}
.aside{display:flex;flex-direction:column;gap:14px;width:100%;max-width:400px}
.aside h3{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.aside ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.aside .box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}

/* tela do aparelho */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--surface)}
.scr-body{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.scr-top{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.scr-top h2{margin:0;font-size:17px;flex:1}
.iconbtn{border:0;background:var(--surface-2);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;color:var(--ink)}
.nav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:1px solid var(--line);background:var(--surface);padding-bottom:4px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;font-size:11px;font-weight:600;color:var(--ink-3)}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] .ic{color:var(--accent-strong)}
.map{position:relative;background:var(--land);flex:1 1 auto;min-height:200px;overflow:hidden}
.map svg{width:100%;height:100%;display:block}
.map-note{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--ink-2);background:var(--surface);padding:3px 8px;border-radius:8px;opacity:.92}
.map-top{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel{flex:none;max-height:62%;overflow-y:auto;background:var(--surface);border-top:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -8px 24px rgba(0,0,0,.06)}
.panel.tall{max-height:72%}
.h-greet{font-family:var(--f-display);font-weight:500;font-size:19px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.h-sec{margin:0;font-size:15px;font-weight:700}

/* formulários */
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.03em}
.field input,.field select,.field textarea,.inp{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 12px;min-width:0}
.field textarea{min-height:76px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.hint{font-size:12px;color:var(--ink-3)}
.err{font-size:13px;color:var(--bad);font-weight:600}
.row{display:flex;gap:10px;align-items:center}
.row>*{min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:not(:disabled):active{transform:translateY(1px)}
.sel-row{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sel-row .field{flex-direction:row;align-items:center;gap:10px;padding:2px 10px;background:var(--surface-2)}
.sel-row .field+.field{border-top:1px solid var(--line)}
.sel-row select{flex:1;border:0;background:transparent;padding:11px 0;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.o{background:var(--ink)} .dot.d{background:var(--accent);border-radius:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* opções de modalidade */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 12px;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .oi{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center}
.opt[aria-pressed="true"] .oi{background:var(--surface)}
.opt b{display:block;font-size:15px}
.opt span{font-size:12px;color:var(--ink-2)}
.opt .pr{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.opt .pr small{display:block;font-weight:500;font-size:11px;color:var(--ink-2)}

/* cartões e listas */
.card{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.card.soft{background:var(--surface-2);border-color:transparent}
.card.accent{background:var(--accent-soft);border-color:transparent}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent-strong)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.ex{background:transparent;border:1px dashed var(--ink-3);color:var(--ink-3)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.kv span:first-child{color:var(--ink-2)}
.kv b{font-variant-numeric:tabular-nums}
.big{font-family:var(--f-display);font-weight:500;font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pin{font-family:var(--f-mono);font-size:26px;letter-spacing:.3em;font-weight:500}
.plate{font-family:var(--f-mono);font-weight:500;border:1.5px solid var(--ink);border-radius:6px;padding:1px 6px;font-size:13px;letter-spacing:.06em}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none;border:1px solid var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:72px;height:72px;font-size:22px}
.toggle{position:relative;width:52px;height:30px;border-radius:999px;background:var(--line);border:0;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.toggle[aria-pressed="true"]{background:var(--accent)}
.toggle[aria-pressed="true"]::after{left:25px}
.stars{display:flex;gap:6px;justify-content:center}
.stars button{border:0;background:none;color:var(--line);padding:2px}
.stars button.on{color:var(--accent)}
.stars svg{fill:currentColor;stroke:none}
.searching{display:grid;place-items:center;gap:14px;text-align:center;padding:20px 0}
.pulse{width:84px;height:84px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;position:relative;color:var(--accent-strong)}
.pulse::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.8}to{transform:scale(1.6);opacity:0}}
.gauge{height:14px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.gauge i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.gauge.low i{background:var(--bad)}
.gauge.mid i{background:var(--warn)}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--surface-2);font-size:14px;align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--surface)}
.msg small{display:block;font-size:10px;opacity:.65;margin-top:2px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--accent)}
.center{text-align:center;align-items:center;justify-content:center}
.welcome{background:var(--ink);color:var(--surface);justify-content:space-between}
.welcome .wm{font-family:var(--f-display);font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1}
.welcome p{color:var(--ink-3);font-size:16px;max-width:30ch}
.welcome .btn{border-color:transparent}
.welcome .btn.ghost{background:transparent;color:var(--surface);border-color:var(--ink-2)}
.offer{position:absolute;left:12px;right:12px;bottom:72px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);border:2px solid var(--accent);padding:16px;display:flex;flex-direction:column;gap:10px;animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.inline-note{font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:8px 10px}

/* mapa svg */
.m-road{stroke:var(--road);stroke-width:15;stroke-linecap:round;fill:none}
.m-casing{stroke:var(--casing);stroke-width:21;stroke-linecap:round;fill:none}
.m-route{stroke:var(--accent);stroke-width:11;stroke-linecap:round;stroke-linejoin:round;fill:none}
.m-route-done{stroke:var(--ink-3);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.5}
.m-label{font:600 25px var(--f-body);fill:var(--label);paint-order:stroke;stroke:var(--halo);stroke-width:7px;stroke-linejoin:round}
.m-river{font:italic 500 24px var(--f-body);fill:var(--ink-3);opacity:.9}
.m-place{fill:var(--surface);stroke:var(--ink-2);stroke-width:4}
.m-hit{fill:transparent;cursor:pointer}
.m-car{fill:var(--ink)}
.m-car.me{fill:var(--accent)}
.m-car.hi{fill:var(--accent-strong)}
.m-carwin{fill:var(--surface);opacity:.85}
.m-o{fill:var(--ink)}
.m-d{fill:var(--accent)}
.m-ostroke{fill:var(--surface);stroke:var(--ink);stroke-width:5}
.m-other{fill:var(--ink-3)}
.m-ch{fill:var(--info)}
.m-chtxt{fill:var(--surface);font:700 20px var(--f-body)}

/* administração */
.admin{max-width:1240px;margin:0 auto 32px;display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:900px){.admin{grid-template-columns:220px 1fr}}
.side{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;align-self:start}
@media(max-width:899px){.side{flex-direction:row;overflow-x:auto;border-radius:14px}}
.side button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:10px;font-weight:600;color:var(--ink-2);display:flex;gap:10px;align-items:center;white-space:nowrap;font-size:14px}
.side button[aria-current="page"]{background:var(--ink);color:var(--surface)}
.side .badge{margin-left:auto;background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:11px;padding:1px 7px}
.acontent{display:flex;flex-direction:column;gap:18px;min-width:0}
.ahead{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between}
.ahead h1{margin:0;font-family:var(--f-display);font-weight:500;font-size:24px;letter-spacing:-.02em}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .k{font-size:12px;color:var(--ink-2);font-weight:600;letter-spacing:.03em}
.kpi .v{font-family:var(--f-display);font-weight:500;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink-3)}
.charts{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:1100px){.charts{grid-template-columns:1fr 1fr}}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.chart h3{margin:0;font-size:15px}
.chart svg:not(.ic){width:100%;height:auto;display:block}
.chart .map svg{height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.c1{fill:var(--accent);background:var(--accent)} .c2{fill:var(--ink);background:var(--ink)} .c3{fill:var(--ink-3);background:var(--ink-3)}
.ax{font:500 13px var(--f-body);fill:var(--ink-3)}
.gridl{stroke:var(--line);stroke-width:1}
.tw{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:12px;letter-spacing:.04em;color:var(--ink-2);font-weight:700;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.wrap{white-space:normal;min-width:220px}
td .row{gap:6px}
.form-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* sobreposições */
.overlay{position:fixed;inset:0;background:rgba(8,12,10,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:20px;max-width:460px;width:100%;max-height:86vh;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.modal h3{margin:0;font-size:18px}
.modal p{margin:0}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60;width:min(420px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--surface);border-radius:14px;padding:11px 14px;font-size:14px;box-shadow:var(--shadow);animation:rise .2s ease-out}
.toast.ok{border-left:4px solid var(--accent)}
.toast.bad{border-left:4px solid var(--bad)}
.toast.sim{border-left:4px solid var(--warn)}
/* rotina */
.daychips{display:flex;flex-wrap:wrap;gap:6px}
.daychips label,.seg label{position:relative;display:block}
.daychips input,.seg input{position:absolute;opacity:0;width:1px;height:1px}
.daychips span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;background:var(--surface)}
.daychips input:checked+span{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.daychips input:focus-visible+span,.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg span{display:flex;flex-direction:column;gap:2px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;background:var(--surface);height:100%}
.seg span small{font-size:12px;color:var(--ink-2)}
.seg input:checked+span{border-color:var(--accent);background:var(--accent-soft)}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.code{font-family:var(--f-mono);font-size:24px;letter-spacing:.12em;font-weight:500}
.c4{fill:var(--info);background:var(--info)}
.report{white-space:pre-wrap;font-family:var(--f-mono);font-size:13px;line-height:1.55;background:var(--surface-2);border-radius:12px;padding:14px;margin:0;overflow-x:auto}
.cwrap{max-width:1240px;margin:0 auto 32px;display:flex;flex-direction:column;gap:18px}
@media(max-width:520px){.head-r{width:100%}.roles{width:100%}.roles button{flex:1;padding:7px 4px;font-size:13px}.roles .lg{display:none}}
@media(min-width:521px){.roles .sm{display:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

const ADJ={};Object.keys(NODES).forEach(n=>ADJ[n]=[]);

const RC={};
function route(a,b){
 const k=a+'>'+b;if(RC[k])return RC[k];
 if(a===b)return RC[k]={path:[a],km:0};
 const dist={},prev={},done=new Set();Object.keys(NODES).forEach(n=>dist[n]=Infinity);dist[a]=0;
 for(;;){let u=null,best=Infinity;for(const n in dist)if(!done.has(n)&&dist[n]<best){best=dist[n];u=n}
  if(u===null||u===b)break;done.add(u);for(const [v,w] of ADJ[u])if(dist[u]+w<dist[v]){dist[v]=dist[u]+w;prev[v]=u}}

}
function buildPath(nodes){let path=[nodes[0]],km=0;const marks=[0];for(let i=0;i<nodes.length-1;i++){const r=route(nodes[i],nodes[i+1]);path=path.concat(r.path.slice(1));km+=r.km;marks.push(km)}return{path,km,marks}}
function pathLen(path){let a=0;for(let i=0;i<path.length-1;i++)a+=D(path[i],path[i+1]);return a}
function cumTo(path,idx){let a=0;for(let i=0;i<idx;i++)a+=D(path[i],path[i+1]);return a}

function driverBusy(did,exceptRide){return S.rides.some(r=>r.id!==exceptRide&&((r.driverId===did&&r.status==='aceita')||(r.status==='buscando'&&r.offer&&r.offer.driverId===did)))}
function eligible(d,ride){

 return true;
}
function candidates(ride){
 const firstNode=ride.stops[0].node;
 return S.drivers.filter(d=>eligible(d,ride)&&!ride.tried.includes(d.id)&&!driverBusy(d.id,ride.id))
  .map(d=>({d,km:route(d.node,firstNode).km})).filter(c=>rangeOf(c.d)>=reqKm(c.km+ride.tripKm)).sort((a,b)=>a.km-b.km);

function poolPlan(A,B){
 const c=S.cfg;if(A.seats+B.seats>c.maxSeats)return null;
 if(Math.min(route(A.origin,B.origin).km,route(B.origin,A.origin).km)>c.poolRadius)return null;
 if(Math.abs((A.when||now())-(B.when||now()))>c.poolWindow*60000)return null;
 const sA=route(A.origin,A.dest).km,sB=route(B.origin,B.dest).km;if(sA<.4||sB<.4)return null;
 const P={Ao:{node:A.origin,who:'A',type:'pickup'},Ad:{node:A.dest,who:'A',type:'drop'},Bo:{node:B.origin,who:'B',type:'pickup'},Bd:{node:B.dest,who:'B',type:'drop'}};
 const orders=[['Ao','Bo','Ad','Bd'],['Ao','Bo','Bd','Ad'],['Bo','Ao','Ad','Bd'],['Bo','Ao','Bd','Ad']];
 let best=null;
 for(const ord of orders){const bp=buildPath(ord.map(k=>P[k].node));const m=k=>bp.marks[ord.indexOf(k)];
  const inA=m('Ad')-m('Ao'),inB=m('Bd')-m('Bo'),dA=inA/sA-1,dB=inB/sB-1;
  if(dA>c.poolDetour||dB>c.poolDetour)continue;
  if(!best||bp.km<best.km)best={ord,km:bp.km,inA,inB}}
 if(!best)return null;
 const total=fareFor('essencial',best.km,minsFor(best.km)),soloA=fareFor('essencial',sA,minsFor(sA)),soloB=fareFor('essencial',sB,minsFor(sB));
 const fA=r2(Math.min(total*sA/(sA+sB),soloA*c.poolCap)),fB=r2(Math.min(total*sB/(sA+sB),soloB*c.poolCap));
 return{stops:best.ord.map(k=>P[k]),km:best.km,
  A:{fare:fA,solo:soloA,saving:r2(soloA-fA),extra:Math.max(0,Math.round(minsFor(best.inA-sA))),soloKm:sA},
  B:{fare:fB,solo:soloB,saving:r2(soloB-fB),extra:Math.max(0,Math.round(minsFor(best.inB-sB))),soloKm:sB},
  kmSaved:r2(sA+sB-best.km)};
}

 return S.pool.filter(r=>r.status==='aberto'&&r.pid!==pid).map(r=>({req:r,plan:poolPlan(me,r)})).filter(x=>x.plan).sort((a,b)=>b.plan.A.saving-a.plan.A.saving);

// ordena embarques (do mais distante do destino para o mais próximo) e desembarques (vizinho mais próximo) e mede o desvio de cada um
function groupPlan(subs,leg){
 const P=subs.map(x=>({s:x,a:leg==='volta'?x.dest:x.origin,b:leg==='volta'?x.origin:x.dest}));
 const rest=P.slice().sort((x,y)=>route(y.a,y.b).km-route(x.a,x.b).km);const ups=[rest.shift()];
 while(rest.length){const last=ups[ups.length-1].a;rest.sort((x,y)=>route(last,x.a).km-route(last,y.a).km);ups.push(rest.shift())}
 const drops=P.slice(),downs=[];let cur=ups[ups.length-1].a;
 while(drops.length){drops.sort((x,y)=>route(cur,x.b).km-route(cur,y.b).km);const n=drops.shift();downs.push(n);cur=n.b}
 const stops=ups.map(x=>({node:x.a,type:'pickup',sub:x.s})).concat(downs.map(x=>({node:x.b,type:'drop',sub:x.s})));
 const bp=buildPath(stops.map(x=>x.node));let ok=true;const det={};
 P.forEach(x=>{const i=stops.findIndex(z=>z.sub===x.s&&z.type==='pickup'),j=stops.findIndex(z=>z.sub===x.s&&z.type==='drop');const inKm=bp.marks[j]-bp.marks[i],solo=route(x.a,x.b).km;
  det[x.s.id]={inKm,solo,extra:Math.max(0,Math.round(minsFor(inKm-solo)))};if(solo>.3&&inKm/solo-1>S.cfg.poolDetour+1e-6)ok=false});
 return{stops,km:bp.km,ok,det};
}
function groupCap(g){const d=g.driverId&&getD(g.driverId),v=d&&vehOf(d);return Math.min(S.cfg.maxSeats,v?v.seats-1:S.cfg.maxSeats)}
function matchGroup(sub){let best=null;
 for(const g of S.groups){
  if(!g.shared||!sub.shared||g.status==='encerrado'||g.cat!==sub.cat)continue;
  if(!sub.days.every(x=>g.days.includes(x)))continue;
  if(tdiff(sub.go,g.go)>S.cfg.rotTol)continue;
  if(!!sub.back!==!!g.back||(sub.back&&tdiff(sub.back,g.back)>S.cfg.rotTol))continue;
  const m=activeSubs(g).filter(x=>x.pid!==sub.pid);if(!m.length||m.length+1>groupCap(g))continue;
  if(route(m[0].origin,sub.origin).km>S.cfg.poolRadius)continue;
  const p1=groupPlan(m.concat(sub),'ida');if(!p1.ok)continue;
  if(g.back&&!groupPlan(m.concat(sub),'volta').ok)continue;
  const added=p1.km-groupPlan(m,'ida').km;
  if(!best||added<best.added)best={g,members:m,plan:p1,added,extra:p1.det[sub.id].extra}}
 return best}

function tick(){
 const t=now(),dt=Math.min(1.5,(t-last)/1000);last=t;const sp=S.cfg.demoSpeed;
 for(const ride of S.rides){
  if(ride.example)continue;
  if(ride.status==='buscando'){
   if(!ride.offer){dispatch(ride);dirty=true}
   else if(t>=ride.offer.exp){if(ride.offer.human){ride.tried.push(ride.offer.driverId);ride.offer=null;dispatch(ride)}else acceptRide(ride,ride.offer.driverId);dirty=true}
  }else if(ride.status==='sem_motorista'&&t-(ride.lastTry||0)>10000){ride.tried=[];dispatch(ride);if(ride.status!=='sem_motorista')dirty=true}
  else if(ride.status==='aceita'){
   const total=pathLen(ride.path);let hold=Infinity;
   if(ride.human){const i=ride.stops.findIndex(s=>s.type==='pickup'&&!s.done&&!ride.pax[s.pid].pinOk&&!ride.pax[s.pid].cancelled);if(i>=0)hold=ride.marks[i+1]}
   const before=ride.dist;ride.dist=Math.min(total,hold,ride.dist+dt*sp);
   ride.stops.forEach((s,i)=>{if(s.done||ride.pax[s.pid].cancelled)return;const m=ride.marks[i+1];
    if(s.type==='pickup'&&!s.near&&m-ride.dist<.35&&m-ride.dist>0){s.near=true;notify('p:'+s.pid,'Seu motorista está chegando.')}
    if(ride.dist>=m-1e-6){if(s.type==='pickup'&&ride.human&&!ride.pax[s.pid].pinOk)return;s.done=true;dirty=true;const p=ride.pax[s.pid];
     if(s.type==='pickup'){p.onboard=true;notify('p:'+s.pid,'Embarque confirmado. Boa viagem!')}
     else finishPax(ride,s.pid)}});
   if(ride.dist>=total-1e-6&&ride.stops.every(s=>s.done||ride.pax[s.pid].cancelled)){completeRide(ride);dirty=true}
   if(before!==ride.dist)UI.moving=true;
  }
 }
 for(const sc of S.schedules){
  if(sc.status==='buscando'){
   if(t>=sc.when){sc.status='sem_motorista';notify('p:'+sc.pid,'Nenhum motorista confirmou seu agendamento a tempo.','bad');dirty=true}
   else if(t-sc.createdAt>6000&&S.demo){const bots=S.drivers.filter(d=>d.example&&d.id!==S.session.d&&d.status==='aprovado'&&!d.suspended&&d.acceptSched&&(sc.cat==='essencial'||vehOf(d).cat==='conforto')).sort((a,b)=>route(a.node,sc.origin).km-route(b.node,sc.origin).km);if(bots[0]){schedAssign(sc,bots[0].id);dirty=true}}
  }else if(sc.status==='confirmado'){
   if(!sc.reminded&&t>=sc.when-S.cfg.reminderMin*60000){sc.reminded=true;notify('p:'+sc.pid,`Lembrete: sua corrida agendada sai às ${fmtT(sc.when)}.`);dirty=true}
   if(t>=sc.when){startSchedule(sc);dirty=true}
  }
 }
 const wd=new Date(t).getDay(),dk=dKey(t);
 for(const g of S.groups){
  if(g.status==='aguardando_motorista'&&S.demo&&t-(g.waitSince||g.createdAt)>15000&&activeSubs(g).length){
   const n=activeSubs(g).length,fp=groupPlan(activeSubs(g),'ida').stops[0].node;const cnt=id=>S.groups.filter(x=>x.driverId===id&&x.status==='ativo').length;
   const bots=S.drivers.filter(d=>d.example&&d.id!==S.session.d&&d.status==='aprovado'&&!d.suspended&&vehOf(d)&&vehOf(d).seats-1>=n&&(g.cat==='essencial'||vehOf(d).cat==='conforto')).sort((a,b)=>cnt(a.id)-cnt(b.id)||route(a.node,fp).km-route(b.node,fp).km);
   if(bots[0]){assignGroup(g,bots[0].id);dirty=true}}
  if(g.status==='ativo'&&g.days.includes(wd)){for(const leg of (g.back?['ida','volta']:['ida'])){const tm=atTime(t,leg==='ida'?g.go:g.back);if(t>=tm&&t<tm+20*60000&&!g.ran[dk+':'+leg]){startGroupTrip(g,leg,false);dirty=true}}}
 }
 for(const d of S.drivers){if(d.charging){d.battery=Math.min(d.charging.target,d.battery+dt*2.5);if(d.battery>=d.charging.target){d.charging=null;notify('d:'+d.id,'Recarga concluída.');dirty=true}}}
 poolAcc+=dt;if(poolAcc>4){poolAcc=0;S.pool.forEach(r=>{if(!r.example&&r.status==='aberto'&&t-r.createdAt>10*60000){r.status='expirado';notify('p:'+r.pid,'Seu pedido compartilhado expirou sem parceiro.','bad');dirty=true}});const n=S.pool.filter(r=>r.status==='aberto').length;maintainDemoPool();if(S.pool.filter(r=>r.status==='aberto').length!==n&&UI.role==='a')dirty=true}
 saveAcc+=dt;if(saveAcc>1||dirty){saveAcc=0;save()}
 if(dirty){dirty=false;render(true)}else live();
}

 peta(id){const r=S.rides.find(x=>x.id===id);const pid=S.session.p;if(!r||!pid||r.status!=='aceita')return'';const p=r.pax[pid];
  const tgt=p.onboard?stopMark(r,pid,'drop'):stopMark(r,pid,'pickup');const rem=Math.max(0,tgt-r.dist);
  if(!p.onboard&&rem<.03)return r.human&&!p.pinOk?'Motorista no local. Informe seu PIN.':'Motorista no local de embarque.';
  return p.onboard?`Chegada em ${Math.max(1,Math.round(minsFor(rem)))} min · ${fmtKm(rem)}`:`Motorista a ${Math.max(1,Math.round(minsFor(rem)))} min · ${fmtKm(rem)}`},

 batt(id){const d=getD(id);return d?Math.round(d.battery)+'%':''},
 battbar(id){const d=getD(id);return d?`<i style="width:${Math.round(d.battery)}%"></i>`:''},
 drange(id){const d=getD(id);return d?Math.round(rangeOf(d))+' km':''},
 dnav(id){const r=S.rides.find(x=>x.id===id);if(!r)return'';const i=r.stops.findIndex(s=>!s.done&&!r.pax[s.pid].cancelled);if(i<0)return'Finalizando';const s=r.stops[i];const rem=Math.max(0,r.marks[i+1]-r.dist);
  const who=first(r.pax[s.pid].name);if(rem<.03&&s.type==='pickup')return`Aguardando ${esc(who)} embarcar`;return`${s.type==='pickup'?'Buscar':'Deixar'} ${esc(who)} em ${esc(pname(s.node))} · ${fmtKm(rem)}`}

function readRot(f){const fd=new FormData(f);const shared=fd.get('mode')!=='solo',hasBack=!!fd.get('hasBack');
 return{o:fd.get('o'),d:fd.get('d'),days:fd.getAll('days').map(Number),go:fd.get('go')||'',back:hasBack?(fd.get('back')||''):null,hasBack,shared,cat:shared?'essencial':(fd.get('cat')||'essencial'),m:fd.get('m'),code:String(fd.get('code')||'').trim().toUpperCase()}}
function rotPreview(x){
 if(!x.o||!x.d||x.o===x.d)return'<span class="small">Escolha um destino diferente do embarque.</span>';
 if(!x.days.length)return'<span class="small">Escolha pelo menos um dia da semana.</span>';
 if(!/^\d{2}:\d{2}$/.test(x.go)||(x.hasBack&&!/^\d{2}:\d{2}$/.test(x.back||'')))return'<span class="small">Informe os horários.</span>';
 const pr=rotPrice(x.o,x.d,x.days,x.back,x.shared,x.cat);
 let h=`<div class="kv"><span>Viagens por mês</span><b>${pr.trips}</b></div><div class="kv"><span>Por viagem</span><b>${brl(pr.per)} <span class="muted small" style="text-decoration:line-through">${brl(pr.av)}</span></b></div><div class="kv"><span>Mensalidade</span><b style="font-size:18px">${brl(pr.monthly)}</b></div><div class="kv"><span>Economia no mês</span><b style="color:var(--accent-strong)">${brl(pr.avMonthly-pr.monthly)}</b></div>`;
 if(x.shared){const m=matchGroup({id:'tmp',pid:S.session.p,origin:x.o,dest:x.d,days:x.days,go:x.go,back:x.back,shared:true,cat:'essencial'});
  h+=m?`<div class="inline-note">${ic('users',14)} Grupo encontrado: ${m.members.length} ${m.members.length>1?'pessoas já fazem':'pessoa já faz'} esse trajeto, ${daysLbl(m.g.days).toLowerCase()}, saída às ${m.g.go}. ${m.g.driverId?'Motorista fixo: '+esc(first(getD(m.g.driverId).name))+'.':'Motorista fixo em definição.'} ${m.extra?'Seu trajeto fica '+m.extra+' min mais longo.':'Sem desvio no seu trajeto.'}</div>`
  :`<div class="inline-note">Nenhum grupo compatível ainda. Você abre um grupo novo, e quem fizer um trajeto parecido no mesmo horário entra nele. O preço compartilhado vale desde o primeiro dia.</div>`}
 return h;
}

function stackChart(days){
 const W=620,H=220,pl=36,pb=26,pt=12,iw=W-pl-8,ih=H-pb-pt;const max=Math.max(1,...days.map(d=>d.v.reduce((a,b)=>a+b,0)));const top=Math.ceil(max/4)*4||4;const bw=iw/days.length;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Corridas por dia">`;
 for(let i=0;i<=4;i++){const v=top*i/4,y=pt+ih-ih*i/4;s+=`<line x1="${pl}" x2="${W-8}" y1="${y}" y2="${y}" class="gridl"/><text x="${pl-8}" y="${y+4}" text-anchor="end" class="ax">${v}</text>`}
 days.forEach((d,i)=>{let y=pt+ih;const x=pl+i*bw+bw*.2,w=bw*.6;d.v.forEach((v,k)=>{if(!v)return;const h=v/top*ih;y-=h;s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" class="c${k+1}"><title>${d.label}: ${v}</title></rect>`});s+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" class="ax">${d.label}</text>`});
 return s+'</svg>';
}
function lineChart(days){

 const X=i=>pl+i*iw/(days.length-1),Y=v=>pt+ih-v/top*ih;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturamento por dia">`;
 for(let i=0;i<=4;i++){const v=top*i/4,y=Y(v);s+=`<line x1="${pl}" x2="${W-16}" y1="${y}" y2="${y}" class="gridl"/><text x="${pl-8}" y="${y+4}" text-anchor="end" class="ax">${Math.round(v)}</text>`}
 const pts=days.map((d,i)=>`${X(i)},${Y(d.v)}`).join(' ');
 s+=`<polygon points="${X(0)},${Y(0)} ${pts} ${X(days.length-1)},${Y(0)}" fill="var(--accent)" opacity=".14"/><polyline points="${pts}" fill="none" stroke="var(--accent-strong)" stroke-width="2.5" stroke-linejoin="round"/>`;
 days.forEach((d,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(d.v)}" r="${i===days.length-1?5:3}" fill="${i===days.length-1?'var(--accent-strong)':'var(--surface)'}" stroke="var(--accent-strong)" stroke-width="2"><title>${d.label}: ${brl(d.v)}</title></circle><text x="${X(i)}" y="${H-8}" text-anchor="middle" class="ax">${d.label}</text>`});
 return s+'</svg>';
}

function setErr(id,msg){const el=document.getElementById(id);if(el)el.textContent=msg||''}

function readImg(file,cb){if(!file)return;const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),s=128,sc=Math.max(s/img.width,s/img.height);c.width=s;c.height=s;const ctx=c.getContext('2d');ctx.drawImage(img,(s-img.width*sc)/2,(s-img.height*sc)/2,img.width*sc,img.height*sc);try{cb(c.toDataURL('image/jpeg',.82))}catch(e){toast('Não foi possível ler a imagem.','bad')}};img.onerror=()=>toast('Arquivo de imagem inválido.','bad');img.src=fr.result};fr.readAsDataURL(file)}
function copyText(t){const done=()=>toast('Copiado para a área de transferência.');try{navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t))}catch(e){fallbackCopy(t)}}
function fallbackCopy(t){UI.modal=`<h3>Copie o texto</h3><textarea class="inp mono small" style="min-height:160px" readonly id="copybox">${esc(t)}</textarea>`;render();const el=document.getElementById('copybox');if(el){el.focus();el.select()}}

function requestRide(u){
 const o=UI.p.origin,d=UI.p.dest;if(!o||!d||o===d){toast('Escolha embarque e destino diferentes.','bad');return}
 const cat=UI.p.kind==='divide'?'essencial':UI.p.cat;const km=route(o,d).km;const gross=fareFor(cat,km,minsFor(km));
 const cp=couponCheck(UI.p.coupon,gross);if(!cp.ok){toast(cp.msg,'bad');return}
 const mv=UI.p.method||u.defMethod||'pix';const method=mv.startsWith('cartao')?'cartao':mv;
 if(method==='cartao'&&!u.cards.length){toast('Cadastre um cartão na Carteira.','bad');return}
 if(cp.code){const c=S.coupons.find(x=>x.code===cp.code);c.used++}
 newRide({kind:'solo',cat,stops:[{node:o,type:'pickup',pid:u.id},{node:d,type:'drop',pid:u.id}],pax:{[u.id]:{name:u.name,gross,discount:cp.discount||0,fare:r2(gross-(cp.discount||0)),coupon:cp.code||null,method,payStatus:'aguardando',pin:newPin(),soloKm:km,fee:0}}});
 UI.p.coupon='';UI.p.dest=null;
}
function cancelPax(ride,pid,byAdmin){
 const p=ride.pax[pid];if(!p||p.cancelled||p.done)return;
 let fee=0;if(!byAdmin&&ride.kind!=='rotina'&&ride.status==='aceita'&&now()-ride.acceptedAt>S.cfg.freeCancelSec*1000&&!p.onboard)fee=S.cfg.cancelFee;
 p.cancelled=true;p.fee=fee;p.payStatus=fee?'pendente':'cancelada';
 if(fee){charge(ride,pid,fee,'cancelamento');if(p.payStatus==='pendente'){p.payStatus='pago';p.payNote='Taxa registrada (simulação)'}}
 const others=Object.keys(ride.pax).filter(x=>!ride.pax[x].cancelled&&!ride.pax[x].done);
 if(!others.length){if(ride.status==='aceita'&&Object.values(ride.pax).some(x=>x.done)){completeRide(ride)}else{ride.status='cancelada';ride.cancelledAt=now();ride.offer=null;const gross=Object.values(ride.pax).reduce((a,x)=>a+(x.fee||0),0);ride.driverNet=r2(gross*(1-S.cfg.commission))}}
 else if(ride.status==='aceita'){
  const segK=pointAt(ride.path,ride.dist).seg;const nextNode=ride.path[Math.min(ride.path.length-1,segK+1)];const base=cumTo(ride.path,Math.min(ride.path.length-1,segK+1));
  const passed=[],keep=[];ride.stops.forEach((s,i)=>{if(s.done)passed.push({s,m:ride.marks[i+1]});else if(!ride.pax[s.pid].cancelled)keep.push(s)});
  const bp=buildPath([nextNode].concat(keep.map(s=>s.node)));
  ride.path=ride.path.slice(0,segK+1).concat(bp.path);ride.stops=passed.map(x=>x.s).concat(keep);ride.marks=[0].concat(passed.map(x=>x.m),bp.marks.slice(1).map(m=>m+base));
  notify('d:'+ride.driverId,`${first(p.name)} cancelou. Rota recalculada.`);
 }
 if(ride.driverId&&ride.status==='cancelada')notify('d:'+ride.driverId,'O passageiro cancelou a corrida.','bad');
 return fee;
}
function takePool(u,reqId){
 const req=S.pool.find(r=>r.id===reqId&&r.status==='aberto');if(!req){toast('Esse pedido não está mais disponível.','bad');UI.p.poolOpts=poolOptions(u.id,UI.p.origin,UI.p.dest,UI.p.seats);return}
 const plan=poolPlan({origin:UI.p.origin,dest:UI.p.dest,seats:UI.p.seats,when:now()},req);if(!plan){toast('Trajetos não são mais compatíveis.','bad');return}
 const other=getU(req.pid);const mv=UI.p.method||u.defMethod||'pix';const method=mv.startsWith('cartao')?'cartao':mv;
 const cp=couponCheck(UI.p.coupon,plan.A.fare);if(cp.code){S.coupons.find(x=>x.code===cp.code).used++}
 const stops=plan.stops.map(s=>({node:s.node,type:s.type,pid:s.who==='A'?u.id:req.pid}));
 req.status='combinado';
 newRide({kind:'divide',cat:'essencial',seats:UI.p.seats+req.seats,stops,pax:{
  [u.id]:{name:u.name,gross:plan.A.fare,discount:cp.discount||0,fare:r2(plan.A.fare-(cp.discount||0)),coupon:cp.code||null,method,payStatus:'aguardando',pin:newPin(),soloKm:plan.A.soloKm,fee:0},
  [req.pid]:{name:other.name,gross:plan.B.fare,discount:0,fare:plan.B.fare,method:req.method||'pix',payStatus:'aguardando',pin:newPin(),soloKm:plan.B.soloKm,fee:0}}});
 if(!other.example)notify('p:'+req.pid,`${first(u.name)} entrou na sua viagem compartilhada.`);
 UI.p.sub=null;UI.p.poolOpts=null;UI.p.dest=null;UI.p.coupon='';
}
function poolSoloFromReq(req){
 const u=getU(req.pid);req.status='cancelado';const km=route(req.origin,req.dest).km;const gross=fareFor('essencial',km,minsFor(km));
 newRide({kind:'solo',cat:'essencial',stops:[{node:req.origin,type:'pickup',pid:u.id},{node:req.dest,type:'drop',pid:u.id}],pax:{[u.id]:{name:u.name,gross,discount:0,fare:gross,method:req.method||'pix',payStatus:'aguardando',pin:newPin(),soloKm:km,fee:0}}});
}
function purgeDemo(){
 const exU=new Set(S.users.filter(u=>u.example).map(u=>u.id)),exD=new Set(S.drivers.filter(d=>d.example).map(d=>d.id));
 S.rides=S.rides.filter(r=>!r.example&&!Object.keys(r.pax).some(p=>exU.has(p))&&!exD.has(r.driverId));
 S.schedules=S.schedules.filter(s=>!exU.has(s.pid));S.schedules.forEach(s=>{if(exD.has(s.driverId)){s.driverId=null;if(s.status==='confirmado')s.status='buscando'}});
 S.pool=S.pool.filter(r=>!r.example&&!exU.has(r.pid));S.tickets=S.tickets.filter(t=>!t.example);
 S.subs=S.subs.filter(x=>!x.example&&!exU.has(x.pid));S.companies=S.companies.filter(c=>!c.example);
 S.subs.forEach(x=>{if(x.companyId&&!getCo(x.companyId)){x.companyId=null;x.method='pix';x.pay='pendente'}});
 S.groups.forEach(g=>{g.members=g.members.filter(id=>getSub(id));if(g.driverId&&exD.has(g.driverId)){g.driverId=null;g.status='aguardando_motorista';g.waitSince=now()}});
 S.groups=S.groups.filter(g=>g.members.length);if(S.session.e&&!getCo(S.session.e))S.session.e=null;
 S.users=S.users.filter(u=>!u.example);S.drivers=S.drivers.filter(d=>!d.example);S.vehicles=S.vehicles.filter(v=>!v.example);
 if(S.session.p&&exU.has(S.session.p))S.session.p=null;if(S.session.d&&exD.has(S.session.d))S.session.d=null;
 S.demo=false;logA('Dados de exemplo removidos','A base agora contém só cadastros reais deste navegador');
}

  if(x.m==='empresa'){co=S.companies.find(c=>c.code===x.code&&c.active);if(!co)return setErr('rf-err','Código de empresa inválido ou inativo. Confira com o RH.')}
  if(x.m==='carteira'&&u.wallet<pr.monthly)return setErr('rf-err',`Saldo insuficiente na carteira (${brl(u.wallet)}). Recarregue ou escolha outra forma de pagamento.`);
  if(x.m==='cartao'&&!u.cards.length)return setErr('rf-err','Cadastre um cartão na Carteira.');
  const sub={id:uid('s'),pid:u.id,origin:x.o,dest:x.d,days:x.days,go:x.go,back:x.back,shared:x.shared,cat:x.cat,seats:1,method:x.m,companyId:co?co.id:null,perTrip:pr.per,tripsMonth:pr.trips,monthly:pr.monthly,avMonthly:pr.avMonthly,status:'ativa',pay:'pendente',groupId:null,skips:[],createdAt:now(),example:false};
  if(x.m==='carteira'){u.wallet=r2(u.wallet-pr.monthly);sub.pay='pago'}else if(x.m==='cartao'){sub.pay='pago'}else if(x.m==='empresa'){sub.pay='faturado'}
  if(sub.pay==='pago')u.points=(u.points||0)+Math.floor(pr.monthly);
  const m=x.shared?matchGroup(sub):null;let msg;
  if(m){m.g.members.push(sub.id);sub.groupId=m.g.id;const adj=sub.go!==m.g.go||sub.back!==m.g.back;sub.go=m.g.go;sub.back=m.g.back;
   msg=`Rotina criada. Você entrou no grupo de ${m.members.map(y=>first((getU(y.pid)||{name:''}).name)).join(' e ')}${adj?`, com saída ajustada para ${m.g.go}`:''}.`;
   if(m.g.driverId)notify('d:'+m.g.driverId,`${first(u.name)} entrou na sua rotina das ${m.g.go}.`);
   m.members.forEach(y=>{const uu=getU(y.pid);if(uu&&!uu.example)notify('p:'+y.pid,`${first(u.name)} entrou no seu grupo da Rotina.`)})}
  else{const g=newGroup(sub);sub.groupId=g.id;msg='Rotina criada. Estamos procurando um motorista fixo para o seu trajeto.'}
  S.subs.push(sub);
  logA('Nova assinatura Rotina',`${u.name}: ${pname(x.o)} → ${pname(x.d)}, ${brl(pr.monthly)} por mês${co?' (empresa '+co.name+')':''}`);
  UI.p.rotForm=false;toast(sub.pay==='pendente'?'Rotina criada. Pague o Pix da mensalidade para ativar.':msg);commit()},
 'e-login'(f,fd){const e=(fd.get('e')||'').trim().toLowerCase(),pw=fd.get('p')||'';const c=S.companies.find(x=>x.email===e);if(!c||!c.pw||c.pw!==hashPw(pw,c.id))return setErr('el-err',c&&!c.pw?'Empresa de exemplo: use o botão abaixo.':'E-mail ou senha incorretos.');S.session.e=c.id;commit()},
 'e-signup'(f,fd){const name=(fd.get('name')||'').trim(),cnpj=digits(fd.get('cnpj')),email=(fd.get('email')||'').trim().toLowerCase(),contact=(fd.get('contact')||'').trim(),pw=fd.get('pw')||'';
  if(name.length<3)return setErr('es-err','Informe a razão social.');if(!V.cnpj(cnpj))return setErr('es-err','CNPJ inválido.');if(S.companies.some(c=>c.cnpj===cnpj))return setErr('es-err','CNPJ já cadastrado.');
  if(!V.email(email))return setErr('es-err','E-mail inválido.');if(S.companies.some(c=>c.email===email))return setErr('es-err','E-mail já usado por outra empresa.');if(contact.length<3)return setErr('es-err','Informe o nome do responsável.');
  if(pw.length<8||!/\d/.test(pw)||!/[a-zA-Z]/.test(pw))return setErr('es-err','Senha com 8 caracteres, letras e números.');
  const base=name.normalize('NFD').replace(/[^A-Za-z]/g,'').toUpperCase().slice(0,6)||'EMPRESA';let code;do{code=base+String(10+Math.floor(Math.random()*90))}while(S.companies.some(c=>c.code===code));
  const id=uid('co');S.companies.push({id,name,cnpj,code,email,contact,pw:hashPw(pw,id),active:true,createdAt:now(),example:false});S.session.e=id;logA('Nova empresa cadastrada',name);toast('Empresa cadastrada. Compartilhe o código de convite com os colaboradores.');commit()},
 'a-login'(f,fd){const e=(fd.get('e')||'').trim().toLowerCase(),p=fd.get('p')||'';const a=S.admins.find(x=>x.email===e);if(!a||a.pw!==hashPw(p,e))return setErr('al-err','Credenciais inválidas.');S.session.a=true;logA('Acesso ao painel',e);commit()},
 'a-rej'(f,fd){const d=getD(f.dataset.id);d.status='rejeitado';d.reason=(fd.get('r')||'').trim()||'Documentação não aprovada.';const v=vehOf(d);if(v&&v.status==='pendente')v.status='rejeitado';UI.modal=null;logA('Motorista rejeitado',`${d.name}: ${d.reason}`);notify('d:'+d.id,'Seu cadastro não foi aprovado. Veja o motivo.','bad');commit()},
 'a-coupon'(f,fd){const code=String(fd.get('code')||'').trim().toUpperCase(),type=fd.get('type'),value=parseFloat(String(fd.get('value')).replace(',','.')),max=parseFloat(String(fd.get('max')||'0').replace(',','.'))||0,limit=parseInt(fd.get('limit'))||0,until=fd.get('until');
  if(!/^[A-Z0-9]{4,16}$/.test(code))return setErr('ac-err','Código com 4 a 16 letras ou números.');if(S.coupons.some(c=>c.code===code))return setErr('ac-err','Código já existe.');
  if(!(value>0)||(type==='pct'&&value>100))return setErr('ac-err','Valor inválido.');
  S.coupons.push({id:uid('cp'),code,type,value,max,until:until?new Date(until+'T23:59').getTime():null,limit,used:0,active:true,createdAt:now()});logA('Cupom criado',code);toast('Cupom criado.');commit()},
 'a-tariff'(f,fd){const n=k=>parseFloat(String(fd.get(k)).replace(',','.'));const keys=['e_base','e_km','e_min','e_minimo','c_base','c_km','c_min','c_minimo','commission','cancelFee','freeCancelSec','schedFee','leadMin','reminderMin','poolDetour','poolRadius','poolWindow','poolCap','maxSeats','reserveKm','lowBattery','co2Gas','co2Ev','demoSpeed','rotShared','rotSolo','rotTol'];
  for(const k of keys){const v=n(k);if(isNaN(v)||v<0)return setErr('at-err','Revise o campo '+k+': use números positivos.')}
  if(n('commission')>50)return setErr('at-err','Comissão acima de 50% não é permitida.');if(n('poolCap')>100||n('poolCap')<30)return setErr('at-err','Teto do Divide entre 30% e 100%.');if(n('maxSeats')<2||n('maxSeats')>7)return setErr('at-err','Passageiros por veículo entre 2 e 7.');if(n('demoSpeed')<=0||n('demoSpeed')>1)return setErr('at-err','Velocidade da simulação entre 0,01 e 1 km/s.');if(n('rotShared')<30||n('rotShared')>100||n('rotSolo')<30||n('rotSolo')>100)return setErr('at-err','Percentuais da Rotina entre 30% e 100% do avulso.');if(n('rotTol')>60)return setErr('at-err','Tolerância de horário de até 60 minutos.');
  S.tariffs.essencial={base:n('e_base'),km:n('e_km'),min:n('e_min'),minimo:n('e_minimo')};S.tariffs.conforto={base:n('c_base'),km:n('c_km'),min:n('c_min'),minimo:n('c_minimo')};
  Object.assign(S.cfg,{commission:n('commission')/100,cancelFee:n('cancelFee'),freeCancelSec:n('freeCancelSec'),schedFee:n('schedFee'),leadMin:n('leadMin'),reminderMin:n('reminderMin'),poolDetour:n('poolDetour')/100,poolRadius:n('poolRadius'),poolWindow:n('poolWindow'),poolCap:n('poolCap')/100,maxSeats:Math.round(n('maxSeats')),reserveKm:n('reserveKm'),lowBattery:n('lowBattery'),co2Gas:n('co2Gas')/1000,co2Ev:n('co2Ev')/1000,demoSpeed:n('demoSpeed'),rotShared:n('rotShared')/100,rotSolo:n('rotSolo')/100,rotTol:n('rotTol')});
  logA('Tarifas e regras alteradas',`Essencial ${brl(S.tariffs.essencial.base)} + ${brl(S.tariffs.essencial.km)}/km · Conforto ${brl(S.tariffs.conforto.base)} + ${brl(S.tariffs.conforto.km)}/km · comissão ${Math.round(S.cfg.commission*100)}%`);toast('Tarifas salvas.');commit()},
 'a-region'(f,fd){const n=(fd.get('n')||'').trim(),uf=String(fd.get('uf')||'').trim().toUpperCase();if(n.length<2||!/^[A-Z]{2}$/.test(uf))return setErr('ar-err','Informe cidade e UF com 2 letras.');if(S.regions.some(r=>r.name.toLowerCase()===n.toLowerCase()&&r.uf===uf))return setErr('ar-err','Cidade já cadastrada.');S.regions.push({id:uid('rg'),name:n,uf,active:false,note:(fd.get('note')||'').trim()});logA('Cidade adicionada',n+'/'+uf);commit()},
 'a-reply'(f,fd){const t=S.tickets.find(x=>x.id===f.dataset.id);const text=(fd.get('t')||'').trim();if(!text)return;t.replies.push({text,at:now()});notify(t.from,'A equipe Faísca respondeu seu chamado.');logA('Chamado respondido',t.cat+' de '+t.name);commit()}
};

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el)return;
 const a=el.dataset.a;
 if(a==='close-ov'){if(el.classList.contains('overlay')&&e.target!==el)return;UI.confirm=null;UI.modal=null;render();return}
 const fn=ACT[a];if(!fn)return;e.preventDefault();
 try{fn(el,e)}catch(err){console.error(err);toast('Algo deu errado: '+err.message,'bad')}
});
document.addEventListener('submit',e=>{
 const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();
 const fn=FORMS[f.dataset.f];if(!fn)return;
 try{fn(f,new FormData(f))}catch(err){console.error(err);toast('Algo deu errado: '+err.message,'bad')}
});
document.addEventListener('change',e=>{
 const el=e.target;const k=el.dataset.ch;
 if(el.form&&el.form.id==='rot-form'){updRotPreview();return}
 if(k==='p-orig'){UI.p.origin=el.value;if(UI.p.dest===el.value)UI.p.dest=null;render()}
 else if(k==='p-dest'){UI.p.dest=el.value||null;render()}
 else if(k==='p-method'){UI.p.method=el.value}
 else if(k==='p-photo'){readImg(el.files[0],url=>{pUser().photo=url;commit()})}
 else if(k==='d-photo'){readImg(el.files[0],url=>{dUser().photo=url;commit()})}
 else if(k==='d-pos'){const d=dUser();d.node=el.value;commit()}
 else if(k==='d-batt'){const d=dUser();d.battery=+el.value;commit()}
 else if(k==='dv-model'){UI.d.su.model=el.value;render(true);const m=EV[+el.value];if(el.value!==''&&el.value!=='outro'&&m){const a=document.getElementById('dv-seats'),b=document.getElementById('dv-range');if(a)a.value=m.seats;if(b)b.value=m.range}}
});
document.addEventListener('input',e=>{
if(e.target.form&&e.target.form.id==='rot-form'){updRotPreview();return}
  if(e.target.matches('[data-recalc]')){const f=e.target.form;const box=document.getElementById('sched-preview');if(f&&box)box.innerHTML=schedPreview(f.o.value,f.d.value,f.cat.value)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(UI.confirm||UI.modal)){UI.confirm=null;UI.modal=null;render()}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);const m={passageiro:'p',motorista:'d',empresa:'e',admin:'a'}[h];if(m&&m!==UI.role){UI.role=m;render()}});

/* ---------- início ---------- */
load();
(function(){const h=(location.hash||'').slice(1);UI.role={passageiro:'p',motorista:'d',empresa:'e',admin:'a'}[h]||'p'})();
maintainDemoPool();
render();
setInterval(tick,300);
</script>
