<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Postaí</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: painel de vidro fixo + área de trabalho sobre fundo espacial com grade; editor em folha sobreposta. Visual único, escuro e neon. */
:root{
  --bg:#06060D; --surface:#11111F; --surface-2:#191930; --line:#2A2A48;
  --ink:#EEF0FF; --muted:#9A9CC4; --accent:#22E4FF; --accent-ink:#04121A; --accent-soft:rgba(34,228,255,.13);
  --violet:#A855F7; --magenta:#FF3DA6;
  --grad:linear-gradient(120deg,#22E4FF 0%,#A855F7 55%,#FF3DA6 100%);
  --glass:linear-gradient(180deg,rgba(28,28,56,.74),rgba(12,12,26,.80));
  --edge:rgba(140,150,255,.18);
  --ig:#FF3DA6; --fb:#4D7CFF;
  --good:#2CF5A0; --good-soft:rgba(44,245,160,.12); --warn:#FFC24B; --warn-soft:rgba(255,194,75,.12); --bad:#FF4D6D; --bad-soft:rgba(255,77,109,.14);
  --shadow:0 20px 50px rgba(0,0,0,.45);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:18px;height:18px;flex:none}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);gap:20px;max-width:1360px;margin:0 auto;align-items:start}
.side{position:sticky;top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 12px;display:flex;flex-direction:column;gap:18px;min-height:calc(100vh - 32px)}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:19px}
.logo b{font-family:var(--f-display);font-size:22px;letter-spacing:-.01em}
.brand-chip{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--surface-2)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.brand-chip small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.brand-chip span{font-weight:600;font-size:14px;line-height:1.2}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .count{margin-left:auto;font-size:12px;background:var(--surface-2);color:var(--muted);border-radius:99px;padding:0 8px;font-family:var(--f-mono)}
.nav a[aria-current="page"] .count{background:var(--surface);color:var(--accent)}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px}

.main{min-width:0;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:30px;letter-spacing:-.015em}
.topbar p{margin:2px 0 0;color:var(--muted)}
.topbar .grow{flex:1;min-width:0}
.proto{font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 12px;display:flex;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:transparent;border-radius:8px;padding:6px;color:var(--muted);display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h2{font-size:18px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h .grow{flex:1}
.muted{color:var(--muted)}
.grid-2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi small{color:var(--muted);font-size:13px;display:block}
.kpi strong{font-family:var(--f-display);font-size:30px;line-height:1.1;display:block;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.kpi.alert strong{color:var(--bad)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-agendado{background:var(--accent-soft);color:var(--accent)}
.st-publicado{background:var(--good-soft);color:var(--good)}
.st-rascunho{background:var(--surface-2);color:var(--muted)}
.st-falhou{background:var(--bad-soft);color:var(--bad)}
.st-publicando{background:var(--warn-soft);color:var(--warn)}
.nets{display:inline-flex;gap:4px}
.net{width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;color:#fff}
.net .ic{width:14px;height:14px}
.net.ig{background:var(--ig)} .net.fb{background:var(--fb)}

.post-row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.post-row:first-child{border-top:0}
.thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--surface-2);display:block}
.thumb.empty{display:grid;place-items:center;color:var(--muted)}
.post-row .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.post-row .cap{margin:3px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.empty-state{padding:28px 12px;text-align:center;color:var(--muted)}

.attn{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:10px;background:var(--bad-soft);color:var(--ink);margin-bottom:10px}
.attn .ic{color:var(--bad);margin-top:2px}
.attn p{margin:0;font-size:14px}
.attn.ok{background:var(--good-soft)} .attn.ok .ic{color:var(--good)}

.ideas{display:flex;flex-direction:column;gap:8px}
.idea{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.idea b{font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.idea p{margin:0;font-size:14px}
.idea small{color:var(--muted);font-size:12px}

/* calendário */
.cal-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-tools h2{font-size:22px;min-width:200px;text-transform:capitalize}
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px;min-width:640px}
.cal .dow{background:var(--surface-2);padding:8px 10px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day{background:var(--surface);min-height:118px;padding:6px;display:flex;flex-direction:column;gap:4px;position:relative;min-width:0}
.day.out{background:var(--surface-2)}
.day.out .dnum{opacity:.5}
.day.past .chip{opacity:.75}
.day .dnum{font-size:13px;font-weight:600;font-family:var(--f-mono);padding:2px 4px;align-self:flex-start;border-radius:6px}
.day.today .dnum{background:var(--accent);color:var(--accent-ink)}
.day .add{position:absolute;top:4px;right:4px;opacity:0;transition:opacity .15s}
.day:hover .add,.day:focus-within .add{opacity:1}
.day.drop{outline:2px dashed var(--accent);outline-offset:-3px}
.chip{display:flex;align-items:center;gap:5px;font-size:12px;border-radius:6px;padding:3px 6px;border:0;text-align:left;background:var(--surface-2);min-width:0;width:100%;border-left:3px solid var(--muted)}
.chip .t{font-family:var(--f-mono);flex:none}
.chip .c{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip.agendado{border-left-color:var(--accent)}
.chip.publicado{border-left-color:var(--good)}
.chip.falhou{border-left-color:var(--bad);background:var(--bad-soft)}
.chip.rascunho{border-left-style:dashed}
.chip[draggable="true"]{cursor:grab}
.chip .dots{display:inline-flex;gap:2px;flex:none}
.dot{width:6px;height:6px;border-radius:50%}
.dot.ig{background:var(--ig)} .dot.fb{background:var(--fb)}
.more{font-size:12px;color:var(--muted);padding:0 6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* fila */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .mono{font-size:12px;margin-left:4px}
.daygroup h3{font-family:var(--f-body);font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 4px}
.daygroup h3:first-child{margin-top:4px}
.paused{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 14px}
.paused .ic{color:var(--warn)}

/* biblioteca */
.drop-zone{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);cursor:pointer}
.drop-zone:hover,.drop-zone.over{border-color:var(--accent);color:var(--accent)}
.drop-zone input{position:absolute;width:1px;height:1px;opacity:0}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.media{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.media img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.media .mb{padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.media .mb span{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.media .mb div{display:flex;gap:4px;flex-wrap:wrap}

/* métricas */
.chart-wrap{overflow-x:auto}
.chart-wrap svg{display:block;width:100%;min-width:560px;height:auto}
.heat{display:grid;grid-template-columns:44px repeat(6,minmax(0,1fr));gap:4px;font-size:12px}
.heat .h{color:var(--muted);text-align:center;font-family:var(--f-mono)}
.heat .r{color:var(--muted);align-self:center;font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.05em}
.heat .c{border-radius:6px;aspect-ratio:1.6;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px}
.top-post{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start}
.top-post img{width:96px;height:96px;border-radius:10px;object-fit:cover}
.stats-line{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.stats-line b{color:var(--ink);font-family:var(--f-mono)}

/* contas */
.acc{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.acc:first-of-type{border-top:0}
.acc .net{width:44px;height:44px;border-radius:12px}
.acc .net .ic{width:22px;height:22px}
.acc.soon{opacity:.55}
.acc .net.soon{background:var(--muted)}

/* formulários */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=date],input[type=time],textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:120px;line-height:1.5}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:6px 12px 6px 6px;background:var(--surface);font-weight:600;font-size:14px}
.toggle[aria-pressed="false"]{color:var(--muted)}
.toggle[aria-pressed="false"] .net{background:var(--muted);opacity:.5}
.toggle[aria-pressed="true"]{border-color:var(--ink)}
.counter{font-size:12px;font-family:var(--f-mono);color:var(--muted);text-align:right}
.counter.over{color:var(--bad)}

/* editor */
.modal{position:fixed;inset:0;background:rgba(10,16,13,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);border-radius:16px;width:100%;max-width:1060px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:20px;flex:1}
.sheet-b{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
.cmp-form{padding:18px 20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.cmp-prev{background:var(--surface-2);padding:18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:12px;min-width:0}
.sheet-f{display:flex;gap:8px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.sheet-f .grow{flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sel-media{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sel-media figure{margin:0;position:relative}
.sel-media img{width:64px;height:64px;border-radius:8px;object-fit:cover;display:block}
.sel-media figure button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);display:grid;place-items:center;padding:0}
.sel-media figure button .ic{width:12px;height:12px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px}
.picker button{border:2px solid transparent;padding:0;border-radius:8px;overflow:hidden;background:none}
.picker button[aria-pressed="true"]{border-color:var(--accent)}
.picker img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.ai-box{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(0deg,var(--surface),var(--surface))}
.ai-box .head{display:flex;align-items:center;gap:8px;font-weight:600}
.ai-box .head .ic{color:var(--accent)}
.ai-box .src{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;background:var(--surface);font-size:14px;white-space:pre-wrap}
.opt:hover{border-color:var(--accent)}
.opt small{display:block;color:var(--accent);margin-top:6px;font-size:12px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:9px;padding:9px 12px;font-size:14px}
.prev-tabs{align-self:flex-start}
.phone{background:var(--surface);border-radius:14px;border:1px solid var(--line);overflow:hidden;font-size:13px}
.phone .ph{display:flex;align-items:center;gap:8px;padding:10px 12px}
.phone .ph .avatar{width:28px;height:28px;font-size:11px}
.phone .ph b{font-size:13px;display:block;line-height:1.2}
.phone .ph small{color:var(--muted);font-size:11px}
.phone .pimg{aspect-ratio:1;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);position:relative}
.phone .pimg.reel{aspect-ratio:9/12}
.phone .pimg img{width:100%;height:100%;object-fit:cover;display:block}
.phone .pimg .badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;padding:1px 8px;font-size:11px;font-family:var(--f-mono)}
.phone .pact{display:flex;gap:12px;padding:8px 12px 2px;color:var(--ink)}
.phone .ptxt{padding:6px 12px 12px;white-space:pre-wrap;word-break:break-word}
.phone .ptxt .tag{color:var(--fb)}
.phone.fb .ptxt{padding-top:0}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:80;width:min(440px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:10px;padding:11px 14px;font-size:14px;box-shadow:var(--shadow);animation:in .2s ease-out}
.toast.bad{background:var(--bad);color:#fff}
@keyframes in{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== camada futurista ===== */
body{background:
  radial-gradient(1100px 620px at 8% -12%,rgba(168,85,247,.26),transparent 60%),
  radial-gradient(900px 520px at 108% 6%,rgba(34,228,255,.18),transparent 60%),
  radial-gradient(900px 640px at 50% 118%,rgba(255,61,166,.16),transparent 60%),
  var(--bg);background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(120,130,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(120,130,255,.07) 1px,transparent 1px);
  background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 25%,transparent 80%);mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 25%,transparent 80%)}
.app{position:relative;z-index:1}
h1,h2,h3{font-weight:700;letter-spacing:-.01em}
.card h2{font-size:15px;letter-spacing:.02em}

const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const iso=d=>`${ymd(d)}T${hm(d)}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

const DOW=['dom','seg','ter','qua','qui','sex','sáb'];
const DOWL=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const fmtN=n=>Number(n||0).toLocaleString('pt-BR');
function dayLabel(d){
  const t=new Date();t.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);
  const diff=Math.round((x-t)/864e5);
  const base=`${DOWL[x.getDay()]}, ${x.getDate()} de ${MESES[x.getMonth()]}`;
  if(diff===0)return 'Hoje, '+base; if(diff===1)return 'Amanhã, '+base; if(diff===-1)return 'Ontem, '+base;
  return base.charAt(0).toUpperCase()+base.slice(1);
}

/* ---------- imagens de exemplo ---------- */
function art(label,bg,fg,variant){

    ?`<path d="M0 300 Q100 230 200 300 T400 300 V400 H0z" fill="${fg}" opacity=".18"/><circle cx="320" cy="90" r="46" fill="${fg}" opacity=".3"/>`
    :`<rect x="230" y="50" width="130" height="130" rx="22" fill="${fg}" opacity=".2" transform="rotate(12 295 115)"/>`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="${bg}"/>${shapes}<text x="36" y="300" font-family="Georgia,serif" font-size="40" font-weight="700" fill="${fg}">${label}</text><rect x="36" y="322" width="120" height="8" rx="4" fill="${fg}" opacity=".55"/></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

function brandText(){const b=S.brand;return `Negócio: ${b.nome}. Ramo: ${b.ramo}. Cidade: ${b.cidade}. Público: ${b.publico}. Tom de voz: ${b.tom}. Produtos: ${b.produtos}. Diferenciais: ${b.diferenciais}. Contato: ${b.contato}.`}
function parseJSON(t){const a=t.indexOf('{'),b=t.lastIndexOf('}');return JSON.parse(t.slice(a,b+1))}
async function askClaude(prompt){
  const s=await getSample();
  if(!s)return null;
  try{const r=await s(prompt,{modelTier:'quick'});return parseJSON(r.text)}
  catch(e){if(e&&(e.code==='not_granted'))sampleOff=true;return null}
}
async function gerarLegendas(tema,formato,redes){
  const prompt=`Você escreve legendas de redes sociais para pequenos negócios brasileiros.
${brandText()}
Tema do post: ${tema||'apresentação do negócio'}. Formato: ${FMT[formato]}. Redes: ${redes.map(r=>r==='ig'?'Instagram':'Facebook').join(' e ')}.

Responda SOMENTE com JSON: {"opcoes":[{"legenda":"...","hashtags":["#..."]}]} com 3 opções: curta, média e longa.`;
  const j=await askClaude(prompt);
  if(j&&Array.isArray(j.opcoes)&&j.opcoes.length){iaFonte='ia';return j.opcoes.slice(0,3).map(o=>({legenda:String(o.legenda||''),hashtags:(o.hashtags||[]).join(' ')}))}
  iaFonte='modelo';return gerarLocal(tema);
}
function gerarLocal(tema){
  const b=S.brand,t=(tema||'nossos produtos').trim(),cid=(b.cidade.split(',')[0]||'').toLowerCase().replace(/\s+/g,'');
  const tags=`#${cid} #${b.ramo.split(' ')[0].toLowerCase()} #${t.split(' ')[0].toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'')} #comerciolocal`;
  return [
    {legenda:`${t.charAt(0).toUpperCase()+t.slice(1)} esperando por você aqui na ${b.nome}. Passa hoje!`,hashtags:tags},
    {legenda:`Tem novidade na ${b.nome}: ${t}. Feito com o cuidado de sempre e ${b.diferenciais}. Chama no ${b.contato} e garanta o seu.`,hashtags:tags},
    {legenda:`Quem conhece a ${b.nome} sabe: aqui tudo é pensado para ${b.publico.toLowerCase()}.\n\nHoje o destaque é ${t}. ${b.diferenciais.charAt(0).toUpperCase()+b.diferenciais.slice(1)}, do jeito que você gosta.\n\nVem visitar a gente em ${b.cidade} ou peça pelo ${b.contato}.`,hashtags:tags+' #feitocomcarinho'}
  ];
}
async function gerarIdeias(){

metricas(){
  const pub=S.posts.filter(p=>p.status==='publicado'&&p.met).sort((a,b)=>a.data.localeCompare(b.data));
  const sum=k=>pub.reduce((s,p)=>s+p.met[k],0);
  const top=pub.slice().sort((a,b)=>(b.met.curtidas+b.met.comentarios+b.met.salvamentos)-(a.met.curtidas+a.met.comentarios+a.met.salvamentos))[0];
  // gráfico de barras: alcance por post
  const W=640,H=240,L=52,R=16,T=16,B=40,cw=W-L-R,ch=H-T-B;
  const max=Math.max(1,...pub.map(p=>p.met.alcance)),step=max>3000?1000:500,ymax=Math.ceil(max/step)*step;
  const ticks=[];for(let v=0;v<=ymax;v+=step)ticks.push(v);
  const bw=pub.length?Math.min(48,cw/pub.length*0.6):0;
  const bx=i=>L+cw*(i+.5)/pub.length;const by=v=>T+ch-(v/ymax)*ch;
  const best=pub.reduce((m,p)=>p.met.alcance>m?p.met.alcance:m,0);
  const svg=pub.length?`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Alcance por post publicado"><defs><linearGradient id="gbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF3DA6"/><stop offset=".5" stop-color="#A855F7"/><stop offset="1" stop-color="#22E4FF"/></linearGradient></defs>
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${by(v)}" y2="${by(v)}" stroke="rgba(140,150,255,.14)" stroke-width="1"/><text x="${L-8}" y="${by(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono,monospace">${fmtN(v)}</text>`).join('')}
    ${pub.map((p,i)=>`<rect x="${bx(i)-bw/2}" y="${by(p.met.alcance)}" width="${bw}" height="${by(0)-by(p.met.alcance)}" rx="4" fill="${p.met.alcance===best?'url(#gbar)':'var(--accent-soft)'}" stroke="var(--accent)" stroke-width="${p.met.alcance===best?0:1}"><title>${shortDate(new Date(p.data))}: ${fmtN(p.met.alcance)} contas alcançadas</title></rect>
      ${p.met.alcance===best?`<text x="${bx(i)}" y="${by(p.met.alcance)-6}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)" font-family="JetBrains Mono,monospace">${fmtN(p.met.alcance)}</text>`:''}
      <text x="${bx(i)}" y="${H-B+18}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="JetBrains Mono,monospace">${shortDate(new Date(p.data))}</text>
      <text x="${bx(i)}" y="${H-B+32}" text-anchor="middle" font-size="10" fill="var(--muted)">${FMT[p.formato]}</text>`).join('')}
  </svg>`:'<div class="empty-state">Publique o primeiro post para ver as métricas.</div>';
  const keys=['seg','ter','qua','qui','sex','sáb','dom'];

/* ---------- interações globais ---------- */
const armed=new WeakMap();
function needConfirm(btn,label){
  if(btn.classList.contains('armed')){btn.classList.remove('armed');return true}
  const old=btn.innerHTML;btn.classList.add('armed','danger');btn.textContent=label||'Confirmar';
  clearTimeout(armed.get(btn));armed.set(btn,setTimeout(()=>{btn.classList.remove('armed');btn.innerHTML=old},3200));
  return false;
}
function simulatePublish(p,label){
  const failNet=p.redes.find(r=>!S.accounts[r].on);
  p.status='publicando';save();render();
  setTimeout(()=>{
    if(failNet){p.status='falhou';p.erro=`A conta do ${failNet==='ig'?'Instagram':'Facebook'} está desconectada. Reconecte em Contas e tente de novo.`;toast('Não foi possível publicar: conta desconectada.','bad')}
    else{p.status='publicado';delete p.erro;p.met={alcance:0,curtidas:0,comentarios:0,salvamentos:0};toast(`${label||'Publicado'} no ${p.redes.map(r=>r==='ig'?'Instagram':'Facebook').join(' e no ')} (simulação).`)}
    save();render();
  },1300);
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.closest('.modal'))return;
  const act=b.dataset.act,id=b.dataset.id,p=id?postById(id):null;
  switch(act){
    case 'novo':openComposer();break;
    case 'editar':if(p)openComposer(p);break;
    case 'ver':if(p)toast(`Publicado em ${shortDate(new Date(p.data))} às ${hm(new Date(p.data))}. ${p.met?fmtN(p.met.alcance)+' contas alcançadas.':''}`);break;
    case 'dia-novo':{const d=b.dataset.date;openComposer(null,{data:d+'T'+bestTime(d)});break}
    case 'duplicar':if(p){const c=JSON.parse(JSON.stringify(p));c.id=uid();c.status='rascunho';delete c.met;delete c.erro;const d=addDays(new Date(),1);c.data=ymd(d)+'T'+bestTime(ymd(d));S.posts.push(c);save();toast('Cópia criada como rascunho para amanhã.');openComposer(c)}break;
    case 'publicar':if(p&&needConfirm(b,'Confirmar envio'))simulatePublish(p);break;
    case 'retry':if(p){simulatePublish(p,'Publicado')}break;
    case 'excluir':if(p&&needConfirm(b,'Excluir?')){S.posts=S.posts.filter(x=>x!==p);save();render();toast('Post excluído.')}break;
    case 'filtro':ui.filaFiltro=b.dataset.f;render();break;
    case 'pausar':S.paused=!S.paused;save();render();toast(S.paused?'Fila pausada.':'Fila retomada. Os posts voltam a sair no horário.');break;
    case 'cal-prev':ui.calMonth=new Date(ui.calMonth.getFullYear(),ui.calMonth.getMonth()-1,1);render();break;
    case 'cal-next':ui.calMonth=new Date(ui.calMonth.getFullYear(),ui.calMonth.getMonth()+1,1);render();break;
    case 'cal-hoje':{const d=new Date();ui.calMonth=new Date(d.getFullYear(),d.getMonth(),1);render();break}
    case 'ideias':ui.ideiasLoading=true;render();ui.ideias=await gerarIdeias();ui.ideiasLoading=false;render();break;
    case 'ideia-usar':{const i=ui.ideias&&ui.ideias.lista[+b.dataset.i];if(i)openComposer(null,{tema:i.tema,formato:i.formato,autoGerar:true});break}
    case 'conectar':{const r=b.dataset.net;S.accounts[r].on=true;S.accounts[r].nome=r==='ig'?'@'+S.brand.handle:S.brand.nome;save();render();toast((r==='ig'?'Instagram':'Facebook')+' conectado (simulação).');break}
    case 'desconectar':if(needConfirm(b,'Desconectar?')){S.accounts[b.dataset.net].on=false;save();render();toast('Conta desconectada.')}break;
    case 'midia-usar':openComposer(null,{media:[id]});break;
    case 'midia-del':if(needConfirm(b,'Excluir?')){S.media=S.media.filter(m=>m.id!==id);S.posts.forEach(x=>x.media=x.media.filter(mid=>mid!==id));save();render();toast('Imagem excluída.')}break;
    case 'restaurar':if(needConfirm(b,'Confirmar restauração')){S=seed();save();ui.ideias=null;render();toast('Dados de exemplo restaurados.')}break;
    case 'limpar':if(needConfirm(b,'Confirmar: apagar tudo')){const brand=S.brand;S={exemplo:false,brand:{...brand,nome:'Meu negócio',handle:'meunegocio'},accounts:{ig:{on:false,nome:''},fb:{on:false,nome:''}},paused:false,media:[],posts:[]};save();ui.ideias=null;render();toast('Tudo apagado. Preencha Minha marca para começar.')}break;
  }
});

/* calendário: arrastar para remarcar */
function bindCalendarDnD(){
  document.querySelectorAll('.chip[draggable="true"]').forEach(c=>c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move'}));
  document.querySelectorAll('.day').forEach(d=>{
    d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('drop')});
    d.addEventListener('dragleave',()=>d.classList.remove('drop'));
    d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('drop');
      const p=postById(e.dataTransfer.getData('text/plain'));if(!p)return;
      const nd=d.dataset.date+'T'+p.data.slice(11);
      if(new Date(nd)<new Date()){toast('Escolha um dia que ainda não passou.','bad');return}
      p.data=nd;save();render();toast(`Remarcado para ${dayLabel(new Date(nd)).toLowerCase()} às ${nd.slice(11)}.`);
    });
  });
}
/* biblioteca: upload */
function readFiles(files,cb){
  [...files].filter(f=>f.type.startsWith('image/')).forEach(f=>{
    const fr=new FileReader();fr.onload=()=>{
      const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const s=Math.min(1,1080/Math.max(img.width,img.height));c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
        const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
        const m={id:uid(),nome:f.name.replace(/\.[^.]+$/,''),src:c.toDataURL('image/jpeg',.82)};S.media.push(m);save();cb(m)};
      img.src=fr.result};fr.readAsDataURL(f);
  });
}
function bindUpload(){
  const inp=$('#upFile'),z=$('#dropZone');
  inp.addEventListener('change',()=>{readFiles(inp.files,()=>{render();toast('Imagem adicionada à biblioteca.')})});
  z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over')});
  z.addEventListener('dragleave',()=>z.classList.remove('over'));
  z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('over');readFiles(e.dataTransfer.files,()=>{render();toast('Imagem adicionada à biblioteca.')})});
}

  C=post?{id:post.id,redes:[...post.redes],formato:post.formato,media:[...post.media],legenda:post.legenda,hashtags:post.hashtags,data:post.data,status:post.status,tema:''}
    :{id:null,redes:['ig','fb'],formato:preset.formato||'foto',media:preset.media||[],legenda:'',hashtags:'',data:preset.data||def,status:'novo',tema:preset.tema||''};
  C.prev='ig';C.picker=false;C.opcoes=null;C.loading=false;C.erro='';
  renderComposer();
  document.body.style.overflow='hidden';
  setTimeout(()=>{const el=$('#cmp-tema');if(el&&!C.legenda)el.focus()},30);
  if(preset.autoGerar)runAI();

  syncFields();
  const len=C.legenda.length+(C.hashtags?C.hashtags.length+2:0),nTags=(C.hashtags.match(/#[^\s#]+/g)||[]).length;
  const c=$('#cmp-count');c.textContent=`${fmtN(len)} / 2.200 caracteres do Instagram`;c.classList.toggle('over',len>2200);
  const t=$('#cmp-tags');t.textContent=`${nTags} de até 30 hashtags`;t.classList.toggle('over',nTags>30);
  $('#cmp-preview').innerHTML=previewHTML();
}
async function runAI(){
  syncFields();C.loading=true;C.erro='';renderComposer();
  C.opcoes=await gerarLegendas(C.tema,C.formato,C.redes.length?C.redes:['ig']);
  if(!C)return;C.loading=false;renderComposer();
}
function validate(kind){
  if(!C.redes.length)return 'Escolha pelo menos uma rede.';
  if(kind==='rascunho')return '';
  if(!C.legenda.trim()&&!C.media.length)return 'O post está vazio. Adicione uma imagem ou uma legenda.';
  if(C.redes.includes('ig')&&!C.media.length)return 'O Instagram exige pelo menos uma imagem.';
  if(C.formato==='carrossel'&&C.media.length<2)return 'Carrossel precisa de pelo menos 2 imagens.';
  if(C.legenda.length+C.hashtags.length>2200)return 'A legenda passou do limite de 2.200 caracteres do Instagram.';
  if((C.hashtags.match(/#[^\s#]+/g)||[]).length>30)return 'O Instagram aceita no máximo 30 hashtags.';
  if(kind==='agendar'){
    const [d,t]=C.data.split('T');if(!d||!t)return 'Escolha a data e a hora da publicação.';
    if(new Date(C.data)<=new Date())return 'Esse horário já passou. Escolha um horário futuro ou use Publicar agora.';
  }
  return '';
}
function commit(status){
  let p=C.id?postById(C.id):null;
  const data={redes:[...C.redes],formato:C.formato,media:[...C.media],legenda:C.legenda.trim(),hashtags:C.hashtags.trim(),data:C.data.length>=16?C.data:ymd(addDays(new Date(),1))+'T'+bestTime(),status};
  if(p){Object.assign(p,data);delete p.erro}else{p=Object.assign({id:uid()},data);S.posts.push(p)}
  save();return p;
}
function bindComposer(){
  const root=$('.modal');
  ['cmp-legenda','cmp-hash','cmp-data','cmp-hora'].forEach(id=>{const el=$('#'+id);el.addEventListener('input',liveUpdate);if(id==='cmp-data')el.addEventListener('change',()=>{syncFields();renderComposer()})});
  $('#cmp-tema').addEventListener('input',()=>{C.tema=$('#cmp-tema').value});
  $('#cmp-tema').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();runAI()}});
  $('#cmp-file').addEventListener('change',e=>{syncFields();readFiles(e.target.files,m=>{if(!C)return;if(C.formato!=='carrossel')C.media=[m.id];else if(C.media.length<10)C.media.push(m.id);renderComposer()})});
  root.addEventListener('mousedown',e=>{if(e.target===root)root.dataset.down='1'});
  root.addEventListener('click',e=>{
    if(e.target===root&&root.dataset.down==='1'){closeComposer();return}
    root.dataset.down='';
    const b=e.target.closest('[data-c]');if(!b)return;const a=b.dataset.c;
    syncFields();
    switch(a){
      case 'fechar':closeComposer();return;
      case 'rede':{const r=b.dataset.r;C.redes=C.redes.includes(r)?C.redes.filter(x=>x!==r):[...C.redes,r];break}
      case 'fmt':C.formato=b.dataset.f;if(C.formato!=='carrossel'&&C.media.length>1)C.media=[C.media[0]];if(C.formato==='reels')C.redes=C.redes.length?C.redes:['ig'];break;
      case 'picker':C.picker=!C.picker;break;
      case 'pick':{const id=b.dataset.id;if(C.media.includes(id))C.media=C.media.filter(x=>x!==id);else if(C.formato==='carrossel'){if(C.media.length<10)C.media.push(id)}else{C.media=[id];C.picker=false}break}
      case 'rm-media':C.media.splice(+b.dataset.i,1);break;
      case 'gerar':runAI();return;
      case 'usar-opt':{const o=C.opcoes[+b.dataset.i];C.legenda=o.legenda;C.hashtags=o.hashtags;break}
      case 'melhor':{const d=C.data.split('T')[0]||ymd(addDays(new Date(),1));C.data=d+'T'+bestTime(d);toast(`Horário ajustado para ${bestTime(d)}, quando seu público mais interage.`);break}
      case 'prev':C.prev=b.dataset.p;break;
      case 'excluir':if(needConfirm(b,'Confirmar exclusão')){S.posts=S.posts.filter(p=>p.id!==C.id);save();toast('Post excluído.');closeComposer()}return;
      case 'rascunho':{const er=validate('rascunho');if(er){C.erro=er;break}commit('rascunho');toast('Rascunho salvo.');closeComposer();return}
      case 'agendar':{const er=validate('agendar');if(er){C.erro=er;break}const p=commit('agendado');const d=new Date(p.data);toast(`Agendado para ${dayLabel(d).toLowerCase()} às ${hm(d)}.`);closeComposer();return}
      case 'agora':{const er=validate('agora');if(er){C.erro=er;break}const p=commit('agendado');p.data=iso(new Date());closeComposer();simulatePublish(p);return}
    }
    C.erro='';renderComposer();
  });
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&C)closeComposer()});

/* ---------- publicação automática (simulada) ---------- */
function tick(){
  if(S.paused)return;
  const now=new Date();let changed=false;
  S.posts.forEach(p=>{
    if(p.status==='agendado'&&new Date(p.data)<=now){
      const bad=p.redes.find(r=>!S.accounts[r].on);
      if(bad){p.status='falhou';p.erro=`A conta do ${bad==='ig'?'Instagram':'Facebook'} estava desconectada no horário. Reconecte e tente de novo.`}
      else{p.status='publicado';p.met={alcance:0,curtidas:0,comentarios:0,salvamentos:0}}
      changed=true;toast(p.status==='publicado'?`Post das ${hm(new Date(p.data))} publicado automaticamente (simulação).`:'Um post agendado falhou. Veja em Início.',p.status==='falhou'?'bad':'');
    }
  });
  if(changed){save();if(!C)render();else renderNav()}
}
setInterval(tick,20000);

render();tick();
})();
</script>
