<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LCP Lesson 10 · English 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap">
<style>
/* Layout: one light workbook column; each section has its own bright color, frames are white cards, answers glow green or red */
:root{
  color-scheme:light;
  --bg:#F4F6FF; --surface:#FFFFFF; --surface-2:#F2F4FE; --surface-3:#E6EAFB; --ink:#1D1A39; --muted:#656A8A; --line:#E3E6F5; --line-2:#C5CBE6;
  --blue:#3E63FF; --blue-soft:#E7EDFF; --blue-ink:#2546D9;
  --violet:#8B5CF6; --violet-soft:#F1EAFF; --violet-ink:#6A3BE0;
  --coral:#FF6B57; --coral-soft:#FFECE8; --coral-ink:#D9442F;
  --mint:#12B886; --mint-soft:#DCF7EE; --mint-ink:#0A7F5C;
  --orange:#FF8A1F; --orange-soft:#FFF0E0; --orange-ink:#C25A00;
  --pink:#FF4F9A; --pink-soft:#FFE6F2; --pink-ink:#D02D76;
  --sun:#FFC72C; --sun-ink:#3D2C00; --sun-edge:#E2A800;
  --ok:#0F9F72; --ok-soft:#DDF7EE; --ok-ink:#087453;
  --bad:#EF4458; --bad-soft:#FFE7EA; --bad-ink:#C3253A;
  --warn:#F2A10A; --warn-soft:#FFF4D9; --warn-ink:#8F5600;
  --pic:#FFFFFF;
  --sec:var(--blue); --sec-soft:var(--blue-soft); --sec-ink:var(--blue-ink);
  --shadow:0 14px 34px -18px rgba(40,52,150,.35), 0 2px 6px rgba(40,52,150,.05);
  --font-display:"Sora","Plus Jakarta Sans","Segoe UI",system-ui,Arial,sans-serif;
  --font-body:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --r:24px;
}
[data-view="vocabulary"],.tab[data-tab="vocabulary"]{--sec:var(--blue);--sec-soft:var(--blue-soft);--sec-ink:var(--blue-ink)}
[data-view="grammar"],.tab[data-tab="grammar"]{--sec:var(--violet);--sec-soft:var(--violet-soft);--sec-ink:var(--violet-ink)}
[data-view="practice"],.tab[data-tab="practice"]{--sec:var(--coral);--sec-soft:var(--coral-soft);--sec-ink:var(--coral-ink)}
[data-view="you-know-how"],.tab[data-tab="you-know-how"]{--sec:var(--mint);--sec-soft:var(--mint-soft);--sec-ink:var(--mint-ink)}
[data-view="wcp2"],[data-view="pmp2"],.tab[data-tab="wcp2"],.tab[data-tab="pmp2"]{--sec:var(--orange);--sec-soft:var(--orange-soft);--sec-ink:var(--orange-ink)}
[data-view="results"],.tab[data-tab="results"]{--sec:var(--pink);--sec-soft:var(--pink-soft);--sec-ink:var(--pink-ink)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%;
  background-image:radial-gradient(900px 420px at 100% -10%,rgba(255,79,154,.10),transparent 60%),radial-gradient(800px 400px at -10% 0%,rgba(62,99,255,.10),transparent 60%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--sec);outline-offset:2px}
button{font:inherit}
b,strong{font-weight:700}

/* header */
.top{background:rgba(255,255,255,.86);backdrop-filter:saturate(1.4) blur(8px);-webkit-backdrop-filter:saturate(1.4) blur(8px)}
.top .wrap{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:space-between;padding-block:16px 12px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.lesson{font-family:var(--font-display);font-weight:800;font-size:14px;letter-spacing:.12em;color:#fff;padding:9px 16px;border-radius:999px;white-space:nowrap;
  background:linear-gradient(120deg,var(--coral) 0%,var(--pink) 55%,var(--violet) 100%);box-shadow:0 8px 18px -8px rgba(255,79,154,.7)}
.lesson b{font-size:20px;letter-spacing:0;margin-left:4px;vertical-align:-1px}
.brand-text{min-width:0}
.brand-text small{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.brand-text strong{font-family:var(--font-display);font-size:17px;font-weight:700}
.student{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:14px}
.student label{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600}
.student input{font:inherit;font-size:15px;font-weight:600;color:var(--ink);background:var(--surface-2);border:2px solid transparent;border-radius:12px;padding:6px 12px;width:200px;max-width:52vw;transition:border-color .2s,background .2s}
.student #cls{width:72px}
.student input::placeholder{color:#A3A8C3;font-weight:500}
.student input:focus{outline:none;background:#fff;border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.tabs-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(255,255,255,.9);backdrop-filter:saturate(1.4) blur(8px);-webkit-backdrop-filter:saturate(1.4) blur(8px);box-shadow:0 8px 20px -16px rgba(40,52,150,.5)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;font-size:14px;font-weight:700;color:var(--muted);background:transparent;border:0;border-radius:999px;padding:8px 14px;cursor:pointer;display:flex;gap:8px;align-items:center;transition:background .2s,color .2s}
.tab::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sec)}
.tab:hover{color:var(--ink);background:var(--sec-soft)}
.tab[aria-selected="true"]{background:var(--sec);color:#fff;box-shadow:0 6px 14px -8px var(--sec)}
.tab[aria-selected="true"]::before{background:#fff}
.tab .count{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--sec-ink);background:var(--sec-soft);border-radius:99px;padding:1px 8px}
.tab[aria-selected="true"] .count{background:rgba(255,255,255,.25);color:#fff}
.tab.complete .count{background:var(--ok);color:#fff}

main{padding-block:28px 80px}
.view{display:grid;gap:20px}
.view.enter-view{animation:rise .35s ease-out}
.sec-head h1{font-family:var(--font-display);font-size:clamp(24px,4.6vw,32px);line-height:1.15;margin:0 0 6px;font-weight:800;letter-spacing:-.01em;color:var(--ink);text-wrap:balance}
.sec-head h1::after{content:"";display:block;width:56px;height:6px;border-radius:99px;margin-top:10px;background:linear-gradient(90deg,var(--sec),var(--pink))}
.sec-head p{color:var(--muted);margin:0;max-width:64ch;font-size:15px}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}

/* frames */
.frame,.ex,.map{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.frame,.ex{scroll-margin-top:76px}
.frame{overflow:hidden}
.frame.enter{animation:rise .3s ease-out}
.fhead{display:flex;align-items:center;gap:12px;padding:20px 24px 0}
.fnum{font-family:var(--font-display);font-weight:800;font-size:17px;min-width:42px;height:42px;padding:0 10px;display:inline-grid;place-items:center;background:var(--sec);color:#fff;border-radius:14px;font-variant-numeric:tabular-nums;box-shadow:0 6px 14px -8px var(--sec)}
.lead{background:var(--sec-soft);color:var(--sec-ink);padding:5px 14px;border-radius:999px;font-weight:700;font-size:15px}
.fbody{padding:18px 24px 6px;display:grid;gap:18px}
@media (min-width:700px){.fbody.has-pic{grid-template-columns:minmax(0,1fr) 270px;align-items:start}}
@media (max-width:699px){.fbody.has-pic figure.pic{order:-1}.fbody figure.pic svg,.fbody figure.pic img{max-height:190px}}
@media (min-width:700px){.fbody.has-pic.pic-left{grid-template-columns:270px minmax(0,1fr)}.fbody.pic-left figure.pic{order:-1}}
.ftext{min-width:0}
.ftext p{margin:0 0 12px;max-width:66ch}
.ftext p.task{font-size:18px;line-height:2.3;font-weight:500}
.ftext p.line{margin:0 0 4px}
.ftext p.line.task{line-height:2.15}
.ftext p.line + p:not(.line){margin-top:14px}
.ftext p.note{font-size:14px;color:var(--muted);margin-top:-6px}
.ftext u{text-decoration:underline 3px var(--sec);text-underline-offset:5px}
sup{font-size:.6em;line-height:0}
figure.pic{margin:0;background:var(--pic);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;justify-content:center;align-items:center}
figure.pic svg{width:100%;height:auto;display:block;max-height:250px}
figure.pic img{display:block;width:100%;max-width:min(100%,var(--w,100%));height:auto;max-height:250px;object-fit:contain;mix-blend-mode:multiply}
figure.pic-s3iv{padding:8px}
figure.pic-s3iv svg,figure.pic-s3iv img{max-height:none}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;margin-top:4px}
.gal-item{display:grid;gap:4px;align-content:start;min-width:0}
.gal-item p.cap{margin:0;font-size:17px;line-height:2.1;font-weight:500}
.gal-item figure.pic img{max-height:170px}
.move-ex{font-size:18px;padding-top:22px}
.moveq{position:relative;display:inline-block}
.moveq svg{position:absolute;left:0;right:0;bottom:100%;width:100%;height:20px;color:var(--sec);overflow:visible}
.moveq b{color:var(--sec-ink)}
.factions{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center;justify-content:space-between;padding:16px 24px 22px}
.factions .left{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.frame > .fb{margin:6px 24px 0}
.end-text{font-family:var(--font-display);font-size:22px;font-weight:800;margin:6px 0 10px}

/* blanks */
.blank{display:inline-flex;align-items:baseline;gap:3px;vertical-align:baseline;white-space:nowrap}
.bl,.lbox{font:inherit;font-weight:700;color:var(--sec-ink);background:var(--surface-2);border:2px solid var(--line);border-bottom-color:var(--sec);border-radius:10px;padding:0 .35em;line-height:1.45;text-align:center;min-width:0;transition:background-color .2s,border-color .2s,box-shadow .2s}
.bl.w-s{width:3.8em}.bl.w-m{width:6.6em}.bl.w-l{width:9em}.bl.w-xl{width:11.2em}
.lbox{width:1.7em;padding:0}
.bl:focus,.lbox:focus{outline:none;background:#fff;border-color:var(--sec);box-shadow:0 0 0 4px var(--sec-soft)}
.bl.armed{border-style:dashed;border-color:var(--sec);background:#fff}
.blank.ok .bl,.blank.ok .lbox{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-ink)}
.blank.bad .bl,.blank.bad .lbox{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-ink)}
.sep{font-weight:700}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

/* buttons */
.btn{font-weight:700;font-size:15px;border-radius:14px;padding:11px 20px;border:2px solid transparent;cursor:pointer;line-height:1.25;transition:transform .08s,box-shadow .08s,filter .2s}
.btn-primary{background:var(--sec);color:#fff;box-shadow:0 4px 0 var(--sec-ink)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sec-ink)}
.btn-small{padding:8px 16px;font-size:14px;border-radius:12px}
.btn-ghost{background:#fff;color:var(--ink);border-color:var(--line);box-shadow:0 3px 0 var(--line)}
.btn-ghost:hover{border-color:var(--sec);box-shadow:0 3px 0 var(--sec-soft)}
.btn-ghost:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn-danger{background:var(--bad);color:#fff;box-shadow:0 3px 0 var(--bad-ink)}
.btn-link{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px;font-weight:600;cursor:pointer;padding:6px 4px}
.btn-link:hover{color:var(--ink)}
.ai-btn{display:inline-flex;gap:6px;align-items:center}
.ticket{position:relative;font-family:var(--font-display);font-weight:800;font-size:15px;letter-spacing:.01em;color:var(--sun-ink);background:var(--sun);border:0;border-radius:999px;padding:11px 20px 11px 22px;cursor:pointer;
  box-shadow:0 4px 0 var(--sun-edge);display:inline-flex;align-items:center;gap:8px;transition:transform .08s,box-shadow .08s,filter .2s}
.ticket::after{content:"\2192";font-size:18px;line-height:1}
.ticket:hover:not(:disabled){filter:brightness(1.05)}
.ticket:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--sun-edge)}
.ticket:disabled{background:var(--surface-3);color:#9AA0BF;box-shadow:none;cursor:not-allowed}
.ticket.ready{animation:bounce .55s ease-out}
@keyframes bounce{0%{transform:scale(.85)}55%{transform:scale(1.08)}100%{transform:none}}
.choice-opt.btn-ghost{border-radius:16px;padding:12px 14px 12px 18px;font-size:16px}
.choice-opt .ticket{box-shadow:0 3px 0 var(--sun-edge)}

/* feedback */
.fb{border-radius:16px;padding:14px 16px;font-size:15px;line-height:1.5;color:var(--ink)}
.fb.ok{background:var(--ok-soft);animation:pop .35s ease-out}
.fb.bad{background:var(--bad-soft)}
.fb.almost{background:var(--warn-soft)}
.fb.creative{background:var(--violet-soft)}
.fb.info{background:var(--surface-2)}
.fb-title{font-weight:800;margin:0;display:flex;gap:8px;align-items:center}
.fb.ok .fb-title{color:var(--ok-ink)}.fb.bad .fb-title{color:var(--bad-ink)}.fb.almost .fb-title{color:var(--warn-ink)}.fb.creative .fb-title{color:var(--violet-ink)}
.fb-title svg{flex:0 0 auto;width:20px;height:20px}
.fb ul{margin:6px 0 0;padding-left:20px}
.fb p{margin:6px 0 0}
.fb p.fb-title{margin:0}
.clue{display:flex;gap:10px;align-items:baseline}
.tag{flex:0 0 auto;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#fff;color:var(--ink);border-radius:99px;padding:3px 10px;box-shadow:0 1px 0 var(--line)}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.01)}100%{transform:none}}
.burst{position:fixed;width:0;height:0;pointer-events:none;z-index:30}
.burst i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:3px;animation:burst .75s cubic-bezier(.2,.7,.3,1) forwards}
.burst i:nth-child(odd){border-radius:50%}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.4);opacity:0}}

/* frame map */
.map{padding:16px 20px 18px}
.map h2,.label{font-family:var(--font-display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface-2);color:var(--muted);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;position:relative;padding:0;transition:transform .12s,background .2s}
.chip:hover{transform:translateY(-2px);background:var(--sec-soft);color:var(--sec-ink)}
.chip.done{background:var(--ok-soft);color:var(--ok-ink)}
.chip.first::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.chip.review{background:var(--warn-soft);color:var(--warn-ink)}
.chip.skipped{opacity:.45;background:transparent;box-shadow:inset 0 0 0 2px var(--surface-3)}
.chip.cur{background:var(--sec);color:#fff;box-shadow:0 6px 14px -8px var(--sec)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--surface-2);position:relative}
.legend .lg-done i,.legend .lg-first i{background:var(--ok-soft)}
.legend .lg-first i::after{content:"";position:absolute;top:2px;right:2px;width:4px;height:4px;border-radius:50%;background:var(--ok)}
.legend .lg-review i{background:var(--warn-soft)}

/* exercises */
.ex{padding:22px 22px 24px;display:grid;gap:16px;min-width:0}
.ex h2{font-family:var(--font-display);font-size:17px;line-height:1.45;margin:0;font-weight:700;text-wrap:balance}
.rn{display:inline-block;font-family:var(--font-display);font-weight:800;color:var(--sec-ink);background:var(--sec-soft);border-radius:10px;padding:1px 9px;margin-right:.5em;letter-spacing:.02em}
.example{background:var(--surface-2);border-radius:18px;padding:14px 18px;font-size:15px}
.example p{margin:0}
.example .ans{font-style:normal;font-weight:600;text-decoration:underline dotted 2px var(--sec);text-underline-offset:5px}
.items{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.item{display:grid;gap:8px;min-width:0}
.item .prompt{margin:0;font-size:16px;font-weight:500}
.item .prompt .no,.task .no{font-weight:800;color:var(--sec-ink);margin-right:.4em;font-variant-numeric:tabular-nums}
.item .ref{font-size:14px;color:var(--muted);margin:0}
.item-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.line-in{flex:1 1 240px;min-width:0;font:inherit;font-size:16px;font-weight:500;color:var(--ink);background:var(--surface-2);border:2px solid transparent;border-radius:14px;padding:10px 14px;transition:border-color .2s,background .2s,box-shadow .2s}
.line-in:focus{outline:none;background:#fff;border-color:var(--sec);box-shadow:0 0 0 4px var(--sec-soft)}
textarea.line-in{resize:vertical;min-height:4.6em;line-height:1.5}
.item.ok .line-in{border-color:var(--ok);background:var(--ok-soft)}
.item.bad .line-in{border-color:var(--bad);background:var(--bad-soft)}
.item.almost .line-in{border-color:var(--warn)}
.item.creative .line-in{border-color:var(--violet)}
.status-dot{width:22px;height:22px;flex:0 0 auto}
.task{margin:0;font-size:17px;line-height:2.25}
.group-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dialogue p{margin:0 0 6px;padding-left:4.2em;text-indent:-4.2em;line-height:2.15}
.dialogue p:not(.line){margin-top:14px}
.dialogue p:first-child{margin-top:0}
.dialogue b{font-weight:700;color:var(--sec-ink)}
.bn{font-size:12px;color:var(--muted);font-weight:700;margin-left:2px;font-variant-numeric:tabular-nums}
.sec-note{margin:0;font-size:14px;color:var(--muted)}
.label.part{margin:14px 0 -6px;font-size:13px;color:var(--sec-ink)}

/* Lesson 9 VI matching */
.match{display:grid;gap:16px}
@media (min-width:760px){.match{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}}
.col{background:var(--surface-2);border-radius:18px;padding:14px 16px;min-width:0}
.col h3{font-family:var(--font-display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--sec-ink);margin:0 0 8px}
.col ol{margin:0;padding-left:1.4em;display:grid;gap:10px;font-size:15px}
.brows{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;align-items:start;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.brow.ok{border-color:var(--ok);background:var(--ok-soft)}
.brow.bad{border-color:var(--bad);background:var(--bad-soft)}
.box{width:40px;height:40px;border:2px solid var(--line-2);border-radius:12px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--sec-ink);background:#fff}
.btext{margin:0;font-size:15px;align-self:center}
.nums{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
@media (max-width:520px){.nums{grid-column:1 / -1}.nums .hint{flex-basis:100%}.col{padding:12px}.brow{padding:10px}}
.nums .hint{font-size:12px;color:var(--muted);margin-right:2px;font-weight:600}
.num{width:34px;height:32px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;padding:0}
.num:hover{border-color:var(--sec)}
.num[aria-pressed="true"]{background:var(--sec);border-color:var(--sec);color:#fff}

/* Lesson 9 VII ad */
.ad{border:1px solid var(--line);border-radius:20px;padding:18px;text-align:center;background:#fff;color:var(--ink);display:grid;gap:8px;justify-items:center}
.ad svg,.ad img{width:100%;max-width:380px;height:auto;display:block;mix-blend-mode:multiply}

        <input id="mc-code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC-1234" aria-label="Student code">
        <p class="mc-err" role="alert"></p>
        <div class="mc-row"><button class="mc-link" type="button" data-mc="later">Not now</button><button class="mc-btn" type="button" data-mc="ok">Save my code</button></div></div>`;
      document.body.append(modal);
      modal.addEventListener('click', e => { const b = e.target.closest('[data-mc]'); if (b) (b.dataset.mc === 'ok' ? useCode() : closeModal()); else if (e.target === modal) closeModal(); });
      $('#mc-code', modal).addEventListener('keydown', e => { if (e.key === 'Enter') useCode(); if (e.key === 'Escape') closeModal(); });
    }
    $('.mc-txt', modal).textContent = me
      ? 'Your answers are saved online with this code. To use another code, type it below.'
      : (forSend ? 'To send your answers, type the code your teacher gave you. You only need to do this once.'
        : 'Type the code your teacher gave you. Your answers are saved online, and you can continue on any device.');
    const who = $('.mc-who', modal); who.hidden = !me; who.textContent = me ? `✓ ${me.nome || 'Student'} · ${me.code}` : '';
    $('.mc-err', modal).textContent = '';
    $('#mc-code', modal).value = '';
    modal.hidden = false;
    setTimeout(() => $('#mc-code', modal).focus(), 50);
  }
  function closeModal() { if (modal) modal.hidden = true; try { sessionStorage.setItem('mc-later', '1'); } catch (e) {} }
  async function useCode() {
    const inp = $('#mc-code', modal), err = $('.mc-err', modal), btn = $('[data-mc="ok"]', modal);
    const code = inp.value.toUpperCase().replace(/\s+/g, '').replace(/[^A-Z0-9-]/g, '');
    if (!code) { err.textContent = 'Type your code.'; return; }
    btn.disabled = true; err.textContent = '';
    let a = null;
    try { a = await getDoc(`alunos/${code}`); } catch (e) { err.textContent = 'No internet right now. Try again in a moment.'; btn.disabled = false; return; }
    btn.disabled = false;
    if (!a) { err.textContent = 'We couldn’t find this code. Check it and try again.'; return; }
    ready = false;                       /* nothing the page writes now may count as new work */
    me = {code, nome: a.nome || ''};
    put('mc-aluno', JSON.stringify(me));
    modal.hidden = true;
    await start();                       /* may bring the answers from another device (and reload) */
    fillName();
  }
  function fillName() {
    const nm = $('#name') || $('#studentName');
    if (me && nm && !nm.value.trim() && me.nome) { nm.value = me.nome; nm.dispatchEvent(new Event('input', {bubbles: true})); }
  }

  /* ---------- teacher's corrections (student side) ---------- */
  async function loadCorr() {
    if (!me || !ON) return;
    try {
      const d = await getDoc(`correcoes/${docId()}`);
      if (d && d.reset && d.reset !== get(RKEY())) { const r = await getDoc(`progresso/${docId()}`).catch(() => null); if (await applyReset(d, r)) return; }
      corrMap = (d && d.itens) || {}; paintCorr(corrMap, false);
    } catch (e) {}
  }

  /* ---------- start ---------- */
  document.addEventListener('DOMContentLoaded', () => {
    if (!KEY && isFormPage()) {
      formMode = true; KEY = FORMKEY;
      const s = get(KEY); lastSig = sig(s); if (s) applyForm(s);
      const keep = e => { if (e.target instanceof Element && e.target.matches('input, textarea, select') && !e.target.closest('.mc-modal, .mc-t')) { try { localStorage.setItem(KEY, formState()); } catch (err) {} } };
      document.addEventListener('input', keep, true);
      document.addEventListener('change', keep, true);
    }
    pill = document.createElement('button');
    pill.type = 'button'; pill.className = 'mc-pill'; pill.innerHTML = '<i class="dot"></i><span></span>';
    pill.addEventListener('click', () => openModal(false));
    document.body.append(pill);
    setStatus(status);
    let wiped = false; try { wiped = !!(me && sessionStorage.getItem('mc-wiped:' + docId())); sessionStorage.removeItem('mc-wiped:' + docId()); } catch (e) {}
    if (wiped) { const n = document.createElement('div'); n.className = 'mc-wiped'; n.setAttribute('role', 'status'); n.innerHTML = `${ICONS.note}<span>Your teacher cleared this activity. You can start it again.</span>`; document.body.append(n); setTimeout(() => n.remove(), 8000); }
    let later = false; try { later = !!sessionStorage.getItem('mc-later'); } catch (e) {}
    if (ON && !me && !later) setTimeout(() => openModal(false), 700);
    start().then(() => { if (ON && ready) fillName(); });
    setInterval(beat, 60000);
    setInterval(() => { if (document.visibilityState === 'visible') loadCorr(); }, 90000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') { if (pushT && me) push(null, true).catch(() => {}); }
      else { beat(); loadCorr(); }
    });
    window.addEventListener('pagehide', () => { if (pushT && me) push(null, true).catch(() => {}); });
    window.addEventListener('online', () => { if (me && ready) schedule(300); });
    watchCorr();
  });

  /* ===================== shared: anchors + correction bubbles ===================== */
  function anchorsList() {
    const out = [];
    $$('main .item[data-id]').forEach(el => {
      const ta = el.querySelector('textarea');
      out.push({key: 'i:' + el.dataset.id, el, item: true, open: !!ta, answered: !!(ta && ta.value.trim())});
    });
    $$('.question-card').forEach((el, n) => {
      const ta = el.querySelector('textarea');
      out.push({key: 'q:' + (n + 1), el, item: true, open: !!ta, answered: !!(ta && ta.value.trim())});
    });
    $$('main section.view').forEach(v => {
      let n = 0;
      $$('article.ex', v).forEach(el => {
        n++;
        if (el.classList.contains('send-card') || el.classList.contains('item') || el.querySelector('#reset-area, [data-act="reset"], [data-act="send"]') || !el.querySelector('h2')) return;
        out.push({key: 'e:' + (el.id || `${v.dataset.view}-${n}`), el, item: false, open: false});
      });
    });
    return out;
  }
  function host(a) { return a.item ? (a.el.querySelector('.work') || a.el) : a.el; }
  function place(a, node) {
    if (a.item) host(a).append(node);
    else { const h = a.el.querySelector('h2'); h.after(node); }
  }
  function paintCorr(map, teacher) {
    painting = true;
    try {
      const seen = parse(get('mc-seen:' + LESSON) || '{}') || {};
      const list = anchorsList();
      let count = 0, fresh = 0, first = null;
      list.forEach(a => {
        const c = map[a.key];
        let node = host(a).querySelector(':scope > .mc-sfb');
        if (!a.item) node = a.el.querySelector(':scope > .mc-sfb');
        if (!c) { if (node) node.remove(); return; }
        count++;
        const isNew = !teacher && seen[a.key] !== c.t;
        if (isNew) fresh++;
        if (!first) first = node || a;
        const html = bubble(c, isNew ? ' new' : '');
        if (node && node.dataset.v === String(c.t) + c.m + c.c) return;
        if (!node) { node = document.createElement('div'); node.className = 'mc-sfb'; place(a, node); }
        node.dataset.v = String(c.t) + c.m + c.c;
        node.innerHTML = html;
      });
      if (!teacher) banner(count, fresh, map);
    } finally { painting = false; }
  }
  function banner(count, fresh, map) {
    let b = $('.mc-banner');
    if (!count) { if (b) b.remove(); return; }
    const main = $('main') || $('.content') || document.body; if (!main) return;
    if (!b) { b = document.createElement('div'); b.className = 'mc-banner'; main.prepend(b); }
    b.innerHTML = `<span class="mc-fi">${ICONS.note}</span><div><b>${fresh ? `New notes from your teacher` : `Notes from your teacher`}</b><span>Your teacher left ${count} ${count > 1 ? 'notes' : 'note'} on this lesson. ${fresh ? 'They are under your answers.' : ''}</span></div><button type="button">${fresh ? 'Show me' : 'See them'}</button>`;
    b.querySelector('button').onclick = () => {
      const all = $$('.mc-sfb .mc-fb');
      const t = $('.mc-sfb .mc-fb.new') || all[0];
      if (t) t.scrollIntoView({behavior: 'smooth', block: 'center'});
      const seen = {}; Object.entries(map).forEach(([k, c]) => { seen[k] = c.t; }); put('mc-seen:' + LESSON, JSON.stringify(seen));
      setTimeout(() => { $$('.mc-fb.new').forEach(x => x.classList.remove('new')); banner(count, 0, map); }, 2500);
    };
  }
  /* the engines redraw parts of the page: put the bubbles back */
  function watchCorr() {
    const main = $('main') || document.body; if (!main) return;
    let t;
    new MutationObserver(() => { if (painting) return; clearTimeout(t); t = setTimeout(() => { if (Object.keys(corrMap).length) paintCorr(corrMap, false); }, 120); }).observe(main, {childList: true, subtree: true});
  }

  /* ===================== TEACHER VIEW UI ===================== */
  function teacherView() {
    const P = (() => { try { return window.parent !== window ? window.parent.__mcProf : null; } catch (e) { return null; } })();
    let tmap = {};
    if (VIEW && VIEW.key && VIEW.key.startsWith('form:')) applyForm(VIEW.estado);
    /* read-only: the student's answers can be looked at, not changed */
    const allow = '.mc-t, .tabs, .tab, .sm-fab, .sm-sheet, [data-act="jump"], [data-act="goto-results"], [data-act="goto"], a[href^="#"]';
    const block = e => {
      const t = e.target; if (!(t instanceof Element)) return;
      if (t.closest(allow)) return;
      if (t.closest('button, input, textarea, select, label, [data-act], .mc-opt, .num, .lbox, .bl')) { e.preventDefault(); e.stopPropagation(); }
    };
    ['click', 'keydown', 'beforeinput', 'paste', 'drop'].forEach(ev => document.addEventListener(ev, e => { if (ev === 'keydown' && !(e.target instanceof Element && e.target.matches('input, textarea'))) return; block(e); }, true));
    document.addEventListener('mousedown', e => { if (e.target instanceof Element && e.target.closest('select') && !e.target.closest('.mc-t')) e.preventDefault(); }, true);
    const ro = () => $$('input, textarea, select').forEach(i => { if (!i.closest('.mc-t')) { i.readOnly = true; i.tabIndex = -1; } });
    function decorate() {
      ro();
      anchorsList().forEach(a => {
        const hostEl = host(a);
        a.el.classList.toggle('mc-open', !!(a.open && a.answered));
        const open = a.open ? (a.answered ? 'ans' : 'vazio') : '';
        let box = a.item ? hostEl.querySelector(':scope > .mc-t') : a.el.querySelector(':scope > .mc-t');
        if (!box) { box = document.createElement('div'); box.className = 'mc-t'; box.dataset.key = a.key; box.dataset.open = open; place(a, box); drawBox(box); }
        else if ((box.dataset.v !== stamp(tmap[a.key]) || box.dataset.open !== open) && !box.querySelector('.mc-ed')) { box.dataset.open = open; drawBox(box); }
      });
    }
    const stamp = c => c ? String(c.t) + c.m + c.c : '';
    function drawBox(box) {
      const k = box.dataset.key, c = tmap[k];
      box.dataset.v = stamp(c);
      const tag = c ? '' : box.dataset.open === 'ans' ? '<span class="mc-tag">Resposta aberta · para você corrigir</span><br>'
        : box.dataset.open === 'vazio' ? '<span class="mc-tag" style="background:#F1F3F5;color:#868E96">O aluno ainda não respondeu</span><br>' : '';
      const PT = {ok: 'Certo', quase: 'Quase', refazer: 'Refazer', nota: 'Comentário'};
      box.innerHTML = (c ? bubble(c).replace(/Your teacher · [^<]*/, 'Sua correção · ' + (PT[c.m] || PT.nota)) : tag) +
        `<button type="button" class="mc-tbtn" data-mc="edit">✎ ${c ? 'Editar correção' : (k.startsWith('e:') ? 'Comentar o exercício' : 'Corrigir')}</button>`;
    }
    function editor(box) {
      const k = box.dataset.key, c = tmap[k] || {m: box.dataset.open ? 'ok' : 'nota', c: ''};
      box.innerHTML = `<div class="mc-ed"><div class="mc-seg" role="group" aria-label="Avaliação">
        ${[['ok', '✓ Certo'], ['quase', '~ Quase'], ['refazer', '↺ Refazer'], ['nota', 'i Só comentário']].map(([v, l]) => `<button type="button" class="${v}" data-m="${v}" aria-pressed="${c.m === v}">${l}</button>`).join('')}</div>
        <textarea placeholder="Comentário para o aluno (ele vai ler isto no site dele)">${esc(c.c || '')}</textarea>
        <div class="mc-row"><span class="mc-st"></span><span><button type="button" class="mc-link" data-mc="cancel">Cancelar</button>${tmap[k] ? '<button type="button" class="mc-link" data-mc="del">Apagar</button>' : ''} <button type="button" class="mc-btn" data-mc="save">Salvar</button></span></div></div>`;
      const ta = box.querySelector('textarea'); ta.readOnly = false; ta.tabIndex = 0; ta.focus();
    }
    document.addEventListener('click', async e => {
      const box = e.target.closest('.mc-t'); if (!box) return;
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.mc === 'edit') return editor(box);
      if (b.dataset.m) { $$('.mc-seg button', box).forEach(x => x.setAttribute('aria-pressed', String(x === b))); return; }
      if (b.dataset.mc === 'cancel') return drawBox(box);
      if (!P) { $('.mc-st', box).textContent = 'Abra pelo painel do professor para salvar.'; return; }
      const st = $('.mc-st', box);
      if (b.dataset.mc === 'del') { st.textContent = 'Apagando…'; box.dataset.saving = '1'; try { await P.salvar(PROF, box.dataset.key, null); } catch (err) { delete box.dataset.saving; st.textContent = 'Não consegui apagar.'; } return; }
      if (b.dataset.mc === 'save') {
        const m = ($('.mc-seg button[aria-pressed="true"]', box) || {}).dataset; const txt = box.querySelector('textarea').value.trim();
        st.textContent = 'Salvando…'; b.disabled = true; box.dataset.saving = '1';
        try { await P.salvar(PROF, box.dataset.key, {m: (m && m.m) || 'nota', c: txt}); }
        catch (err) { delete box.dataset.saving; st.textContent = 'Não consegui salvar. Tente de novo.'; b.disabled = false; }
      }
    });
    /* new corrections from the panel: redraw the boxes that changed (a box being edited is kept, unless it is the one just saved) */
    window.__mcCorr = map => {
      tmap = map || {};
      $$('.mc-t').forEach(box => {
        const now = stamp(tmap[box.dataset.key]);
        if (box.dataset.v === now && !box.dataset.saving) return;
        if (box.querySelector('.mc-ed') && !box.dataset.saving) return;
        delete box.dataset.saving;
        drawBox(box);
      });
      decorate();
    };
    window.__mcAnchors = () => anchorsList().map(a => ({key: a.key, open: a.open}));
    let t;
    new MutationObserver(() => { clearTimeout(t); t = setTimeout(decorate, 150); }).observe(document.body, {childList: true, subtree: true});
    decorate();
    if (P && P.pronto) P.pronto(PROF, window);
  }
})();
</script>

const $ = (s, r = document) => r.querySelector(s);

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const typo = s => esc(String(s)).replace(/&quot;([^&]*)&quot;/g, '“$1”').replace(/'/g, '’');
const norm = s => String(s || '').toLowerCase().replace(/[’‘`´]/g, "'").replace(/[“”"]/g, '')

const pick = a => a[Math.floor(Math.random() * a.length)];
const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function lev(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}

function burst(el) {
  if (!el || reduceMotion()) return;
  const r = el.getBoundingClientRect();
  if (!r.width) return;
  const colors = ['#3E63FF', '#FF6B57', '#12B886', '#FFC72C', '#8B5CF6', '#FF4F9A'];
  const box = document.createElement('div');
  box.className = 'burst';
  box.style.left = (r.left + Math.min(r.width / 2, 120)) + 'px';
  box.style.top = (r.top + Math.min(r.height / 2, 26)) + 'px';
  for (let i = 0; i < 16; i++) {
    const d = document.createElement('i'), a = Math.PI * 2 * i / 16 + Math.random() * 0.5, dist = 36 + Math.random() * 46;
    d.style.setProperty('--dx', (Math.cos(a) * dist).toFixed(1) + 'px');
    d.style.setProperty('--dy', (Math.sin(a) * dist - 10).toFixed(1) + 'px');
    d.style.background = colors[i % colors.length];
    box.appendChild(d);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 900);
}

}

/* a choice button: data-x exercise, data-i item, data-v value */
function opt(x, it, v, label, cls) {
  if (it.model) {
    const on = v === it.ans;
    return `<div class="mc-opt model${on ? ' on' : ''} ${cls || ''}" aria-disabled="true"><span class="bx" aria-hidden="true">${on ? '✓' : ''}</span><span>${label}</span></div>`;

}
const tagDone = (word) => `<span class="mtag">${esc(word || 'Model')}</span>`;
const itemAttr = (x, it) => `data-x="${x.id}" data-i="${it.i}"${it.model ? ' data-model="1"' : ''}`;

/* text options with letters (most exercises) */
function renderMC(x) {
  const model = x.list.filter(it => it.model);
  const rest = x.list.filter(it => !it.model);
  const body = it => `${it.src.stem ? `<p class="stem">${typo(it.src.stem)}</p>` : ''}

  return `${model.map(it => `<div class="model-box mc-item" ${itemAttr(x, it)}><div class="model-head">${tagDone('Model')}</div>${body(it)}</div>`).join('')}
    <div class="mc">${rest.map(it => `<div class="mc-item" ${itemAttr(x, it)}><div class="mc-head"><span class="no">${esc(it.n)}.</span></div>${body(it)}</div>`).join('')}</div>`;
}

/* picture pairs: left half = first letter, right half = second */
function renderPairs(x) {
  const [a, b] = x.letters;
  /* separate pictures (two or three), each with its letter under it */
  const k = x.letters.length;
  if (x.two) return `<div class="pic-items${k > 2 ? ' wide-items' : ''}">${x.list.map(it => `<div class="mc-item pic-item pair2${it.model ? ' is-model' : ''}" ${itemAttr(x, it)}>
      <div class="mc-head">${it.model ? tagDone(x.done_word) : `<span class="no">${esc(it.n)}.</span>`}</div>
      <div class="two-pics n${k}">${x.letters.map((l, j) => `<div class="one-pic">${art(it.src.pics[j], `Picture ${it.n}${l}`)}${opt(x, it, l, `<b>${esc(l)}</b>`)}</div>`).join('')}</div></div>`).join('')}</div>`;
  const card = it => `<div class="mc-item pic-item${it.model ? ' is-model' : ''}" ${itemAttr(x, it)}>
      <div class="mc-head">${it.model ? tagDone(x.done_word) : `<span class="no">${esc(it.n)}.</span>`}</div>
      ${art(it.src.pic, `Picture ${it.n}: two scenes, ${a} on the left and ${b} on the right`, 'pairpic')}

/* one choice per row (TRUE/FALSE, PRESENT/FUTURE, A/B/C, YES/NO) */
function choiceRow(x, it) {

  return `<div class="crow mc-item${it.model ? ' is-model' : ''}" ${itemAttr(x, it)}>
      ${it.n === 'Model' ? `<span class="no">${tagDone('Model')}</span>` : /^\d+$/.test(it.n) ? `<span class="no">${esc(it.n)}.</span>` : `<span class="word">${esc(it.n)}</span>`}${it.src.word ? `<span class="word">${typo(it.src.word)}</span>` : ''}

function renderChoice(x) {
  const legend = x.head.some((h, i) => h !== x.labels[i]) ? `<div class="clegend">${x.head.map(h => `<span>${esc(h)}</span>`).join('')}</div>` : '';

    return x.groups.map((g, gi) => `${g.pic ? art(g.pic, 'Picture for this exercise', 'big') : ''}${gi ? '' : legend}${g.title ? `<h3 class="gtitle">${esc(g.title)}</h3>` : ''}

  }
  return `${legend}<div class="pic-items">${x.groups.map((g, gi) => `<div class="pic-item group">
      ${art(g.pic, `Picture ${gi + 1}`)}

/* rows that take one letter or number from a picture strip (hotel guests, old photographs) */
function renderAssign(x) {
  const strip = x.pic ? `<div class="strip-pic">${art(x.pic, 'Picture with labels', 'big')}<div class="strip" style="grid-template-columns:${x.fr.map(f => f + 'fr').join(' ')}">${x.strip.map(s => `<span>${esc(s)}</span>`).join('')}</div></div>` : '';
  const legend = x.legend ? `<div class="clegend">${x.legend.map(h => `<span>${esc(h)}</span>`).join('')}</div>` : '';
  const opts = x.opts.concat(['none']);
  const lab = v => v === 'none' ? esc(x.none) : esc(v);
  return `${strip}${legend}
    <div class="arows">${x.list.map(it => `<div class="arow mc-item${it.model ? ' is-model' : ''}" ${itemAttr(x, it)}>
      <span class="alabel">${esc(it.n)}${it.model ? ' ' + tagDone('Model') : ''}</span>
      <div class="mc-opts pills">${opts.map(v => opt(x, it, v, `<b>${lab(v)}</b>`, v === 'none' ? 'none' : '')).join('')}</div></div>`).join('')}</div>`;
}

/* number the pictures in order */
function renderOrder(x) {
  const vals = x.opts || Array.from({length: x.pics.length}, (_, j) => String(j + 1));
  const all = x.none ? vals.concat('none') : vals;
  const legend = x.legend ? `<div class="clegend">${x.legend.map(h => `<span>${esc(h)}</span>`).join('')}</div>` : '';
  /* typed: a small box under each picture where the student writes the number */
  const answer = it => x.typed
    ? `<label class="ord-in"><span>Number</span>${blank(x, it, 'num')}</label>`
    : `<div class="mc-opts pills${x.none ? '' : ' ordnums'}" style="--k:${all.length}">${all.map(v => opt(x, it, v, `<b>${v === 'none' ? esc(x.none) : v}</b>`, v === 'none' ? 'none' : '')).join('')}</div>`;
  return `${legend}<div class="pic-items three">${x.list.map(it => `<div class="mc-item pic-item${it.model ? ' is-model' : ''}" ${itemAttr(x, it)}>
      <div class="mc-head">${it.src.label ? `<span class="no">${esc(it.src.label)}</span>` : ''}${it.model ? tagDone('Done for you') : ''}</div>
      ${art(it.src.pic, `Picture ${it.src.label || it.i + 1}`)}
      ${answer(it)}</div>`).join('')}</div>`;
}

/* tick everything each person can do (more than one box per person) */
function renderGrid(x) {
  return `<div class="pic-items${x.cols.length % 3 === 0 ? ' three' : ''}">${x.list.map(it => `<div class="mc-item pic-item gcard" ${itemAttr(x, it)}>
      <div class="mc-head"><span class="no">${esc(it.n)}</span></div>

}

/* blanks */
function blank(x, it, w) {
  if (it.model) return `<span class="blank ok given"><input class="bl w-${w}" value="${esc(it.ans)}" disabled aria-label="${esc(it.n)}"></span>`;
  const num = it.num ? ' inputmode="numeric" maxlength="6"' : '';
  return `<span class="blank" ${itemAttr(x, it)}><input class="bl w-${w}" data-x="${x.id}" data-i="${it.i}"${num} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="${esc(it.n)}"></span>`;
}
function renderFill(x) {
  const L = x.list;
  if (x.layout === 'table') return `<div class="ftable"><div class="fth"><span>${esc(x.head[0])}</span><span>${esc(x.head[1])}</span></div>
      ${L.map(it => `<div class="frow"><span class="flabel">${esc(it.n)}</span>${blank(x, it, 'xl')}</div>`).join('')}</div>`;
  if (x.layout === 'money') return `<div class="fgrid">${L.map(it => `<div class="fcell"><span class="flabel">${esc(it.n)}</span><span class="money">$ ${blank(x, it, 's')}</span></div>`).join('')}</div>`;
  if (x.layout === 'numbered') return `<div class="fgrid">${L.map(it => `<div class="fcell row"><span class="no">${esc(it.n)}</span>${blank(x, it, 'l')}</div>`).join('')}</div>`;
  if (x.layout === 'tree') {
    const cell = it => `<div class="tnode"><b>${esc(it.n)}</b><span>${esc(it.src.pre)} ${blank(x, it, 'm')}</span></div>`;
    return `<div class="tree"><div class="tlevel four">${L.slice(0, 4).map(cell).join('')}</div>
      <div class="tlevel two">${L.slice(4, 6).map(cell).join('')}</div>
      <div class="tlevel one"><div class="tnode leaf"><b>${esc(x.leaf)}</b></div></div></div>`;
  }
  /* text with blanks inside (an invitation) */
  return `<div class="card-text">${x.lines.map(line => `<p>${typo(line).replace(/\{(\d+)\}/g, (m, k) => blank(x, L[+k], 'm'))}</p>`).join('')}</div>`;
}

const RENDER = {mc: renderMC, pairs: renderPairs, choice: renderChoice, assign: renderAssign, order: renderOrder, fill: renderFill, grid: renderGrid};

  v.innerHTML = `<div class="sec-head">${x.sect ? `<p class="kicker">${esc(x.sect)}</p>` : ''}<h1>Exercise ${x.r}</h1><p>Your teacher will play the recording. Listen and ${how}. <b>Each answer is saved as soon as you give it, and you can’t change it.</b></p></div>
    <article class="ex" id="ex-${x.id}"><h2><span class="rn">${x.r}.</span>${typo(x.instr)}</h2>
      ${RENDER[x.type](x)}

      <div class="group-actions lock-status"><span class="saved-note" data-saved="${x.id}"></span>${x.type === 'grid' ? `<button class="btn btn-primary" data-act="done" data-x="${x.id}">I’m done</button>` : ''}</div>
    </article>`;

/* ---------- answering: saved on the first answer ---------- */
const exById = id => EX.find(x => x.id === id);
/* an item is answered (and locked) when: pick = an option was chosen; text = the value was saved; set = the exercise was closed with I'm done */
function answered(x, st, it) {

function textOk(it, raw) {

/* ---------- results ---------- */
function tally() {

function report() {

const SEND_CARD = () => `<article class="ex send-card"><h2>Send your answers to your teacher</h2>

    if (!id || id === active) return;
    active = id;
    tabs.forEach(t => { const on = t.dataset.tab === id; t.setAttribute('aria-selected', String(on)); t.tabIndex = on ? 0 : -1; });
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
    fabLabel();
    if (id === 'results') quiet('results');          /* refresh the score when the student gets there */
  }
  /* menu clicks: scroll to the section (the page's own tab switch would hide the others) */
  bar.addEventListener('click', e => {
    const t = e.target.closest('.tab');
    if (!t || inQuiet) return;
    e.stopPropagation(); e.preventDefault();
    const id = t.dataset.tab;
    quiet(id); active = ''; setActive(id); goTo(id, true); closeSheet();
  }, true);
  /* the page itself switching tabs (Go to Section 2, See my results, Start over): show everything and scroll there */
  new MutationObserver(() => {
    if (inQuiet) return;
    const hidden = views.filter(v => v.hidden);
    if (!hidden.length) return;
    const shown = views.filter(v => !v.hidden);
    showAll();
    if (shown.length === 1) { active = ''; setActive(shown[0].dataset.view); goTo(shown[0].dataset.view, false); }
  }).observe(document.querySelector('main'), {attributes: true, attributeFilter: ['hidden'], subtree: true});
  /* follow the reading position */
  let ticking = false;
  function spy() {
    ticking = false;
    const line = Math.min(window.innerHeight * 0.32, 260);
    let cur = ids[0];
    for (const id of ids) { const v = view(id); if (v && v.getBoundingClientRect().top - line <= 0) cur = id; }
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = ids[ids.length - 1];
    setActive(cur);
  }
  window.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(spy); } }, {passive: true});
  window.addEventListener('resize', () => requestAnimationFrame(spy));
  /* phones and tablets: a floating button with the section list */
  const fab = document.createElement('button');
  fab.type = 'button'; fab.className = 'sm-fab'; fab.setAttribute('aria-haspopup', 'true'); fab.setAttribute('aria-expanded', 'false');
  fab.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span></span>';
  const sheet = document.createElement('div');
  sheet.className = 'sm-sheet'; sheet.hidden = true; sheet.setAttribute('role', 'menu');
  document.body.append(sheet, fab);
  const label = t => { const c = t.querySelector('.count'); const txt = (t.textContent || '').replace(c ? c.textContent : '', '').replace(/\s+/g, ' ').trim(); return {txt, count: c ? c.textContent.trim() : ''}; };
  function fabLabel() { const t = tab(active); if (t) fab.querySelector('span').textContent = label(t).txt; }
  function openSheet() {
    sheet.innerHTML = '<p>Sections</p>' + tabs.map(t => { const l = label(t); return `<button type="button" role="menuitem" data-go="${t.dataset.tab}" aria-current="${t.dataset.tab === active}"><span>${l.txt.replace(/[<>&]/g, '')}</span>${l.count ? `<small>${l.count}</small>` : ''}</button>`; }).join('');
    sheet.hidden = false; fab.setAttribute('aria-expanded', 'true');
  }
  function closeSheet() { sheet.hidden = true; fab.setAttribute('aria-expanded', 'false'); }
  fab.addEventListener('click', () => sheet.hidden ? openSheet() : closeSheet());
  sheet.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) { const t = tab(b.dataset.go); if (t) t.click(); closeSheet(); } });
  document.addEventListener('click', e => { if (!sheet.hidden && !sheet.contains(e.target) && !fab.contains(e.target)) closeSheet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  /* start: draw every section once, then go to the one in the address (#…) */
  const wanted = (location.hash || '').slice(1);
  ids.forEach(quiet);
  const start = ids.includes(wanted) ? wanted : ids[0];
  quiet(start); showAll(); setActive(start);
  if (start !== ids[0]) { goTo(start, false); requestAnimationFrame(() => goTo(start, false)); window.addEventListener('load', () => goTo(start, false), {once: true}); }
  else window.scrollTo({top: 0, behavior: 'auto'});
})();
</script>
<!-- scroll-mode:end -->
