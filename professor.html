<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Área do professor · Online English</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2316173A'/%3E%3Cpath d='M14 18h36v24H14z' fill='none' stroke='%23fff' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M24 52l6-10M40 52l-6-10' stroke='%23FFD43B' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap">
<style>
:root{--fundo:#F5F4FB;--papel:#fff;--tinta:#16173A;--tinta-2:#40426A;--tinta-3:#777A9C;--linha:#E6E3F3;--linha-2:#D7D3EA;
  --roxo:#6741D9;--roxo-esc:#4C2DB8;--roxo-claro:#F0EBFF;--azul:#4C6EF5;--azul-esc:#364FC7;--azul-claro:#EDF2FF;--verde:#12B886;--verde-claro:#E6FCF5;
  --ambar:#F59F00;--ambar-claro:#FFF6DC;--coral:#F76707;--vermelho:#FA5252;--lado:#16173A;--lado-2:#23254F;
  --sombra:0 16px 36px -26px rgba(30,25,90,.5);--sombra-2:0 24px 50px -30px rgba(30,25,90,.6)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--tinta);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45}
h1,h2,h3{font-family:Sora,system-ui,sans-serif;margin:0;line-height:1.15;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--roxo);outline-offset:3px;border-radius:10px}
.ic{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* entrada */
.tela{min-height:100vh;display:grid;place-items:center;padding:24px;background:
  radial-gradient(40rem 30rem at 100% 0,rgba(103,65,217,.18),transparent 60%),radial-gradient(34rem 28rem at 0 100%,rgba(247,103,7,.12),transparent 60%),var(--fundo)}
.cartao-login{width:min(880px,100%);display:grid;grid-template-columns:1fr 1fr;border-radius:32px;overflow:hidden;background:var(--papel);box-shadow:var(--sombra-2)}
.cartao-login .lado-l{position:relative;overflow:hidden;padding:40px 36px;color:#fff;background:linear-gradient(150deg,#23254F,#16173A 60%);isolation:isolate}
.cartao-login .lado-l::before{content:"";position:absolute;z-index:-1;width:320px;height:320px;right:-110px;top:-120px;border-radius:50%;background:radial-gradient(circle,rgba(132,94,247,.55),transparent 68%)}
.cartao-login .lado-l::after{content:"";position:absolute;z-index:-1;width:260px;height:260px;left:-90px;bottom:-120px;border-radius:50%;background:radial-gradient(circle,rgba(255,169,77,.35),transparent 68%)}
.cartao-login .lado-l h1{font-size:30px;margin:22px 0 10px}
.cartao-login .lado-l p{opacity:.85;margin:0}
.cartao-login ul{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:12px}
.cartao-login li{display:flex;align-items:center;gap:12px;font-weight:700;font-size:14px}
.cartao-login li span{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.1);flex:none}
.cartao-login li .ic{width:18px;height:18px}
.cartao-login .lado-r{padding:44px 38px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.cartao-login .lado-r h2{font-size:24px}
.cartao-login .lado-r p{color:var(--tinta-3);margin:0}
.selo{width:58px;height:58px;border-radius:19px;display:grid;place-items:center;background:linear-gradient(145deg,#845EF7,#5F3DC4);color:#fff;box-shadow:0 14px 26px -16px rgba(95,61,196,.9)}
.selo .ic{width:30px;height:30px}
.voltar-site{color:var(--tinta-3);font-weight:700;font-size:13.5px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-top:6px}
.voltar-site .ic{width:16px;height:16px;transform:rotate(180deg)}
.voltar-site:hover{color:var(--roxo)}
.erro{color:#C92A2A;font-weight:700;margin:6px 0 0}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:14px;padding:12px 18px;font-weight:800;background:var(--roxo);color:#fff;box-shadow:0 4px 0 var(--roxo-esc);transition:transform .1s;text-decoration:none;white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--roxo-esc)}
.btn.g{background:#fff;color:var(--tinta);border:1.5px solid var(--linha-2);box-shadow:0 3px 0 var(--linha-2)}
.btn.peq{padding:8px 12px;font-size:13.5px;border-radius:12px}
.btn.perigo{background:#fff;color:#C92A2A;border:1.5px solid #FFC9C9;box-shadow:0 3px 0 #FFC9C9}
.btn.perigo:hover{background:#FFF5F5}
.btn .ic,.btn svg{width:18px;height:18px}
.link{border:0;background:none;padding:6px;color:var(--tinta-3);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* casca: menu lateral + conteúdo */
.casca{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.lado{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:20px 14px;background:var(--lado);color:#C9CAE6;overflow-y:auto}
.marca{display:flex;align-items:center;gap:12px;padding:4px 8px 18px;text-decoration:none;color:#fff}
.marca .logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#845EF7,#5F3DC4);flex:none}
.marca .logo .ic{width:22px;height:22px}
.marca strong{display:block;font-family:Sora,sans-serif;font-size:16px}
.marca small{display:block;font-weight:600;font-size:12px;color:#9C9EC8}
.lado nav{display:grid;gap:3px}
.lado .titulo-nav{margin:16px 10px 6px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#7D80AE}
.lado nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;text-decoration:none;font-weight:700;font-size:14.5px;color:#C9CAE6}
.lado nav a:hover{background:var(--lado-2);color:#fff}
.lado nav a[aria-current="page"]{background:#fff;color:var(--tinta)}
.lado nav a[aria-current="page"] .ic{color:var(--roxo)}
.lado nav a .n{margin-left:auto;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.12);font-size:12px}
.lado nav a[aria-current="page"] .n{background:var(--roxo-claro);color:var(--roxo-esc)}
.lado nav a .ponto{margin-left:auto;width:9px;height:9px;border-radius:50%;background:var(--coral)}
.lado .pe-lado{margin-top:auto;display:grid;gap:10px;padding-top:18px}
.lado .ao-site{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--lado-2);color:#fff;text-decoration:none;font-weight:800;font-size:13.5px}
.lado .ao-site .ic{color:#FFD43B}
.lado .ao-site small{display:block;font-weight:600;color:#9C9EC8;font-size:12px}
.lado .eu{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px}
.lado .eu img,.lado .eu .ava{width:34px;height:34px;border-radius:50%}
.lado .eu b{display:block;color:#fff;font-size:13.5px}
.lado .eu button{margin-left:auto;border:0;background:var(--lado-2);color:#C9CAE6;border-radius:10px;padding:7px 10px;font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.lado .eu button .ic{width:15px;height:15px}
.principal{min-width:0}
.barra-topo{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;min-height:70px;padding:0 28px;background:rgba(245,244,251,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--linha)}
.barra-topo h1{font-size:20px}
.barra-topo .dir{margin-left:auto;display:flex;align-items:center;gap:10px}
.menu-btn{display:none}
main{padding:24px 28px 80px;max-width:1240px}
.online-pill{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;background:var(--verde-claro);color:#087F5B;font-weight:800;font-size:13.5px;white-space:nowrap}
.online-pill.zero{background:#ECEAF5;color:var(--tinta-3)}
.pulso{width:9px;height:9px;border-radius:50%;background:var(--verde);box-shadow:0 0 0 0 rgba(18,184,134,.6);animation:pulso 1.6s infinite;flex:none}
.zero .pulso{background:#AEB0CC;animation:none}
@keyframes pulso{70%{box-shadow:0 0 0 9px rgba(18,184,134,0)}100%{box-shadow:0 0 0 0 rgba(18,184,134,0)}}

/* início */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{position:relative;overflow:hidden;display:grid;gap:4px;padding:18px 18px 16px;border-radius:22px;background:var(--papel);border:1px solid var(--linha);box-shadow:var(--sombra);text-decoration:none}
.stat .ic-s{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;margin-bottom:6px;background:var(--c-claro,#F0EBFF);color:var(--c,#6741D9)}
.stat .ic-s .ic{width:21px;height:21px}
.stat b{font-family:Sora,sans-serif;font-size:30px;line-height:1}
.stat span{color:var(--tinta-3);font-weight:700;font-size:13px}
.stat.dest{background:linear-gradient(140deg,#6741D9,#845EF7);color:#fff;border:0}
.stat.dest span{color:rgba(255,255,255,.85)}
.stat.dest .ic-s{background:rgba(255,255,255,.18);color:#fff}
.atalhos{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.titulo-sec{display:flex;align-items:center;gap:10px;margin:30px 0 14px}
.titulo-sec h2{font-size:18px}
.titulo-sec .cont{padding:2px 10px;border-radius:999px;background:#E9E6F5;color:var(--tinta-2);font-weight:800;font-size:12.5px}
.titulo-sec .dir{margin-left:auto}
.vazio{padding:26px;border:2px dashed var(--linha-2);border-radius:22px;color:var(--tinta-3);text-align:center;font-weight:600;background:rgba(255,255,255,.55)}

/* cartões ao vivo */
.ao-vivo{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.vivo{position:relative;display:grid;gap:12px;padding:18px;border-radius:22px;background:var(--papel);border:1.5px solid var(--linha);box-shadow:var(--sombra);text-align:left;color:inherit;width:100%}
.vivo:hover{border-color:var(--k,#6741D9)}
.vivo .cab{display:flex;align-items:center;gap:12px}
.ava{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-family:Sora,sans-serif;font-weight:800;color:#fff;flex:none;font-size:16px}
.vivo .quem strong{display:block;font-size:16px}
.vivo .quem small{display:flex;align-items:center;gap:6px;color:#087F5B;font-weight:800;font-size:12.5px}
.licao-tag{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:13px;background:var(--k-claro,#EDF2FF);color:var(--k-esc,#364FC7);font-weight:800;font-size:13.5px}
.barra{height:9px;border-radius:999px;background:#EEECF6;overflow:hidden}
.barra i{display:block;height:100%;border-radius:999px;background:var(--k,#6741D9);transition:width .4s}
.linha-info{display:flex;justify-content:space-between;gap:10px;color:var(--tinta-3);font-weight:700;font-size:13px}

/* listas */
.lista{display:grid;gap:10px}
.lin{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:13px 16px;border-radius:18px;background:var(--papel);border:1.5px solid var(--linha);color:inherit;text-align:left;width:100%}
.lin:hover{border-color:var(--k,#6741D9)}
.lin .meio strong{display:block;font-size:15px}
.lin .meio small{display:block;color:var(--tinta-3);font-weight:600;font-size:13px;margin-top:2px}
.lin .meio .barra{margin-top:8px;height:7px;max-width:360px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-weight:800;font-size:12px;background:#EEECF6;color:var(--tinta-2);white-space:nowrap;text-decoration:none}
.chip .ic{width:14px;height:14px}
.chip.vivo-c{background:var(--verde-claro);color:#087F5B}
.chip.ent{background:#E7F5FF;color:#1864AB}
.chip.cor{background:var(--roxo-claro);color:#5F3DC4}
.chip.pend{background:var(--ambar-claro);color:#AD5F00}
a.chip:hover{filter:brightness(.96)}

/* alunos */
.novo{display:flex;gap:10px;flex-wrap:wrap;padding:14px;border-radius:22px;background:var(--papel);border:1.5px solid var(--linha);box-shadow:var(--sombra)}
.novo input{flex:1;min-width:200px;padding:12px 14px;border:1.5px solid var(--linha-2);border-radius:14px;font:inherit;font-size:15px}
.novo input:focus{outline:none;border-color:var(--roxo);box-shadow:0 0 0 4px var(--roxo-claro)}
.alunos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px;margin-top:16px}
.aluno{display:grid;gap:12px;padding:18px;border-radius:22px;background:var(--papel);border:1.5px solid var(--linha);text-align:left;color:inherit;width:100%;text-decoration:none}
.aluno:hover{border-color:var(--roxo);box-shadow:var(--sombra)}
.aluno .cab{display:flex;align-items:center;gap:12px}
.aluno strong{font-size:16px;display:block}
.codigo{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:12px;background:#F2F0FA;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;letter-spacing:.06em;font-size:14px;justify-self:start}
.aluno .rod{display:flex;justify-content:space-between;align-items:center;color:var(--tinta-3);font-weight:700;font-size:13px}
.ficha{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:20px;border-radius:26px;background:var(--papel);border:1.5px solid var(--linha);box-shadow:var(--sombra)}
.ficha .ava{width:64px;height:64px;border-radius:20px;font-size:22px}
.ficha h1{font-size:24px}
.ficha .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.voltar{display:inline-flex;align-items:center;gap:6px;margin:0 0 14px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--linha-2);background:#fff;font-weight:800;text-decoration:none;font-size:13.5px}
.voltar .ic{width:16px;height:16px;transform:rotate(180deg)}
.licoes-aluno{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.lc-wrap{display:grid;gap:2px;align-content:start}
.lc-wrap .lc{width:100%}
.apagar-lc{justify-self:end;color:#C92A2A;font-size:13px;opacity:.75}
.apagar-lc:hover{opacity:1}
.lc{display:grid;gap:12px;padding:18px;border-radius:22px;background:var(--papel);border:1.5px solid var(--linha);border-top:6px solid var(--k);text-align:left;color:inherit;width:100%}
.lc:hover{box-shadow:var(--sombra)}
.lc h3{font-size:16px}
.lc .curso{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--k-esc)}
.lc .pct{font-family:Sora,sans-serif;font-weight:800;font-size:22px;color:var(--k-esc)}
.grupo-licao{padding:18px;border-radius:24px;background:var(--papel);border:1.5px solid var(--linha);border-left:7px solid var(--k);margin-bottom:14px;scroll-margin-top:90px}
.grupo-licao .gcab{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:12px}
.grupo-licao h3{font-size:17px}
.grupo-licao .gcab .chips{margin-left:auto}
.grupo-licao .lin{border-radius:14px;padding:10px 14px}

/* curso (professor) */
.nivel-sec{margin-bottom:26px}
.nivel-cab{position:relative;overflow:hidden;display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:20px 22px;border-radius:24px;color:#fff;background:linear-gradient(135deg,var(--k),var(--k-esc));isolation:isolate}
.nivel-cab::after{content:attr(data-n);position:absolute;z-index:-1;right:18px;bottom:-34px;font-family:Sora,sans-serif;font-weight:800;font-size:120px;line-height:1;color:rgba(255,255,255,.15)}
.nivel-cab h2{font-size:22px}
.nivel-cab small{display:block;font-weight:700;opacity:.85;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
.nivel-cab .chips{margin-left:auto;justify-content:flex-start}
.nivel-cab .chip{background:rgba(255,255,255,.16);color:#fff}
.tabela{margin-top:10px;border-radius:22px;background:var(--papel);border:1px solid var(--linha);overflow:hidden}
.tl{display:grid;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--linha)}
.tl:first-child{border-top:0}
.tl .lt{font-family:Sora,sans-serif;font-weight:800;font-size:15px;display:flex;align-items:center;gap:10px}
.tl .lt i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-size:13px;color:#fff;background:var(--k)}
.tl .mats{display:flex;flex-wrap:wrap;gap:10px}
.mt{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:14px;background:#F7F6FC;border:1px solid var(--linha)}
.mt > span{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:13.5px;color:var(--tinta-2)}
.mt > span .ic{width:17px;height:17px;color:var(--k-esc)}
.mini-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:10px;border:0;background:#fff;box-shadow:0 0 0 1px var(--linha-2);font-weight:800;font-size:12.5px;text-decoration:none;color:var(--tinta-2)}
.mini-btn:hover{box-shadow:0 0 0 1.5px var(--k,#6741D9);color:var(--k-esc,#4C2DB8)}
.mini-btn .ic{width:14px;height:14px}
.mini-btn.teste{background:var(--k-claro,#F0EBFF);color:var(--k-esc,#4C2DB8);box-shadow:none}

/* materiais */
.busca{position:relative;margin-bottom:18px}
.busca .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--tinta-3)}
.busca input{width:100%;border:1.5px solid var(--linha);background:var(--papel);border-radius:16px;padding:13px 16px 13px 46px;font:inherit;font-size:15px;font-weight:600}
.busca input:focus{outline:none;border-color:#B197FC;box-shadow:0 0 0 4px var(--roxo-claro)}
.grupo{margin-bottom:24px}
.grupo h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.grupo h3 .cont{padding:2px 9px;border-radius:999px;background:#E9E6F5;color:var(--tinta-2);font-weight:800;font-size:12px;font-family:"Plus Jakarta Sans",sans-serif}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--papel);border:1.5px solid var(--linha);text-decoration:none;color:inherit;text-align:left;width:100%;transition:border-color .15s,box-shadow .15s}
.item:hover{border-color:var(--c,#6741D9);box-shadow:var(--sombra)}
.item .bolinha{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--t,#F0EBFF);color:var(--e,#4C2DB8)}
.item .bolinha .ic{width:21px;height:21px}
.item strong{display:block;font-size:14.5px;line-height:1.25}
.item small{display:block;color:var(--tinta-3);font-weight:600;font-size:12.5px;margin-top:3px}
.item .seta{width:18px;height:18px;color:var(--tinta-3)}
.selo-novo{display:inline-block;margin-left:7px;padding:2px 7px;border-radius:999px;background:#E6FCF5;color:#087F5B;font-size:10.5px;font-weight:800;letter-spacing:.04em;vertical-align:2px}
.pasta-m{border-radius:18px;background:var(--papel);border:1.5px solid var(--linha)}
.pasta-m > .item{border:0}
.pasta-m .filhos{display:grid;gap:8px;padding:0 12px 12px}
.pasta-m .filhos[hidden]{display:none}
.pasta-m .filhos .item{background:#F8F7FC;padding:10px 12px}
.embreve{margin-top:10px;color:var(--tinta-3);font-weight:700;font-size:13px}
.embreve span{display:inline-block;margin:4px 6px 0 0;padding:3px 10px;border-radius:999px;background:#EEECF6}

/* visor */
#visor{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--fundo)}
#visor[hidden]{display:none}
.vbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 16px;background:var(--papel);border-bottom:1.5px solid var(--linha);box-shadow:0 6px 20px -18px rgba(30,25,90,.6)}
.vbar .ava{width:40px;height:40px;border-radius:13px;font-size:15px}
.vbar .quem strong{display:block;font-size:15.5px}
.vbar .quem small{display:block;color:var(--tinta-3);font-weight:700;font-size:12.5px}
.vbar .chips{margin-left:auto}
.vbar .pct{min-width:120px}
.vbar .pct .barra{height:8px;margin-top:4px}
.vbar .pct span{font-weight:800;font-size:12.5px;color:var(--tinta-2)}
.vbar .teste-tag{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:12px;background:var(--ambar-claro);color:#8F4E00;font-weight:800;font-size:13px}
.vbar .teste-tag .ic{width:16px;height:16px}
.vbar .aviso-cod{display:inline-flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-radius:12px;background:#FFF5F5;color:#C92A2A;font-weight:700;font-size:13px}
.vbar .aviso-cod button{border:0;border-radius:9px;padding:5px 9px;background:#fff;color:#C92A2A;font-weight:800;font-size:12.5px;box-shadow:0 0 0 1px #FFC9C9}
[data-modo="teste"] .so-aluno{display:none!important}
[data-modo="aluno"] .so-teste{display:none!important}
#quadro{flex:1;width:100%;border:0;background:#fff}
.aviso-novo{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;background:var(--tinta);color:#fff;font-weight:700;box-shadow:0 18px 40px -14px rgba(19,27,53,.6)}
.aviso-novo[hidden]{display:none}
.aviso-novo button{border:0;border-radius:10px;padding:7px 12px;background:#fff;color:var(--tinta);font-weight:800}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:70;padding:11px 16px;border-radius:14px;background:var(--tinta);color:#fff;font-weight:700;box-shadow:0 18px 40px -14px rgba(19,27,53,.6);animation:desce .25s}
@keyframes desce{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}

@media (max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .casca{grid-template-columns:1fr}
  .lado{position:fixed;z-index:40;left:0;top:0;width:min(290px,86vw);transform:translateX(-105%);transition:transform .22s;box-shadow:20px 0 50px -20px rgba(0,0,0,.5)}
  body.menu-aberto .lado{transform:none}
  body.menu-aberto::after{content:"";position:fixed;inset:0;z-index:35;background:rgba(22,23,58,.35)}
  .menu-btn{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;border:1.5px solid var(--linha-2);background:#fff}
  .barra-topo{padding:0 16px;min-height:62px}
  .barra-topo h1{font-size:18px}
  main{padding:18px 16px 70px}
  .cartao-login{grid-template-columns:1fr}
  .cartao-login .lado-l{padding:30px 26px}
  .cartao-login .lado-r{padding:30px 26px}
}
@media (max-width:640px){
  .lin{grid-template-columns:auto minmax(0,1fr)}.lin .chips{grid-column:1/-1;justify-content:flex-start}
  .vbar .chips{margin-left:0}.vbar .pct{flex:1}
  .tl{grid-template-columns:1fr;gap:8px}
  .online-pill span.txt{display:none}
  .stats{gap:10px}.stat b{font-size:24px}
}
@media (prefers-reduced-motion:reduce){.pulso{animation:none}.toast{animation:none}.lado{transition:none}}
</style>

  app.innerHTML = casca(corpo);
  if (buscaVal && $('#busca-mat')) { $('#busca-mat').value = buscaVal; buscarMat(); }
  if (idFoco && (idFoco === 'novo-nome' || idFoco === 'busca-mat')) { const i = document.getElementById(idFoco); if (i) { if (valor != null) i.value = valor; i.focus(); } }
  window.scrollTo(0, y);
  visorCab();
}
setInterval(desenhar, 15000);

/* ---------- ações ---------- */
const ALF = 'ACDEFGHJKMNPQRTUVWXY34679';
function novoCodigo(nome) {
  const base = (nome || 'ALUNO').trim().split(/\s+/)[0].normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 6) || 'ALUNO';
  for (;;) { let s = ''; for (let i = 0; i < 4; i++) s += ALF[Math.floor(Math.random() * ALF.length)]; const c = `${base}-${s}`; if (!alunos.has(c)) return c; }
}
document.addEventListener('submit', async e => {
  if (e.target.dataset.f !== 'novo') return;
  e.preventDefault();
  const nome = $('#novo-nome').value.trim().replace(/\s+/g, ' ');
  if (!nome) return;
  const code = novoCodigo(nome);
  try { await setDoc(doc(db, 'alunos', code), {nome, criado: serverTimestamp()}); $('#novo-nome').value = ''; toast(`Código de ${nome.split(' ')[0]}: ${code}`); location.hash = '#aluno/' + encodeURIComponent(code); }
  catch (err) { toast('Não consegui criar: ' + (err.code || err.message)); }
});
document.addEventListener('input', e => { if (e.target.id === 'busca-mat') buscarMat(); });
document.addEventListener('click', async e => {
  const v = e.target.closest('[data-ver]');
  if (v) { e.preventDefault(); location.hash = '#ver/' + encodeURIComponent(v.dataset.ver); return; }
  const pa = e.target.closest('[data-pasta]');
  if (pa) { const id = pa.dataset.pasta, ab = !abertas.has(id); ab ? abertas.add(id) : abertas.delete(id); pa.setAttribute('aria-expanded', String(ab)); pa.nextElementSibling.hidden = !ab; return; }
  if (e.target.closest('.ao-site, a[href^="./?professor"]')) { try { sessionStorage.setItem('mc-later', '1'); sessionStorage.setItem('mc-visita-prof', '1'); } catch (x) {} }
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, code = b.dataset.code;
  if (a === 'entrar') { try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (err) { if (err.code !== 'auth/popup-closed-by-user') app.innerHTML = telaLogin('Não deu para entrar: ' + esc(err.code || err.message)); } }
  else if (a === 'sair') { fecharVisor(true); await signOut(auth); location.hash = ''; }
  else if (a === 'menu') document.body.classList.toggle('menu-aberto');
  else if (a === 'msg') copiar(mensagem(alunos.get(code) || {}, code), 'Mensagem copiada. É só colar no WhatsApp do aluno.');
  else if (a === 'cod') copiar(code, 'Código copiado');
  else if (a === 'apagar') { if (confirm(`Apagar ${(alunos.get(code) || {}).nome}? O código deixa de funcionar. As respostas que ele já mandou continuam no painel.`)) { await deleteDoc(doc(db, 'alunos', code)); location.hash = '#alunos'; } }
  else if (a === 'fechar') { history.length > 1 && /^#(ver|testar)\//.test(location.hash) ? history.back() : (location.hash = '#agora'); }
  else if (a === 'atualizar') recarregarQuadro();
  else if (a === 'apagar-envio') apagarEnvio(b.dataset.id || vId);
  else if (a === 'tirar-codigo') { try { localStorage.removeItem('mc-aluno'); } catch (x) {} $('#v-aviso-cod').hidden = true; try { quadro.contentWindow.location.reload(); } catch (x) {} toast('Código tirado deste navegador'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.body.classList.remove('menu-aberto'); });
document.addEventListener('click', e => { if (document.body.classList.contains('menu-aberto') && !e.target.closest('.lado, [data-a="menu"]')) document.body.classList.remove('menu-aberto'); });

/* ---------- visor: a atividade do aluno, na mesma interface que ele usou ---------- */
const visor = $('#visor'), quadro = $('#quadro'), aviso = $('#aviso');
let vId = null, vEstado = null, rolar = null;
window.__mcProf = {
  salvar: async (id, key, val) => {
    const p = prog.get(id) || {};
    const ref = doc(db, 'correcoes', id);
    if (val) await setDoc(ref, {code: p.code || id.split('__')[0], lesson: p.lesson || id.split('__')[1], atualizado: serverTimestamp(), itens: {[key]: {m: val.m, c: val.c, t: Date.now()}}}, {merge: true});
    else await setDoc(ref, {atualizado: serverTimestamp(), itens: {[key]: deleteField()}}, {merge: true});
  },
  pronto: (id, win) => { if (id === vId) { try { win.__mcCorr(((corr.get(id) || {}).itens) || {}); } catch (e) {} if (rolar != null) { const y = rolar; rolar = null; setTimeout(() => { try { win.scrollTo(0, y); } catch (e) {} }, 450); } } }
};
function prepararVisao(id) {
  const p = prog.get(id); if (!p) return false;
  try { localStorage.setItem('mc-view:' + id, JSON.stringify({key: p.key, estado: p.estado})); } catch (e) {}
  vEstado = p.estado;
  return true;
}
function abrirVisor(id) {
  if (!user || !subs.length) return;
  const p = prog.get(id);
  if (!p) { if (prog.size) { toast('Atividade não encontrada'); location.hash = '#agora'; } return; }
  if (vId === id && !visor.hidden) return;
  vId = id; rolar = null;
  visor.dataset.modo = 'aluno';
  prepararVisao(id);
  const u = new URL(p.url, location.href); u.searchParams.set('prof', id); u.searchParams.set('v', Date.now());
  quadro.src = u.toString();
  visor.hidden = false; aviso.hidden = true;
  document.body.style.overflow = 'hidden';
  visorCab();
}
/* modo teste: a lição como o aluno vê, sem código (as respostas ficam só neste navegador e não vão para o painel) */
function abrirTeste(lid) {
  if (!user) return;
  const m = TODOS_MAT.find(i => i.secao === 'curso' && lid === lessonIdOf(i));
  if (!m) { toast('Lição não encontrada'); location.hash = '#curso'; return; }
  try { sessionStorage.setItem('mc-later', '1'); } catch (e) {}
  vId = null;
  visor.dataset.modo = 'teste';
  $('#v-nome').textContent = NOME_MAT.get(lid) || m.t;
  $('#v-licao').textContent = 'Como o aluno vê';
  $('#v-nova-aba').href = m.h;
  let cod = null; try { cod = JSON.parse(localStorage.getItem('mc-aluno') || 'null'); } catch (e) {}
  const av = $('#v-aviso-cod');
  if (cod && cod.code) { av.hidden = false; av.innerHTML = `Este navegador está com o código ${esc(cod.code)}: o teste iria para esse aluno.<button data-a="tirar-codigo">Tirar o código</button>`; }
  else av.hidden = true;
  quadro.src = new URL(m.h, location.href).toString();
  visor.hidden = false; aviso.hidden = true;
  document.body.style.overflow = 'hidden';
}
const lessonIdOf = i => i._id || (i._id = lessonId(i.h));
function fecharVisor(silencioso) {
  if (visor.hidden) return;
  visor.hidden = true; aviso.hidden = true; quadro.src = 'about:blank'; vId = null;
  document.body.style.overflow = '';
  if (!silencioso) desenhar();
}
function visorCab() {
  if (!vId || visor.hidden) return;
  const p = prog.get(vId); if (!p) return;
  const n = nomeDe(p);
  $('#v-ava').textContent = iniciais(n); $('#v-ava').style.background = avaCor(p.code);
  $('#v-nome').textContent = n;
  $('#v-licao').textContent = `${curso(p)} · ${titulo(p)}`;
  $('#v-pct').textContent = `${pct(p)}% feito · ${online(p) ? 'ao vivo' : 'última atividade ' + relativo(p.atualizado)}`;
  $('#v-barra').style.width = pct(p) + '%'; $('#v-barra').style.background = nivel(p.lesson).k;
  $('#v-chips').innerHTML = chipsDe(vId, p);
}
function editando() { try { return !!quadro.contentDocument.querySelector('.mc-ed'); } catch (e) { return false; } }
function recarregarQuadro() {
  if (!vId) return;
  try { rolar = quadro.contentWindow.scrollY; } catch (e) { rolar = null; }
  prepararVisao(vId);
  aviso.hidden = true;
  try { quadro.contentWindow.location.reload(); } catch (e) { abrirVisor(vId); }
}
function visorAtualiza() {
  if (!vId || visor.hidden) return;
  visorCab();
  const p = prog.get(vId);
  if (!p || p.estado === vEstado) return;
  if (editando()) { aviso.hidden = false; return; }
  recarregarQuadro();
  toast(`${nomeDe(p).split(' ')[0]} respondeu mais uma`);
}
function visorCorr() {
  if (!vId || visor.hidden) return;
  try { quadro.contentWindow.__mcCorr && quadro.contentWindow.__mcCorr(((corr.get(vId) || {}).itens) || {}); } catch (e) {}
  visorCab();
}
</script>
</body>
